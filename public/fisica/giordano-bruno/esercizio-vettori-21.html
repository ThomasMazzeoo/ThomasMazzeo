<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esercizio Guidato LIM — L'Auto in Panne (Es. 50) — ISS Giordano Bruno</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body);"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: #0f172a;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.25rem;
    }
    .brand-text h1 { font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
    .brand-text p { font-size: 0.8rem; color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      user-select: none;
    }
    .btn:hover { background: #273549; border-color: var(--accent-blue); }
    .btn-primary { background: #0284c7; border-color: #38bdf8; }
    .btn-primary:hover { background: #0369a1; }
    .btn-amber { background: #b45309; border-color: #fbbf24; }
    .btn-amber:hover { background: #92400e; }

    main {
      flex: 1;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.25rem;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .simulation-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 580px;
    }

    .svg-container {
      width: 100%;
      flex: 1;
      min-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      max-height: 480px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      user-select: none;
    }

    .controls-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .step-pills { display: flex; gap: 0.35rem; }
    .step-pill {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .step-pill.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
      transform: scale(1.1);
    }
    .step-pill.completed {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .details-card {
      overflow-y: auto;
      max-height: 80vh;
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) transparent;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
    }

    .step-title {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    .step-desc {
      font-size: 0.98rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .formula-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent-amber);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      font-size: 1.15rem;
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .data-item {
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .data-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .data-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .tip-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-left: 4px solid var(--accent-green);
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 0.9rem;
      color: #86efac;
      margin-top: auto;
    }

    /* LIM Canvas Overlay */
    #limCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 90;
      pointer-events: none;
    }
    #limCanvas.active { pointer-events: auto; cursor: crosshair; }

    /* LIM Floating Toolbar */
    .lim-toolbar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 0.4rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: #334155; }
    .tool-btn.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
    }
    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-dot.active { border-color: white; transform: scale(1.15); }

    /* Whiteboard Modal */
    .whiteboard-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .whiteboard-overlay.active { display: flex; }
    .wb-header {
      padding: 0.6rem 1.25rem;
      background: #1e293b;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      white-space: nowrap;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .wb-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }
    .wb-body.bg-grid {
      background-color: #ffffff;
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      background-size: 25px 25px;
    }
    .wb-body.bg-dark {
      background-color: #0f172a;
      background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px);
      background-size: 25px 25px;
    }
    #wbCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🚗</div>
      <div class="brand-text">
        <h1>Esercizio 50 — Pag. 112</h1>
        <p>L'Automobile in Panne: Forze Parallele vs Perpendicolari a 90°</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-amber" id="btnWhiteboard">
        <span>📄</span> Foglio Bianco LIM
      </button>
      <button class="btn" id="btnFullscreen">
        <span>⛶</span> Schermo Intero
      </button>
      <a href="/fisica/giordano-bruno/" class="btn">
        <span>↩</span> Indice Esercizi
      </a>
    </div>
  </header>

  <main>
    <!-- Card Grafica / Simulazione -->
    <div class="card simulation-card">
      <div class="svg-container" id="svgContainer">
        <canvas id="limCanvas"></canvas>
        <svg id="simSvg" viewBox="-4 -2 16 11">
          <defs>
            <marker id="arrF1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8" />
            </marker>
            <marker id="arrF2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#4ade80" />
            </marker>
            <marker id="arrR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#f87171" />
            </marker>
            <pattern id="gridCar" width="1" height="1" patternUnits="userSpaceOnUse">
              <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#1e293b" stroke-width="0.04" />
            </pattern>
          </defs>

          <!-- Sfondo asfalto / griglia -->
          <rect x="-3.5" y="-1.5" width="15" height="10" fill="url(#gridCar)" />

          <!-- Vista dall'alto auto in panne (sagoma stilizzata) -->
          <g transform="translate(-2.5, 3.5)">
            <!-- Carrozzeria auto -->
            <rect x="0" y="-1.2" width="2.4" height="2.4" rx="0.5" fill="#334155" stroke="#64748b" stroke-width="0.08" />
            <!-- Parabrezza e tetto -->
            <rect x="0.6" y="-0.9" width="1.1" height="1.8" rx="0.2" fill="#1e293b" />
            <!-- Ruote -->
            <rect x="0.2" y="-1.45" width="0.5" height="0.25" fill="#0f172a" />
            <rect x="1.6" y="-1.45" width="0.5" height="0.25" fill="#0f172a" />
            <rect x="0.2" y="1.2" width="0.5" height="0.25" fill="#0f172a" />
            <rect x="1.6" y="1.2" width="0.5" height="0.25" fill="#0f172a" />
            <text x="1.2" y="0.1" fill="#94a3b8" font-size="0.32" text-anchor="middle">AUTO</text>
          </g>

          <!-- Punto di applicazione delle forze sul retro/centro auto O(0, 3.5) -->
          <circle cx="0" cy="3.5" r="0.15" fill="#fbbf24" />
          <text x="-0.3" y="3.6" fill="#fbbf24" font-size="0.4" font-weight="700" text-anchor="end">O</text>

          <!-- ====== CASO 1: FORZE PARALLELE CONCORDI (Step 1 & 2) ====== -->
          <g id="grpCaseParallel" opacity="1">
            <!-- F1 = 500 N verso destra (lunghezza 5 unità) -->
            <line x1="0" y1="3.2" x2="4.85" y2="3.2" stroke="#38bdf8" stroke-width="0.22" marker-end="url(#arrF1)" />
            <text x="2.5" y="2.9" fill="#38bdf8" font-size="0.45" font-weight="700">F_1 = 500 N</text>

            <!-- F2 = 400 N verso destra (lunghezza 4 unità) -->
            <line x1="0" y1="3.8" x2="3.85" y2="3.8" stroke="#4ade80" stroke-width="0.22" marker-end="url(#arrF2)" />
            <text x="2.0" y="4.35" fill="#4ade80" font-size="0.45" font-weight="700">F_2 = 400 N</text>

            <!-- Risultante F_tot = 900 N (Step 2) -->
            <g id="vecResParallel" opacity="0">
              <line x1="0" y1="5.0" x2="8.85" y2="5.0" stroke="#f87171" stroke-width="0.3" marker-end="url(#arrR)" />
              <text x="4.5" y="5.6" fill="#f87171" font-size="0.55" font-weight="800" text-anchor="middle">F_tot = 500 + 400 = 900 N (Spinta Massima!)</text>
            </g>
          </g>

          <!-- ====== CASO 2: FORZE PERPENDICOLARI A 90° (Step 3, 4, 5) ====== -->
          <g id="grpCasePerp" opacity="0">
            <!-- Invertiamo le ordinate con origine a (0, 3.5) -->
            <g transform="translate(0, 3.5) scale(1, -1)">
              <!-- Rettangolo di costruzione -->
              <rect x="0" y="0" width="5" height="4" fill="rgba(248, 113, 113, 0.12)" stroke="rgba(148, 163, 184, 0.35)" stroke-width="0.05" stroke-dasharray="0.15,0.15" />

              <!-- Arco angolo retto a 90° -->
              <rect x="0" y="0" width="0.6" height="0.6" fill="none" stroke="#fbbf24" stroke-width="0.05" />
              <circle cx="0.3" cy="0.3" r="0.05" fill="#fbbf24" />

              <!-- Arco angolo risultante theta = 38.7° -->
              <path d="M 1.4 0 A 1.4 1.4 0 0 1 1.1 0.87" fill="rgba(251, 191, 36, 0.25)" stroke="#fbbf24" stroke-width="0.05" />

              <!-- Vettore F1 = 500 N lungo asse x -->
              <line x1="0" y1="0" x2="4.85" y2="0" stroke="#38bdf8" stroke-width="0.22" marker-end="url(#arrF1)" />

              <!-- Vettore F2 = 400 N perpendicolare lungo asse y -->
              <line x1="0" y1="0" x2="0" y2="3.85" stroke="#4ade80" stroke-width="0.22" marker-end="url(#arrF2)" />

              <!-- Vettore Risultante Diagonale F_tot = 640 N (Step 4 & 5) -->
              <line id="vecDiag" x1="0" y1="0" x2="4.88" y2="3.9" stroke="#f87171" stroke-width="0.28" marker-end="url(#arrR)" opacity="0" />
            </g>

            <!-- Testi per il caso a 90° -->
            <text x="2.5" y="3.95" fill="#38bdf8" font-size="0.45" font-weight="700">F_1 = 500 N</text>
            <text x="-0.3" y="1.5" fill="#4ade80" font-size="0.45" font-weight="700" text-anchor="end">F_2 = 400 N (90°)</text>
            <text id="lblDiag" x="2.2" y="1.2" fill="#f87171" font-size="0.55" font-weight="800" opacity="0">F_tot = 640 N (Pitagora)</text>
            <text id="lblAlpha" x="1.6" y="3.1" fill="#fbbf24" font-size="0.38" font-weight="700" opacity="0">θ ≈ 39°</text>
          </g>
        </svg>
      </div>

      <!-- Barra di controllo -->
      <div class="controls-bar">
        <div class="step-pills">
          <div class="step-pill active" onclick="goToStep(0)">1</div>
          <div class="step-pill" onclick="goToStep(1)">2</div>
          <div class="step-pill" onclick="goToStep(2)">3</div>
          <div class="step-pill" onclick="goToStep(3)">4</div>
          <div class="step-pill" onclick="goToStep(4)">5</div>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn" id="btnPrev" onclick="prevStep()">⏮ Prec</button>
          <button class="btn btn-primary" id="btnNext" onclick="nextStep()">Succ ⏭</button>
          <button class="btn" onclick="resetSteps()">🔄 Riavvia</button>
        </div>
      </div>
    </div>

    <!-- Card Dettagli Didattici -->
    <div class="card details-card">
      <div id="stepInfo">
        <!-- Generato dinamicamente da JS -->
      </div>
    </div>
  </main>

  <!-- LIM Floating Toolbar -->
  <div class="lim-toolbar">
    <button class="tool-btn" id="btnPen" title="Attiva/Disattiva Penna LIM">✏️</button>
    <button class="tool-btn" id="btnEraser" title="Gomma">🧹</button>
    <div class="color-dot active" style="background: #38bdf8;" onclick="setColor('#38bdf8', this)"></div>
    <div class="color-dot" style="background: #4ade80;" onclick="setColor('#4ade80', this)"></div>
    <div class="color-dot" style="background: #fbbf24;" onclick="setColor('#fbbf24', this)"></div>
    <div class="color-dot" style="background: #f87171;" onclick="setColor('#f87171', this)"></div>
    <button class="tool-btn" id="btnClearCanvas" title="Cancella Scritte">🗑️</button>
  </div>

  <!-- Whiteboard Overlay Modal -->
  <div class="whiteboard-overlay" id="whiteboardOverlay">
    <div class="wb-header">
      <div style="font-weight: 700; color: #f8fafc; display:flex; align-items:center; gap:0.5rem;">
        <span>📄</span> Foglio Bianco LIM — Spazio Libero
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <button class="btn" id="wbPenBtn">✏️ Penna</button>
        <button class="btn" id="wbEraserBtn">🧹 Gomma</button>
        <button class="btn" id="wbHandBtn" title="Trascina foglio">🖐️</button>
        <button class="btn" id="wbZoomIn">🔍+</button>
        <button class="btn" id="wbZoomOut">🔍-</button>
        <button class="btn" id="wbZoomReset">100%</button>
        <button class="btn" id="wbGridToggle">Griglia / Sfondo</button>
        <button class="btn" id="wbClear">🗑️ Svuota</button>
        <button class="btn btn-amber" id="wbClose">✕ Chiudi</button>
      </div>
    </div>
    <div class="wb-body bg-grid" id="whiteboardBody">
      <canvas id="wbCanvas"></canvas>
    </div>
  </div>

  <script>
    const stepsData = [
      {
        badge: "Passo 1 di 5 — Dati del Problema",
        title: "I Due Amici che Spingono l'Auto in Panne",
        desc: "Due amici applicano contemporaneamente due forze sull'auto:<br>• Primo amico: <strong>$F_1 = 500\\text{ N}$</strong><br>• Secondo amico: <strong>$F_2 = 400\\text{ N}$</strong><br><br>Il problema confronta due configurazioni geometriche radicalmente differenti:<br>1. Forze <strong>parallele e concordi</strong> (spingono insieme da dietro).<br>2. Forze <strong>perpendicolari tra loro a $90^\\circ$</strong> (uno spinge da dietro per far avanzare l'auto, l'altro spinge di lato per farla svoltare).",
        formula: "F_1 = 500\\text{ N} \\quad \\text{e} \\quad F_2 = 400\\text{ N}",
        data: [
          { label: "Forza F_1", val: "500 N" },
          { label: "Forza F_2", val: "400 N" },
          { label: "Caso A", val: "Parallele concordi (0°)" },
          { label: "Caso B", val: "Perpendicolari (90°)" }
        ],
        tip: "💡 Questo esercizio illustra la proprietà fondamentale dei vettori: l'intensità della risultante dipende in modo cruciale dall'<strong>angolo</strong> tra le forze!"
      },
      {
        badge: "Passo 2 di 5 — Caso A: Forze Parallele Concordi",
        title: "Domanda 1: Somma Scalare Diretta (900 N)",
        desc: "Quando due forze hanno la <strong>stessa direzione e lo stesso verso</strong>, l'angolo tra loro è $\\theta = 0^\\circ$. Il modulo della forza risultante è la semplice somma algebrica:<br>$$F_{\\text{tot}} = F_1 + F_2 = 500\\text{ N} + 400\\text{ N} = 900\\text{ N}$$<br>La forza risultante ha intensità pari a <strong>$900\\text{ N}$</strong> ed è orientata nel verso del moto dell'auto.<br>Questa è la condizione di <em>massima spinta possibile</em>.",
        formula: "F_{\\text{tot}} = 500\\text{ N} + 400\\text{ N} = 900\\text{ N}",
        data: [
          { label: "Angolo", val: "0° (Concordi)" },
          { label: "Calcolo", val: "500 + 400" },
          { label: "Forza Risultante", val: "900 N" },
          { label: "Efficienza spinta", val: "100% Massima" }
        ],
        tip: "💡 Il modulo massimo che due vettori possono generare è sempre la loro somma algebrica $F_1 + F_2$."
      },
      {
        badge: "Passo 3 di 5 — Caso B: Disposizione Ortogonale a 90°",
        title: "Domanda 2: Configurazione Geometrica a 90°",
        desc: "Ora ipotizziamo che le due forze agiscano ad angolo retto ($\\theta = 90^\\circ$):<br>• $F_1 = 500\\text{ N}$ spinge orizzontalmente in avanti lungo l'asse $x$.<br>• $F_2 = 400\\text{ N}$ spinge perpendicolarmente di lato lungo l'asse $y$.<br><br>Possiamo semplicemente sommare $500 + 400 = 900\\text{ N}$? <strong>ASSOLUTAMENTE NO!</strong> Essendo perpendicolari, le forze non spingono nella stessa direzione: dobbiamo applicare la regola del parallelogramma (che qui diventa un rettangolo).",
        formula: "\\vec{F}_{\\text{tot}} = \\vec{F}_1 + \\vec{F}_2 \\quad \\text{con} \\quad \\vec{F}_1 \\perp \\vec{F}_2",
        data: [
          { label: "Angolo tra le forze", val: "90° (Ortogonali)" },
          { label: "Forma geometrica", val: "Rettangolo" },

          { label: "Cateto verticale", val: "400 N" }
        ],
        tip: "💡 Ricorda: le forze sono vettori! Non si possono sommare i numeri puri a meno che non siano paralleli concordi!"
      },
      {
        badge: "Passo 4 di 5 — Teorema di Pitagora a 90°",
        title: "Calcolo della Diagonale: F_tot = 640 N",
        desc: "Nel rettangolo delle forze, la risultante $\\vec{F}_{\\text{tot}}$ coincide con la <strong>diagonale</strong> ed è l'ipotenusa del triangolo rettangolo formato dai due cateti $F_1$ e $F_2$:<br>$$F_{\\text{tot}} = \\sqrt{F_1^2 + F_2^2} = \\sqrt{(500\\text{ N})^2 + (400\\text{ N})^2}$$<br>Eseguiamo i quadrati:<br>$$F_{\\text{tot}} = \\sqrt{250\\,000 + 160\\,000} = \\sqrt{410\\,000} \\approx 640{,}31\\text{ N} \\approx 640\\text{ N}$$<br>L'intensità è di soli <strong>$640\\text{ N}$</strong>, molto inferiore ai $900\\text{ N}$ del caso precedente!",

        data: [
          { label: "500²", val: "250.000" },
          { label: "400²", val: "160.000" },
          { label: "Somma quadrati", val: "410.000" },
          { label: "Radice quadrata", val: "640 N" }
        ],
        tip: "💡 Spingendo a $90^\circ$ si perdono ben $260\text{ N}$ di spinta efficace in avanti ($900 - 640 = 260\text{ N}$)!"
      },
      {
        badge: "Passo 5 di 5 — Direzione & Confronto Finale",
        title: "Angolo di Deviazione & Riepilogo Risposte",
        desc: "Calcoliamo l'angolo di deviazione $\\theta$ rispetto alla direzione in avanti:<br>$$\\tan\\theta = \\frac{F_2}{F_1} = \\frac{400}{500} = 0{,}80 \\implies \\theta = \\arctan(0{,}80) \\approx 38{,}7^\\circ \\approx 39^\\circ$$<br>L'auto tende a sbandare diagonalmente di circa $39^\\circ$.<br><br><strong>Riepilogo finale delle risposte (pag. 112):</strong><br>• Se parallele e concordi: <strong>$900\\text{ N}$</strong><br>• Se perpendicolari a $90^\\circ$: <strong>$640\\text{ N}$</strong>",
        formula: "\\text{Risultati: } F_{\\text{parallele}} = 900\\text{ N}, \\quad F_{90^\\circ} = 640\\text{ N} \\quad (\\theta \\approx 39^\\circ)",
        data: [
          { label: "Risposta 1 (Parallele)", val: "900 N" },
          { label: "Risposta 2 (90°)", val: "640 N" },
          { label: "Angolo deviazione", val: "38,7°" },
          { label: "Stato finale", val: "Risolto e Verificato!" }
        ],
        tip: "🎯 Perfetto! Hai dimostrato con chiarezza la differenza fondamentale tra somma algebrica unidimensionale e composizione vettoriale bidimensionale con Pitagora."
      }
    ];

    let currentStep = 0;

    function updateSimulation(step) {
      const grpCaseParallel = document.getElementById('grpCaseParallel');
      const vecResParallel = document.getElementById('vecResParallel');
      const grpCasePerp = document.getElementById('grpCasePerp');
      const vecDiag = document.getElementById('vecDiag');
      const lblDiag = document.getElementById('lblDiag');
      const lblAlpha = document.getElementById('lblAlpha');

      if (step <= 1) {
        // Mostra Caso Parallelo
        grpCaseParallel.setAttribute('opacity', '1');
        grpCasePerp.setAttribute('opacity', '0');
        vecResParallel.setAttribute('opacity', step === 1 ? '1' : '0');
      } else {
        // Mostra Caso Perpendicolare a 90°
        grpCaseParallel.setAttribute('opacity', '0');
        grpCasePerp.setAttribute('opacity', '1');
        
        if (step >= 3) {
          vecDiag.setAttribute('opacity', '1');
          lblDiag.setAttribute('opacity', '1');
        } else {
          vecDiag.setAttribute('opacity', '0');
          lblDiag.setAttribute('opacity', '0');
        }
        
        if (step >= 4) {
          lblAlpha.setAttribute('opacity', '1');
        } else {
          lblAlpha.setAttribute('opacity', '0');
        }
      }
    }

    function renderStep() {
      const data = stepsData[currentStep];
      const container = document.getElementById('stepInfo');

      let dataHtml = '';
      data.data.forEach(d => {
        dataHtml += `
          <div class="data-item">
            <div class="data-label">${d.label}</div>
            <div class="data-val">${d.val}</div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="step-badge">${data.badge}</div>
        <h2 class="step-title">${data.title}</h2>
        <div class="step-desc">${data.desc}</div>
        <div class="formula-box">$$${data.formula}$$</div>
        <div class="data-grid">${dataHtml}</div>
        <div class="tip-box">${data.tip}</div>
      `;

      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ]
        });
      }

      // Aggiorna pills
      const pills = document.querySelectorAll('.step-pill');
      pills.forEach((p, idx) => {
        p.classList.remove('active', 'completed');
        if (idx === currentStep) p.classList.add('active');
        else if (idx < currentStep) p.classList.add('completed');
      });

      // Aggiorna pulsanti
      document.getElementById('btnPrev').disabled = (currentStep === 0);
      document.getElementById('btnNext').disabled = (currentStep === stepsData.length - 1);

      updateSimulation(currentStep);
    }

    function goToStep(s) {
      currentStep = s;
      renderStep();
    }

    function nextStep() {
      if (currentStep < stepsData.length - 1) {
        currentStep++;
        renderStep();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    }

    function resetSteps() {
      currentStep = 0;
      renderStep();
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextStep();
      else if (e.key === 'ArrowLeft') prevStep();
    });

    // LIM Drawing logic
    const canvas = document.getElementById('limCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let currentColor = '#38bdf8';
    let currentMode = 'pen';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    const btnPen = document.getElementById('btnPen');
    const btnEraser = document.getElementById('btnEraser');
    const btnClearCanvas = document.getElementById('btnClearCanvas');

    btnPen.addEventListener('click', () => {
      if (canvas.classList.contains('active') && currentMode === 'pen') {
        canvas.classList.remove('active');
        btnPen.classList.remove('active');
      } else {
        currentMode = 'pen';
        canvas.classList.add('active');
        btnPen.classList.add('active');
        btnEraser.classList.remove('active');
      }
    });

    btnEraser.addEventListener('click', () => {
      if (canvas.classList.contains('active') && currentMode === 'eraser') {
        canvas.classList.remove('active');
        btnEraser.classList.remove('active');
      } else {
        currentMode = 'eraser';
        canvas.classList.add('active');
        btnEraser.classList.add('active');
        btnPen.classList.remove('active');
      }
    });

    btnClearCanvas.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    function setColor(col, el) {
      currentColor = col;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
      currentMode = 'pen';
      canvas.classList.add('active');
      btnPen.classList.add('active');
      btnEraser.classList.remove('active');
    }

    function getPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX, y: clientY };
    }

    function startDraw(e) {
      if (!canvas.classList.contains('active')) return;
      isDrawing = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const p = getPos(e);
      if (currentMode === 'pen') {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      } else {
        ctx.clearRect(p.x - 15, p.y - 15, 30, 30);
      }
    }

    function endDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: true });
    canvas.addEventListener('touchmove', draw, { passive: true });
    canvas.addEventListener('touchend', endDraw);

    // Fullscreen
    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Whiteboard logic
    const wbOverlay = document.getElementById('whiteboardOverlay');
    const wbCanvas = document.getElementById('wbCanvas');
    const wbCtx = wbCanvas.getContext('2d');
    const wbBody = document.getElementById('whiteboardBody');
    let wbDrawing = false;
    let wbMode = 'pen';
    let wbZoom = 1;
    let panX = 0, panY = 0;
    let isPanning = false, startX = 0, startY = 0;

    function resizeWbCanvas() {
      wbCanvas.width = wbBody.clientWidth;
      wbCanvas.height = wbBody.clientHeight;
    }

    document.getElementById('btnWhiteboard').addEventListener('click', () => {
      wbOverlay.classList.add('active');
      resizeWbCanvas();
    });
    document.getElementById('wbClose').addEventListener('click', () => {
      wbOverlay.classList.remove('active');
    });

    document.getElementById('wbPenBtn').addEventListener('click', () => {
      wbMode = 'pen';
      wbBody.style.cursor = 'crosshair';
    });
    document.getElementById('wbEraserBtn').addEventListener('click', () => {
      wbMode = 'eraser';
      wbBody.style.cursor = 'cell';
    });
    const wbHandBtn = document.getElementById('wbHandBtn');
    wbHandBtn.addEventListener('click', () => {
      wbMode = 'pan';
      wbBody.style.cursor = 'grab';
    });

    document.getElementById('wbZoomIn').addEventListener('click', () => {
      wbZoom = Math.min(wbZoom + 0.2, 3);
      applyWbTransform();
    });
    document.getElementById('wbZoomOut').addEventListener('click', () => {
      wbZoom = Math.max(wbZoom - 0.2, 0.5);
      applyWbTransform();
    });
    document.getElementById('wbZoomReset').addEventListener('click', () => {
      wbZoom = 1;
      panX = 0;
      panY = 0;
      applyWbTransform();
    });

    function applyWbTransform() {
      wbCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${wbZoom})`;
      wbBody.style.backgroundPosition = `${panX}px ${panY}px`;
    }

    document.getElementById('wbGridToggle').addEventListener('click', () => {
      if (wbBody.classList.contains('bg-grid')) {
        wbBody.classList.remove('bg-grid');
        wbBody.classList.add('bg-dark');
      } else {
        wbBody.classList.remove('bg-dark');
        wbBody.classList.add('bg-grid');
      }
    });

    document.getElementById('wbClear').addEventListener('click', () => {
      wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height);
    });

    wbCanvas.addEventListener('mousedown', (e) => {
      if (wbMode === 'pan') {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        wbBody.style.cursor = 'grabbing';
      } else {
        wbDrawing = true;
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        wbCtx.beginPath();
        wbCtx.moveTo(x, y);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyWbTransform();
      } else if (wbDrawing) {
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        if (wbMode === 'pen') {
          wbCtx.strokeStyle = '#0284c7';
          wbCtx.lineWidth = 3;
          wbCtx.lineCap = 'round';
          wbCtx.lineTo(x, y);
          wbCtx.stroke();
        } else if (wbMode === 'eraser') {
          wbCtx.clearRect(x - 20, y - 20, 40, 40);
        }
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      wbDrawing = false;
      if (wbMode === 'pan') wbBody.style.cursor = 'grab';
    });

    // Avvio iniziale
    renderStep();
  </script>
</body>
</html>
