<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esercizio Guidato LIM — La Climatologa al Polo Nord (Es. 65) — ISS Giordano Bruno</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body);"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.25rem;
    }
    .brand-text h1 { font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
    .brand-text p { font-size: 0.8rem; color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      user-select: none;
    }
    .btn:hover { background: #273549; border-color: var(--accent-blue); }
    .btn-primary { background: #0284c7; border-color: #38bdf8; }
    .btn-primary:hover { background: #0369a1; }
    .btn-amber { background: #b45309; border-color: #fbbf24; }
    .btn-amber:hover { background: #92400e; }

    main {
      flex: 1;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.25rem;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .simulation-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 580px;
    }

    .svg-container {
      width: 100%;
      flex: 1;
      min-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      max-height: 480px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      user-select: none;
    }

    .controls-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .step-pills { display: flex; gap: 0.35rem; }
    .step-pill {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .step-pill.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
      transform: scale(1.1);
    }
    .step-pill.completed {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .details-card {
      overflow-y: auto;
      max-height: 80vh;
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) transparent;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
    }

    .step-title {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    .step-desc {
      font-size: 0.98rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .formula-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent-amber);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      font-size: 1.15rem;
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .data-item {
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .data-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .data-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .tip-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-left: 4px solid var(--accent-green);
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 0.9rem;
      color: #86efac;
      margin-top: auto;
    }

    /* LIM Canvas Overlay */
    #limCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    #limCanvas.active { pointer-events: auto; cursor: crosshair; }

    /* LIM Floating Toolbar */
    .lim-toolbar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 0.4rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: #334155; }
    .tool-btn.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
    }
    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-dot.active { border-color: white; transform: scale(1.15); }

    /* Whiteboard Modal */
    .whiteboard-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .whiteboard-overlay.active { display: flex; }
    .wb-header {
      padding: 0.6rem 1.25rem;
      background: #1e293b;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      white-space: nowrap;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .wb-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }
    .wb-body.bg-grid {
      background-color: #ffffff;
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      background-size: 25px 25px;
    }
    .wb-body.bg-dark {
      background-color: #0f172a;
      background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px);
      background-size: 25px 25px;
    }
    #wbCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🌐</div>
      <div class="brand-text">
        <h1>Esercizio 65 — Pag. 113</h1>
        <p>La Climatologa al Polo Nord: Variazione del Peso con la Latitudine</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-amber" id="btnWhiteboard">
        <span>📄</span> Foglio Bianco LIM
      </button>
      <button class="btn" id="btnFullscreen">
        <span>⛶</span> Schermo Intero
      </button>
      <a href="/fisica/giordano-bruno/" class="btn">
        <span>↩</span> Indice Esercizi
      </a>
    </div>
  </header>

  <main>
    <!-- Card Grafica / Simulazione -->
    <div class="card simulation-card">
      <div class="svg-container" id="svgContainer">
        <canvas id="limCanvas"></canvas>
        <svg id="simSvg" viewBox="-12 -8 24 16">
          <defs>
            <marker id="arrPole" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8" />
            </marker>
            <marker id="arrEq" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#fbbf24" />
            </marker>
            <marker id="arrRoute" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#f87171" />
            </marker>
            <radialGradient id="earthGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#1e3a8a" />
              <stop offset="80%" stop-color="#0f172a" />
              <stop offset="100%" stop-color="#0284c7" />
            </radialGradient>
          </defs>

          <!-- Sfondo griglia celeste scuro -->
          <rect x="-11.5" y="-7.5" width="23" height="15" fill="#0f172a" rx="1" />

          <!-- GLOBO TERRESTRE (Elisooide: R_eq = 5.8, R_polo = 5.2 - schiacciato!) -->
          <g transform="translate(0, 0.5)">
            <!-- Terra con atmosfera sfumata -->
            <ellipse cx="0" cy="0" rx="5.8" ry="5.1" fill="url(#earthGrad)" stroke="#38bdf8" stroke-width="0.12" />
            
            <!-- Asse di rotazione terrestre inclinato -->
            <line x1="0" y1="-6.5" x2="0" y2="6.5" stroke="#64748b" stroke-width="0.08" stroke-dasharray="0.3,0.3" />
            <text x="0.2" y="-6.7" fill="#94a3b8" font-size="0.5" font-weight="700">Asse di rotazione</text>

            <!-- Linea Equatore -->
            <ellipse cx="0" cy="0" rx="5.8" ry="1.4" fill="none" stroke="#fbbf24" stroke-width="0.08" stroke-dasharray="0.2,0.2" />
            <text x="6.1" y="0.2" fill="#fbbf24" font-size="0.55" font-weight="800">Equatore</text>

            <!-- Rotta di spedizione dall'Equatore al Polo (curva rossa tratteggiata) -->
            <path id="routeCurve" d="M 5.8 0 A 5.8 5.1 0 0 0 0 -5.1" fill="none" stroke="#f87171" stroke-width="0.12" stroke-dasharray="0.3,0.3" opacity="0" />

            <!-- POSTAZIONE 1: EQUATORE -->
            <g transform="translate(5.8, 0)">
              <circle cx="0" cy="0" r="0.25" fill="#fbbf24" />
              <!-- Forza Peso P_1 = 586.8 N verso il centro della Terra (a sinistra) -->
              <line id="vecEq" x1="0" y1="0" x2="-2.6" y2="0" stroke="#fbbf24" stroke-width="0.2" marker-end="url(#arrEq)" opacity="0" />
            </g>
            <text id="lblEqData" x="6.2" y="1.2" fill="#fbbf24" font-size="0.52" font-weight="700" opacity="0">g_1 = 9,78 N/kg → P_1 = 586,8 N</text>

            <!-- POSTAZIONE 2: POLO NORD -->
            <g transform="translate(0, -5.1)">
              <circle cx="0" cy="0" r="0.25" fill="#38bdf8" />
              <!-- Calotta polare ghiacciata -->
              <ellipse cx="0" cy="0" rx="1.6" ry="0.4" fill="rgba(255, 255, 255, 0.4)" />
              <!-- Forza Peso P_2 = 589.8 N verso il centro della Terra (in basso) -->
              <line id="vecPole" x1="0" y1="0" x2="0" y2="2.7" stroke="#38bdf8" stroke-width="0.22" marker-end="url(#arrPole)" opacity="0" />
            </g>
            <text id="lblPoleData" x="0" y="-5.6" fill="#38bdf8" font-size="0.55" font-weight="800" text-anchor="middle" opacity="0">Polo Nord: g_2 = 9,83 N/kg → P_2 = 589,8 N</text>
          </g>

          <!-- Banner comparativo in alto a sinistra (Step 4 & 5) -->
          <g id="grpDeltaBanner" transform="translate(-6.5, -4.5)" opacity="0">
            <rect x="-4.5" y="-1.5" width="9" height="3" rx="0.4" fill="#1e293b" stroke="#4ade80" stroke-width="0.1" />
            <text x="0" y="-0.4" fill="#4ade80" font-size="0.75" font-weight="900" text-anchor="middle">ΔP = +3,0 N</text>
            <text x="0" y="0.65" fill="#cbd5e1" font-size="0.52" text-anchor="middle">Il peso AUMENTA di 3 N!</text>
          </g>

          <!-- Spiegazione geofisica in basso a sinistra (Step 5) -->
          <g id="grpGeoWhy" transform="translate(-6.5, 4.5)" opacity="0">
            <text x="0" y="-0.5" fill="#fbbf24" font-size="0.45" font-weight="700" text-anchor="middle">Perché g varia sulla Terra?</text>
            <text x="0" y="0.2" fill="#94a3b8" font-size="0.38" text-anchor="middle">1. Terra schiacciata ai Poli (R_polo < R_eq)</text>
            <text x="0" y="0.8" fill="#94a3b8" font-size="0.38" text-anchor="middle">2. Forza centrifuga all'Equatore</text>
          </g>
        </svg>
      </div>

      <!-- Barra di controllo -->
      <div class="controls-bar">
        <div class="step-pills">
          <div class="step-pill active" onclick="goToStep(0)">1</div>
          <div class="step-pill" onclick="goToStep(1)">2</div>
          <div class="step-pill" onclick="goToStep(2)">3</div>
          <div class="step-pill" onclick="goToStep(3)">4</div>
          <div class="step-pill" onclick="goToStep(4)">5</div>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn" id="btnPrev" onclick="prevStep()">⏮ Prec</button>
          <button class="btn btn-primary" id="btnNext" onclick="nextStep()">Succ ⏭</button>
          <button class="btn" onclick="resetSteps()">🔄 Riavvia</button>
        </div>
      </div>
    </div>

    <!-- Card Dettagli Didattici -->
    <div class="card details-card">
      <div id="stepInfo">
        <!-- Generato dinamicamente da JS -->
      </div>
    </div>
  </main>

  <!-- LIM Floating Toolbar -->
  <div class="lim-toolbar">
    <button class="tool-btn active" id="btnPen" title="Penna">✏️</button>
    <button class="tool-btn" id="btnEraser" title="Gomma">🧹</button>
    <div class="color-dot active" style="background: #38bdf8;" onclick="setColor('#38bdf8', this)"></div>
    <div class="color-dot" style="background: #4ade80;" onclick="setColor('#4ade80', this)"></div>
    <div class="color-dot" style="background: #fbbf24;" onclick="setColor('#fbbf24', this)"></div>
    <div class="color-dot" style="background: #f87171;" onclick="setColor('#f87171', this)"></div>
    <button class="tool-btn" id="btnClearCanvas" title="Cancella Scritte">🗑️</button>
  </div>

  <!-- Whiteboard Overlay Modal -->
  <div class="whiteboard-overlay" id="whiteboardOverlay">
    <div class="wb-header">
      <div style="font-weight: 700; color: #f8fafc; display:flex; align-items:center; gap:0.5rem;">
        <span>📄</span> Foglio Bianco LIM — Spazio Libero
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <button class="btn" id="wbPenBtn">✏️ Penna</button>
        <button class="btn" id="wbEraserBtn">🧹 Gomma</button>
        <button class="btn" id="wbHandBtn" title="Trascina foglio">🖐️</button>
        <button class="btn" id="wbZoomIn">🔍+</button>
        <button class="btn" id="wbZoomOut">🔍-</button>
        <button class="btn" id="wbZoomReset">100%</button>
        <button class="btn" id="wbGridToggle">Griglia / Sfondo</button>
        <button class="btn" id="wbClear">🗑️ Svuota</button>
        <button class="btn btn-amber" id="wbClose">✕ Chiudi</button>
      </div>
    </div>
    <div class="wb-body bg-grid" id="whiteboardBody">
      <canvas id="wbCanvas"></canvas>
    </div>
  </div>

  <script>
    const stepsData = [
      {
        badge: "Passo 1 di 5 — La Spedizione Scientifica",
        title: "Dall'Equatore al Polo Nord: g non è costante!",
        desc: "Una climatologa di massa <strong>$m = 60{,}0\\text{ kg}$</strong> parte per una spedizione scientifica polare:<br>• Punto di partenza: <strong>Equatore</strong>, dove la gravità vale <strong>$g_1 = 9{,}78\\text{ N/kg}$</strong>.<br>• Destinazione: <strong>Polo Nord</strong>, dove la gravità vale <strong>$g_2 = 9{,}83\\text{ N/kg}$</strong>.<br><br><strong>Domanda del problema:</strong> Come varia il suo peso durante il viaggio dall'equatore al Polo Nord?",
        formula: "m = 60{,}0\\text{ kg}, \\quad g_1 = 9{,}78\\text{ N/kg}, \\quad g_2 = 9{,}83\\text{ N/kg}",
        data: [
          { label: "Massa climatologa m", val: "60,0 kg (Costante!)" },
          { label: "Gravità Equatore g_1", val: "9,78 N/kg" },
          { label: "Gravità Polo Nord g_2", val: "9,83 N/kg" },
          { label: "Obiettivo", val: "Calcolare ΔP = P_2 - P_1" }
        ],
        tip: "💡 Anche rimanendo sullo stesso pianeta (la Terra), la forza-peso non è esattamente costante: varia leggermente in base alla latitudine e all'altitudine!"
      },
      {
        badge: "Passo 2 di 5 — Il Peso all'Equatore",
        title: "Calcolo di P_1 all'Equatore: 586,8 N",
        desc: "All'equatore la climatologa risente della forza-peso $P_1$:<br>$$P_1 = m \\cdot g_1 = 60{,}0\\text{ kg} \\cdot 9{,}78\\text{ N/kg} = 586{,}8\\text{ N}$$<br>Se salisse su una bilancia dinamometrica all'equatore, la lancetta segnerebbe <strong>$586{,}8\\text{ N}$</strong>.",
        formula: "P_1 = 60{,}0\\text{ kg} \\cdot 9{,}78\\text{ N/kg} = 586{,}8\\text{ N}",
        data: [
          { label: "Massa", val: "60,0 kg" },
          { label: "g Equatore", val: "9,78 N/kg" },
          { label: "Peso iniziale P_1", val: "586,8 N" },
          { label: "Posizione", val: "Latitudine 0°" }
        ],
        tip: "💡 All'equatore il peso è al suo minimo globale sulla superficie terrestre."
      },
      {
        badge: "Passo 3 di 5 — Il Peso al Polo Nord",
        title: "Calcolo di P_2 al Polo Nord: 589,8 N",
        desc: "Arrivata al Polo Nord, la massa della ricercatrice è sempre identica ($60{,}0\\text{ kg}$), ma il campo gravitazionale terrestre è più intenso:<br>$$P_2 = m \\cdot g_2 = 60{,}0\\text{ kg} \\cdot 9{,}83\\text{ N/kg} = 589{,}8\\text{ N}$$<br>Il nuovo peso misurato è pari a <strong>$589{,}8\\text{ N}$</strong>.",
        formula: "P_2 = 60{,}0\\text{ kg} \\cdot 9{,}83\\text{ N/kg} = 589{,}8\\text{ N}",
        data: [
          { label: "Massa", val: "60,0 kg" },
          { label: "g Polo Nord", val: "9,83 N/kg" },
          { label: "Peso finale P_2", val: "589,8 N" },
          { label: "Posizione", val: "Latitudine 90° Nord" }
        ],
        tip: "💡 Il peso $P_2$ è maggiore di $P_1$: la Terra la attrae con più vigore al Polo!"
      },
      {
        badge: "Passo 4 di 5 — Calcolo della Variazione di Peso",
        title: "La Differenza di Peso: Aumenta di 3 N",
        desc: "Calcoliamo la variazione $\\Delta P$ tra il punto di arrivo e quello di partenza:<br>$$\\Delta P = P_2 - P_1 = 589{,}8\\text{ N} - 586{,}8\\text{ N} = +3{,}0\\text{ N}$$<br><strong>Metodo rapido alternativo:</strong><br>$$\\Delta P = m \\cdot (g_2 - g_1) = 60{,}0\\text{ kg} \\cdot (9{,}83 - 9{,}78)\\text{ N/kg} = 60{,}0 \\cdot 0{,}05 = 3{,}0\\text{ N}$$<br>Il suo peso <strong>aumenta di $3\\text{ N}$</strong> (pari a circa $300\\text{ grammi-peso}$).",
        formula: "\\Delta P = m(g_2 - g_1) = 60{,}0 \\cdot 0{,}05 = +3{,}0\\text{ N}",
        data: [
          { label: "P_2 (Polo)", val: "589,8 N" },
          { label: "P_1 (Equatore)", val: "586,8 N" },
          { label: "Variazione netta", val: "+3,0 N" },
          { label: "Verdetto", val: "Aumenta di 3 N" }
        ],
        tip: "💡 Con il metodo del raccoglimento a fattor comune $m(g_2 - g_1)$ si fa il calcolo a mente in 5 secondi!"
      },
      {
        badge: "Passo 5 di 5 — Spiegazione Geofisica & Risposta",
        title: "Perché la Terra Attrae di Più ai Poli?",
        desc: "Ci sono due ragioni fisiche fondamentali:<br>1. <strong>La forma a Geoide / Sferoide:</strong> La rotazione terrestre ha schiacciato la Terra ai poli rigonfiandola all'equatore. Al Polo Nord la scienziata si trova a circa $6357\\text{ km}$ dal centro della Terra, mentre all'equatore è a $6378\\text{ km}$ ($21\\text{ km}$ più lontana!). Essendo più vicina al centro, l'attrazione newtoniana è maggiore.<br>2. <strong>Effetto Centrifugo:</strong> All'equatore la rotazione terrestre genera una debole forza centrifuga verso l'alto che alleggerisce i corpi; ai poli questo effetto è nullo.<br><br><strong>Risposta ufficiale del libro (pag. 113):</strong><br>$$[\\text{Aumenta di } 3\\text{ N}]$$",
        formula: "\\text{Risposta: Il suo peso AUMENTA di } 3\\text{ N}",
        data: [
          { label: "Raggio equatoriale", val: "6378 km" },
          { label: "Raggio polare", val: "6357 km (-21 km)" },
          { label: "Variazione peso", val: "+3 N" },
          { label: "Stato finale", val: "Risolto e Verificato!" }
        ],
        tip: "🎯 Risolto al 100%! Questo esercizio insegna a collegare la formula della forza-peso alla vera forma fisica del nostro pianeta."
      }
    ];

    let currentStep = 0;

    function updateSimulation(step) {
      const routeCurve = document.getElementById('routeCurve');
      const vecEq = document.getElementById('vecEq');
      const lblEqData = document.getElementById('lblEqData');
      const vecPole = document.getElementById('vecPole');
      const lblPoleData = document.getElementById('lblPoleData');
      const grpDeltaBanner = document.getElementById('grpDeltaBanner');
      const grpGeoWhy = document.getElementById('grpGeoWhy');

      // Reset
      routeCurve.setAttribute('opacity', '0');
      vecEq.setAttribute('opacity', '0');
      lblEqData.setAttribute('opacity', '0');
      vecPole.setAttribute('opacity', '0');
      lblPoleData.setAttribute('opacity', '0');
      grpDeltaBanner.setAttribute('opacity', '0');
      grpGeoWhy.setAttribute('opacity', '0');

      if (step >= 1) {
        vecEq.setAttribute('opacity', '1');
        lblEqData.setAttribute('opacity', '1');
      }
      if (step >= 2) {
        routeCurve.setAttribute('opacity', '1');
        vecPole.setAttribute('opacity', '1');
        lblPoleData.setAttribute('opacity', '1');
      }
      if (step >= 3) {
        grpDeltaBanner.setAttribute('opacity', '1');
      }
      if (step >= 4) {
        grpGeoWhy.setAttribute('opacity', '1');
      }
    }

    function renderStep() {
      const data = stepsData[currentStep];
      const container = document.getElementById('stepInfo');

      let dataHtml = '';
      data.data.forEach(d => {
        dataHtml += `
          <div class="data-item">
            <div class="data-label">${d.label}</div>
            <div class="data-val">${d.val}</div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="step-badge">${data.badge}</div>
        <h2 class="step-title">${data.title}</h2>
        <div class="step-desc">${data.desc}</div>
        <div class="formula-box">$$${data.formula}$$</div>
        <div class="data-grid">${dataHtml}</div>
        <div class="tip-box">${data.tip}</div>
      `;

      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ]
        });
      }

      // Aggiorna pills
      const pills = document.querySelectorAll('.step-pill');
      pills.forEach((p, idx) => {
        p.classList.remove('active', 'completed');
        if (idx === currentStep) p.classList.add('active');
        else if (idx < currentStep) p.classList.add('completed');
      });

      // Aggiorna pulsanti
      document.getElementById('btnPrev').disabled = (currentStep === 0);
      document.getElementById('btnNext').disabled = (currentStep === stepsData.length - 1);

      updateSimulation(currentStep);
    }

    function goToStep(s) {
      currentStep = s;
      renderStep();
    }

    function nextStep() {
      if (currentStep < stepsData.length - 1) {
        currentStep++;
        renderStep();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    }

    function resetSteps() {
      currentStep = 0;
      renderStep();
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextStep();
      else if (e.key === 'ArrowLeft') prevStep();
    });

    // LIM Drawing logic
    const canvas = document.getElementById('limCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let currentColor = '#38bdf8';
    let currentMode = 'pen';

    function resizeCanvas() {
      const container = document.getElementById('svgContainer');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    const btnPen = document.getElementById('btnPen');
    const btnEraser = document.getElementById('btnEraser');
    const btnClearCanvas = document.getElementById('btnClearCanvas');

    btnPen.addEventListener('click', () => {
      currentMode = 'pen';
      canvas.classList.add('active');
      btnPen.classList.add('active');
      btnEraser.classList.remove('active');
    });

    btnEraser.addEventListener('click', () => {
      currentMode = 'eraser';
      canvas.classList.add('active');
      btnEraser.classList.add('active');
      btnPen.classList.remove('active');
    });

    btnClearCanvas.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    function setColor(col, el) {
      currentColor = col;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
      if (currentMode === 'eraser') {
        currentMode = 'pen';
        btnPen.classList.add('active');
        btnEraser.classList.remove('active');
      }
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
      if (!canvas.classList.contains('active')) return;
      isDrawing = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const p = getPos(e);
      if (currentMode === 'pen') {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      } else {
        ctx.clearRect(p.x - 15, p.y - 15, 30, 30);
      }
    }

    function endDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: true });
    canvas.addEventListener('touchmove', draw, { passive: true });
    canvas.addEventListener('touchend', endDraw);

    // Fullscreen
    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Whiteboard logic
    const wbOverlay = document.getElementById('whiteboardOverlay');
    const wbCanvas = document.getElementById('wbCanvas');
    const wbCtx = wbCanvas.getContext('2d');
    const wbBody = document.getElementById('whiteboardBody');
    let wbDrawing = false;
    let wbMode = 'pen';
    let wbZoom = 1;
    let panX = 0, panY = 0;
    let isPanning = false, startX = 0, startY = 0;

    function resizeWbCanvas() {
      wbCanvas.width = wbBody.clientWidth;
      wbCanvas.height = wbBody.clientHeight;
    }

    document.getElementById('btnWhiteboard').addEventListener('click', () => {
      wbOverlay.classList.add('active');
      resizeWbCanvas();
    });
    document.getElementById('wbClose').addEventListener('click', () => {
      wbOverlay.classList.remove('active');
    });

    document.getElementById('wbPenBtn').addEventListener('click', () => {
      wbMode = 'pen';
      wbBody.style.cursor = 'crosshair';
    });
    document.getElementById('wbEraserBtn').addEventListener('click', () => {
      wbMode = 'eraser';
      wbBody.style.cursor = 'cell';
    });
    const wbHandBtn = document.getElementById('wbHandBtn');
    wbHandBtn.addEventListener('click', () => {
      wbMode = 'pan';
      wbBody.style.cursor = 'grab';
    });

    document.getElementById('wbZoomIn').addEventListener('click', () => {
      wbZoom = Math.min(wbZoom + 0.2, 3);
      applyWbTransform();
    });
    document.getElementById('wbZoomOut').addEventListener('click', () => {
      wbZoom = Math.max(wbZoom - 0.2, 0.5);
      applyWbTransform();
    });
    document.getElementById('wbZoomReset').addEventListener('click', () => {
      wbZoom = 1;
      panX = 0;
      panY = 0;
      applyWbTransform();
    });

    function applyWbTransform() {
      wbCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${wbZoom})`;
      wbBody.style.backgroundPosition = `${panX}px ${panY}px`;
    }

    document.getElementById('wbGridToggle').addEventListener('click', () => {
      if (wbBody.classList.contains('bg-grid')) {
        wbBody.classList.remove('bg-grid');
        wbBody.classList.add('bg-dark');
      } else {
        wbBody.classList.remove('bg-dark');
        wbBody.classList.add('bg-grid');
      }
    });

    document.getElementById('wbClear').addEventListener('click', () => {
      wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height);
    });

    wbCanvas.addEventListener('mousedown', (e) => {
      if (wbMode === 'pan') {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        wbBody.style.cursor = 'grabbing';
      } else {
        wbDrawing = true;
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        wbCtx.beginPath();
        wbCtx.moveTo(x, y);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyWbTransform();
      } else if (wbDrawing) {
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        if (wbMode === 'pen') {
          wbCtx.strokeStyle = '#0284c7';
          wbCtx.lineWidth = 3;
          wbCtx.lineCap = 'round';
          wbCtx.lineTo(x, y);
          wbCtx.stroke();
        } else if (wbMode === 'eraser') {
          wbCtx.clearRect(x - 20, y - 20, 40, 40);
        }
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      wbDrawing = false;
      if (wbMode === 'pan') wbBody.style.cursor = 'grab';
    });

    // Avvio iniziale
    renderStep();
  </script>
</body>
</html>
