<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esercizio Guidato LIM — Equilibrio di Tre Forze (Es. 51) — ISS Giordano Bruno</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body);"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #0f172a;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.25rem;
    }
    .brand-text h1 { font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
    .brand-text p { font-size: 0.8rem; color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      user-select: none;
    }
    .btn:hover { background: #273549; border-color: var(--accent-blue); }
    .btn-primary { background: #0284c7; border-color: #38bdf8; }
    .btn-primary:hover { background: #0369a1; }
    .btn-amber { background: #b45309; border-color: #fbbf24; }
    .btn-amber:hover { background: #92400e; }

    main {
      flex: 1;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.25rem;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .simulation-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 580px;
    }

    .svg-container {
      width: 100%;
      flex: 1;
      min-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      max-height: 480px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      user-select: none;
    }

    .controls-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .step-pills { display: flex; gap: 0.35rem; }
    .step-pill {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .step-pill.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
      transform: scale(1.1);
    }
    .step-pill.completed {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .details-card {
      overflow-y: auto;
      max-height: 80vh;
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) transparent;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
    }

    .step-title {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    .step-desc {
      font-size: 0.98rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .formula-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent-amber);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      font-size: 1.15rem;
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .data-item {
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .data-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .data-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .tip-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-left: 4px solid var(--accent-green);
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 0.9rem;
      color: #86efac;
      margin-top: auto;
    }

    /* LIM Canvas Overlay */
    #limCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 90;
      pointer-events: none;
    }
    #limCanvas.active { pointer-events: auto; cursor: crosshair; }

    /* LIM Floating Toolbar */
    .lim-toolbar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 0.4rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: #334155; }
    .tool-btn.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
    }
    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-dot.active { border-color: white; transform: scale(1.15); }

    /* Whiteboard Modal */
    .whiteboard-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .whiteboard-overlay.active { display: flex; }
    .wb-header {
      padding: 0.6rem 1.25rem;
      background: #1e293b;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      white-space: nowrap;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .wb-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }
    .wb-body.bg-grid {
      background-color: #ffffff;
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      background-size: 25px 25px;
    }
    .wb-body.bg-dark {
      background-color: #0f172a;
      background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px);
      background-size: 25px 25px;
    }
    #wbCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">⚖️</div>
      <div class="brand-text">
        <h1>Problema a Passi 51 — Pag. 112</h1>
        <p>Equilibrio di Tre Forze Concorrenti: Calcolo della Forza Incognita F</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-amber" id="btnWhiteboard">
        <span>📄</span> Foglio Bianco LIM
      </button>
      <button class="btn" id="btnFullscreen">
        <span>⛶</span> Schermo Intero
      </button>
      <a href="/fisica/giordano-bruno/" class="btn">
        <span>↩</span> Indice Esercizi
      </a>
    </div>
  </header>

  <main>
    <!-- Card Grafica / Simulazione -->
    <div class="card simulation-card">
      <div class="svg-container" id="svgContainer">
        <canvas id="limCanvas"></canvas>
        <svg id="simSvg" viewBox="-7 -6 14 12">
          <defs>
            <marker id="arrA" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8" />
            </marker>
            <marker id="arrB" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#4ade80" />
            </marker>
            <marker id="arrF" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#f87171" />
            </marker>
            <pattern id="grid51" width="1" height="1" patternUnits="userSpaceOnUse">
              <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#1e293b" stroke-width="0.04" />
            </pattern>
          </defs>

          <!-- Sfondo quadrettato -->
          <rect x="-6.5" y="-5.5" width="13" height="11" fill="url(#grid51)" />

          <!-- Assi cartesiani centrati in (0,0) -->
          <line x1="-6" y1="0" x2="6" y2="0" stroke="#64748b" stroke-width="0.08" />
          <line x1="0" y1="-5.2" x2="0" y2="5.2" stroke="#64748b" stroke-width="0.08" />
          <text x="6" y="-0.2" fill="#94a3b8" font-size="0.45" font-weight="700">x</text>
          <text x="0.2" y="-5" fill="#94a3b8" font-size="0.45" font-weight="700">y</text>
          <text x="-0.3" y="0.4" fill="#94a3b8" font-size="0.4">O</text>

          <!-- Tacche assi -->
          <text x="3" y="0.4" fill="#64748b" font-size="0.35" text-anchor="middle">+3 N</text>
          <text x="-3" y="0.4" fill="#64748b" font-size="0.35" text-anchor="middle">-3 N</text>
          <text x="0.2" y="-3.9" fill="#64748b" font-size="0.35">+4 N</text>
          <text x="0.2" y="4.1" fill="#64748b" font-size="0.35">-4 N</text>

          <!-- Invertiamo le ordinate con scala(1, -1) -->
          <g transform="scale(1, -1)">
            <!-- Triangolo scomposizione forza a (Step 2+) -->
            <polygon id="triA" points="0,0 -3,0 -3,4" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(148, 163, 184, 0.3)" stroke-width="0.04" stroke-dasharray="0.1,0.1" opacity="0" />

            <!-- Arco angolo 53° rispetto all'asse -x -->
            <!-- Dal semiasse -x (-1.2, 0) verso il 2° quadrante -->
            <path id="arc53" d="M -1.2 0 A 1.2 1.2 0 0 1 -0.72 0.96" fill="rgba(251, 191, 36, 0.25)" stroke="#fbbf24" stroke-width="0.06" />

            <!-- Componenti di a tratteggiate (Step 2+) -->
            <line id="compAx" x1="0" y1="0" x2="-2.85" y2="0" stroke="#38bdf8" stroke-width="0.15" stroke-dasharray="0.15,0.15" opacity="0" />
            <line id="compAy" x1="0" y1="0" x2="0" y2="3.85" stroke="#38bdf8" stroke-width="0.15" stroke-dasharray="0.15,0.15" opacity="0" />

            <!-- Vettore a (blu, modulo 5.0 N a 53° nel 2° quadrante -> x = -3.0, y = +4.0) -->
            <line x1="0" y1="0" x2="-2.9" y2="3.88" stroke="#38bdf8" stroke-width="0.22" marker-end="url(#arrA)" />

            <!-- Vettore b (verde, modulo 4.0 N lungo asse -y -> x = 0, y = -4.0) -->
            <line x1="0" y1="0" x2="0" y2="-3.85" stroke="#4ade80" stroke-width="0.22" marker-end="url(#arrB)" />

            <!-- Vettore F incognito lungo asse +x (rosso) - Step 4 & 5 -->
            <line id="vecF" x1="0" y1="0" x2="2.85" y2="0" stroke="#f87171" stroke-width="0.26" marker-end="url(#arrF)" opacity="0" />

            <!-- Punto materiale O al centro -->
            <circle cx="0" cy="0" r="0.15" fill="#fbbf24" />
          </g>

          <!-- Testi e quotature -->
          <text x="-1.8" y="-0.4" fill="#fbbf24" font-size="0.42" font-weight="700">53°</text>
          <text x="-2.5" y="-4.2" fill="#38bdf8" font-size="0.55" font-weight="800">a = 5,0 N</text>
          <text x="0.3" y="4.3" fill="#4ade80" font-size="0.55" font-weight="800">b = 4,0 N</text>
          
          <text id="lblCompAx" x="-3.2" y="0.8" fill="#38bdf8" font-size="0.45" font-weight="700" text-anchor="middle" opacity="0">a_x = -3,0 N</text>
          <text id="lblCompAy" x="-0.3" y="-3.9" fill="#38bdf8" font-size="0.45" font-weight="700" text-anchor="end" opacity="0">a_y = +4,0 N</text>

          <text id="lblBalanceY" x="1.5" y="-3.9" fill="#4ade80" font-size="0.4" font-weight="700" opacity="0">a_y e b si annullano! (+4 - 4 = 0)</text>
          <text id="lblVecF" x="3.2" y="-0.4" fill="#f87171" font-size="0.55" font-weight="800" opacity="0">F = 3,0 N</text>
          <text id="lblEquil" x="0" y="5.0" fill="#fbbf24" font-size="0.5" font-weight="800" text-anchor="middle" opacity="0">EQUILIBRIO PERFETTO: Σ F = 0</text>
        </svg>
      </div>

      <!-- Barra di controllo -->
      <div class="controls-bar">
        <div class="step-pills">
          <div class="step-pill active" onclick="goToStep(0)">1</div>
          <div class="step-pill" onclick="goToStep(1)">2</div>
          <div class="step-pill" onclick="goToStep(2)">3</div>
          <div class="step-pill" onclick="goToStep(3)">4</div>
          <div class="step-pill" onclick="goToStep(4)">5</div>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn" id="btnPrev" onclick="prevStep()">⏮ Prec</button>
          <button class="btn btn-primary" id="btnNext" onclick="nextStep()">Succ ⏭</button>
          <button class="btn" onclick="resetSteps()">🔄 Riavvia</button>
        </div>
      </div>
    </div>

    <!-- Card Dettagli Didattici -->
    <div class="card details-card">
      <div id="stepInfo">
        <!-- Generato dinamicamente da JS -->
      </div>
    </div>
  </main>

  <!-- LIM Floating Toolbar -->
  <div class="lim-toolbar">
    <button class="tool-btn" id="btnPen" title="Attiva/Disattiva Penna LIM">✏️</button>
    <button class="tool-btn" id="btnEraser" title="Gomma">🧹</button>
    <div class="color-dot active" style="background: #38bdf8;" onclick="setColor('#38bdf8', this)"></div>
    <div class="color-dot" style="background: #4ade80;" onclick="setColor('#4ade80', this)"></div>
    <div class="color-dot" style="background: #fbbf24;" onclick="setColor('#fbbf24', this)"></div>
    <div class="color-dot" style="background: #f87171;" onclick="setColor('#f87171', this)"></div>
    <button class="tool-btn" id="btnClearCanvas" title="Cancella Scritte">🗑️</button>
  </div>

  <!-- Whiteboard Overlay Modal -->
  <div class="whiteboard-overlay" id="whiteboardOverlay">
    <div class="wb-header">
      <div style="font-weight: 700; color: #f8fafc; display:flex; align-items:center; gap:0.5rem;">
        <span>📄</span> Foglio Bianco LIM — Spazio Libero
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <button class="btn" id="wbPenBtn">✏️ Penna</button>
        <button class="btn" id="wbEraserBtn">🧹 Gomma</button>
        <button class="btn" id="wbHandBtn" title="Trascina foglio">🖐️</button>
        <button class="btn" id="wbZoomIn">🔍+</button>
        <button class="btn" id="wbZoomOut">🔍-</button>
        <button class="btn" id="wbZoomReset">100%</button>
        <button class="btn" id="wbGridToggle">Griglia / Sfondo</button>
        <button class="btn" id="wbClear">🗑️ Svuota</button>
        <button class="btn btn-amber" id="wbClose">✕ Chiudi</button>
      </div>
    </div>
    <div class="wb-body bg-grid" id="whiteboardBody">
      <canvas id="wbCanvas"></canvas>
    </div>
  </div>

  <script>
    const stepsData = [
      {
        badge: "Passo 1 di 5 — Il Sistema delle Tre Forze",
        title: "Condizione di Equilibrio del Punto Materiale",
        desc: "Tre forze agiscono su un punto materiale posto nell'origine $O(0,0)$:<br>• Vettore $\\vec{a}$ (in azzurro): modulo $a = 5{,}0\\text{ N}$, forma un angolo di $53^\\circ$ con il semiasse negativo delle $x$ (2° quadrante).<br>• Vettore $\\vec{b}$ (in verde): modulo $b = 4{,}0\\text{ N}$ diretto verso il basso lungo $-y$.<br>• Vettore $\\vec{F}$ (incognito): diretto orizzontalmente verso destra lungo $+x$.<br><br><strong>Condizione di equilibrio:</strong> Vogliamo che la risultante totale sia NULLA ($\\vec{R} = \\vec{a} + \\vec{b} + \\vec{F} = \\vec{0}$).",
        formula: "\\vec{R} = \\vec{a} + \\vec{b} + \\vec{F} = \\vec{0} \\iff \\begin{cases} R_x = a_x + b_x + F_x = 0 \\\\ R_y = a_y + b_y + F_y = 0 \\end{cases}",
        data: [
          { label: "Modulo di a", val: "5,0 N (a 53° nel 2° quad)" },
          { label: "Modulo di b", val: "4,0 N (lungo -y)" },
          { label: "Direzione di F", val: "Lungo +x (F_y = 0)" },
          { label: "Condizione richiesta", val: "Risultante R = 0" }
        ],
        tip: "💡 Un corpo puntiforme rimane fermo in equilibrio statico se e solo se la somma vettoriale di tutte le forze applicate è esattamente zero."
      },
      {
        badge: "Passo 2 di 5 — Passo 1 del Libro: Scomposizione",
        title: "Calcolo delle Componenti Cartesiane di a e b",
        desc: "Scomponiamo il vettore obliquo $\\vec{a}$ nel 2° quadrante (notando che $\\cos 53^\\circ = 0{,}60$ e $\\sin 53^\\circ = 0{,}80$):<br>• $a_x = -a \\cdot \\cos(53^\\circ) = -5{,}0 \\cdot 0{,}60 = -3{,}0\\text{ N}$ (verso sinistra, segno meno)<br>• $a_y = +a \\cdot \\sin(53^\\circ) = +5{,}0 \\cdot 0{,}80 = +4{,}0\\text{ N}$ (verso l'alto, segno più)<br><br>Per il vettore $\\vec{b}$ (puramente verticale verso il basso):<br>• $b_x = 0\\text{ N}$<br>• $b_y = -4{,}0\\text{ N}$ (segno meno)",
        formula: "\\vec{a} = (-3{,}0;\\, +4{,}0)\\text{ N} \\quad \\text{e} \\quad \\vec{b} = (0;\\, -4{,}0)\\text{ N}",
        data: [
          { label: "a_x (orizzontale)", val: "-3,0 N" },
          { label: "a_y (verticale)", val: "+4,0 N" },
          { label: "b_x", val: "0 N" },
          { label: "b_y", val: "-4,0 N" }
        ],
        tip: "💡 Riconosci la terna pitagorica $3-4-5$? Un triangolo rettangolo con ipotenusa $5$ e angolo di $53^\circ$ ha cateti esattamente pari a $3$ e $4$!"
      },
      {
        badge: "Passo 3 di 5 — Passo 2 del Libro: Verifica Asse Y",
        title: "L'Asse Verticale è già Perfettamente Bilanciato!",
        desc: "Verifichiamo la somma delle componenti lungo l'asse verticale $y$:<br>$$R_y = a_y + b_y + F_y$$<br>Poiché $\\vec{F}$ è orizzontale, la sua componente verticale è nulla ($F_y = 0$). Sostituiamo i valori:<br>$$R_y = +4{,}0\\text{ N} - 4{,}0\\text{ N} + 0 = 0\\text{ N} \\quad \\checkmark$$<br>La forza verticale verso l'alto sviluppata da $\\vec{a}$ ($+4{,}0\\text{ N}$) compensa <strong>esattamente</strong> la forza verso il basso di $\\vec{b}$ ($-4{,}0\\text{ N}$)! Lungo la verticale il corpo non accelera.",
        formula: "R_y = (+4{,}0\\text{ N}) + (-4{,}0\\text{ N}) + 0 = 0\\text{ N}",
        data: [
          { label: "Spinta verso l'alto a_y", val: "+4,0 N" },
          { label: "Spinta verso il basso b_y", val: "-4,0 N" },
          { label: "Spinta verticale di F", val: "0 N" },
          { label: "Risultante asse y", val: "0 N (In Equilibrio!)" }
        ],
        tip: "💡 Nessun aggiustamento verticale necessario! La forza $\\vec{F}$ deve occuparsi solo ed esclusivamente dell'asse orizzontale."
      },
      {
        badge: "Passo 4 di 5 — Passo 3 del Libro: Risoluzione Equazione",
        title: "Imposizione dell'Equilibrio Lungo l'Asse X",
        desc: "Imponiamo che anche la somma lungo l'asse orizzontale $x$ sia uguale a zero:<br>$$R_x = a_x + b_x + F_x = 0$$<br>Sostituiamo i valori noti:<br>$$-3{,}0\\text{ N} + 0 + F = 0$$<br>Risolviamo questa equazione di primo grado per $F$:<br>$$F = +3{,}0\\text{ N}$$<br>La forza $\\vec{F}$ deve avere un modulo esattamente pari a <strong>$3{,}0\\text{ N}$</strong> (o $3\\text{ N}$) ed essere orientata verso destra.",
        formula: "-3{,}0\\text{ N} + F = 0 \\implies F = 3{,}0\\text{ N} = 3\\text{ N}",
        data: [
          { label: "Tiro a sinistra a_x", val: "-3,0 N" },
          { label: "Tiro a destra F_x", val: "+F" },
          { label: "Equazione", val: "-3,0 + F = 0" },
          { label: "Modulo ricavato F", val: "3 N" }
        ],
        tip: "💡 Il vettore $\\vec{F}$ fa da 'ancora equilibratrice': contrasta esattamente la tendenza del vettore $\\vec{a}$ a tirare verso sinistra."
      },
      {
        badge: "Passo 5 di 5 — Il Poligono Chiuso delle Forze",
        title: "Visualizzazione Geometrica: Triangolo Chiuso 3-4-5",
        desc: "Se concateniamo le tre forze con il metodo punta-coda:<br>• Partiamo da $O$, seguiamo $\\vec{a}$ fino a $(-3;\\, +4)$<br>• Da lì scendiamo verticalmente con $\\vec{b}$ di 4 unità fino a $(-3;\\, 0)$<br>• Da lì chiudiamo verso destra con $\\vec{F} = +3\\text{ N}$ tornando <strong>esattamente nell'origine $O(0,0)$</strong>!<br><br>Il poligono delle forze è un <strong>triangolo rettangolo chiuso</strong> di lati $3-4-5$.<br><strong>Risposta ufficiale del problema (pag. 112):</strong><br>Il modulo della forza è <strong>$F = 3\\text{ N}$</strong>.",
        formula: "\\vec{a} + \\vec{b} + \\vec{F} = \\vec{0} \\implies F = 3\\text{ N}",
        data: [
          { label: "Componenti a", val: "(-3, +4) N" },
          { label: "Componenti b", val: "(0, -4) N" },
          { label: "Componenti F", val: "(+3, 0) N" },
          { label: "Somma Vettoriale", val: "R = (0, 0) N (Equilibrio)" }
        ],
        tip: "🎯 Risultato verificato al 100%! Quando tre forze sono in equilibrio, i loro vettori formano sempre un percorso chiuso a triangolo."
      }
    ];

    let currentStep = 0;

    function updateSimulation(step) {
      const triA = document.getElementById('triA');
      const compAx = document.getElementById('compAx');
      const compAy = document.getElementById('compAy');
      const lblCompAx = document.getElementById('lblCompAx');
      const lblCompAy = document.getElementById('lblCompAy');
      const lblBalanceY = document.getElementById('lblBalanceY');
      const vecF = document.getElementById('vecF');
      const lblVecF = document.getElementById('lblVecF');
      const lblEquil = document.getElementById('lblEquil');

      // Reset
      triA.setAttribute('opacity', '0');
      compAx.setAttribute('opacity', '0');
      compAy.setAttribute('opacity', '0');
      lblCompAx.setAttribute('opacity', '0');
      lblCompAy.setAttribute('opacity', '0');
      lblBalanceY.setAttribute('opacity', '0');
      vecF.setAttribute('opacity', '0');
      lblVecF.setAttribute('opacity', '0');
      lblEquil.setAttribute('opacity', '0');

      if (step >= 1) {
        triA.setAttribute('opacity', '1');
        compAx.setAttribute('opacity', '1');
        compAy.setAttribute('opacity', '1');
        lblCompAx.setAttribute('opacity', '1');
        lblCompAy.setAttribute('opacity', '1');
      }
      if (step >= 2) {
        lblBalanceY.setAttribute('opacity', '1');
      }
      if (step >= 3) {
        vecF.setAttribute('opacity', '1');
        lblVecF.setAttribute('opacity', '1');
      }
      if (step >= 4) {
        lblEquil.setAttribute('opacity', '1');
      }
    }

    function renderStep() {
      const data = stepsData[currentStep];
      const container = document.getElementById('stepInfo');

      let dataHtml = '';
      data.data.forEach(d => {
        dataHtml += `
          <div class="data-item">
            <div class="data-label">${d.label}</div>
            <div class="data-val">${d.val}</div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="step-badge">${data.badge}</div>
        <h2 class="step-title">${data.title}</h2>
        <div class="step-desc">${data.desc}</div>
        <div class="formula-box">$$${data.formula}$$</div>
        <div class="data-grid">${dataHtml}</div>
        <div class="tip-box">${data.tip}</div>
      `;

      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ]
        });
      }

      // Aggiorna pills
      const pills = document.querySelectorAll('.step-pill');
      pills.forEach((p, idx) => {
        p.classList.remove('active', 'completed');
        if (idx === currentStep) p.classList.add('active');
        else if (idx < currentStep) p.classList.add('completed');
      });

      // Aggiorna pulsanti
      document.getElementById('btnPrev').disabled = (currentStep === 0);
      document.getElementById('btnNext').disabled = (currentStep === stepsData.length - 1);

      updateSimulation(currentStep);
    }

    function goToStep(s) {
      currentStep = s;
      renderStep();
    }

    function nextStep() {
      if (currentStep < stepsData.length - 1) {
        currentStep++;
        renderStep();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    }

    function resetSteps() {
      currentStep = 0;
      renderStep();
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextStep();
      else if (e.key === 'ArrowLeft') prevStep();
    });

    // LIM Drawing logic
    const canvas = document.getElementById('limCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let currentColor = '#38bdf8';
    let currentMode = 'pen';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    const btnPen = document.getElementById('btnPen');
    const btnEraser = document.getElementById('btnEraser');
    const btnClearCanvas = document.getElementById('btnClearCanvas');

    btnPen.addEventListener('click', () => {
      if (canvas.classList.contains('active') && currentMode === 'pen') {
        canvas.classList.remove('active');
        btnPen.classList.remove('active');
      } else {
        currentMode = 'pen';
        canvas.classList.add('active');
        btnPen.classList.add('active');
        btnEraser.classList.remove('active');
      }
    });

    btnEraser.addEventListener('click', () => {
      if (canvas.classList.contains('active') && currentMode === 'eraser') {
        canvas.classList.remove('active');
        btnEraser.classList.remove('active');
      } else {
        currentMode = 'eraser';
        canvas.classList.add('active');
        btnEraser.classList.add('active');
        btnPen.classList.remove('active');
      }
    });

    btnClearCanvas.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    function setColor(col, el) {
      currentColor = col;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
      currentMode = 'pen';
      canvas.classList.add('active');
      btnPen.classList.add('active');
      btnEraser.classList.remove('active');
    }

    function getPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX, y: clientY };
    }

    function startDraw(e) {
      if (!canvas.classList.contains('active')) return;
      isDrawing = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const p = getPos(e);
      if (currentMode === 'pen') {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      } else {
        ctx.clearRect(p.x - 15, p.y - 15, 30, 30);
      }
    }

    function endDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: true });
    canvas.addEventListener('touchmove', draw, { passive: true });
    canvas.addEventListener('touchend', endDraw);

    // Fullscreen
    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Whiteboard logic
    const wbOverlay = document.getElementById('whiteboardOverlay');
    const wbCanvas = document.getElementById('wbCanvas');
    const wbCtx = wbCanvas.getContext('2d');
    const wbBody = document.getElementById('whiteboardBody');
    let wbDrawing = false;
    let wbMode = 'pen';
    let wbZoom = 1;
    let panX = 0, panY = 0;
    let isPanning = false, startX = 0, startY = 0;

    function resizeWbCanvas() {
      wbCanvas.width = wbBody.clientWidth;
      wbCanvas.height = wbBody.clientHeight;
    }

    document.getElementById('btnWhiteboard').addEventListener('click', () => {
      wbOverlay.classList.add('active');
      resizeWbCanvas();
    });
    document.getElementById('wbClose').addEventListener('click', () => {
      wbOverlay.classList.remove('active');
    });

    document.getElementById('wbPenBtn').addEventListener('click', () => {
      wbMode = 'pen';
      wbBody.style.cursor = 'crosshair';
    });
    document.getElementById('wbEraserBtn').addEventListener('click', () => {
      wbMode = 'eraser';
      wbBody.style.cursor = 'cell';
    });
    const wbHandBtn = document.getElementById('wbHandBtn');
    wbHandBtn.addEventListener('click', () => {
      wbMode = 'pan';
      wbBody.style.cursor = 'grab';
    });

    document.getElementById('wbZoomIn').addEventListener('click', () => {
      wbZoom = Math.min(wbZoom + 0.2, 3);
      applyWbTransform();
    });
    document.getElementById('wbZoomOut').addEventListener('click', () => {
      wbZoom = Math.max(wbZoom - 0.2, 0.5);
      applyWbTransform();
    });
    document.getElementById('wbZoomReset').addEventListener('click', () => {
      wbZoom = 1;
      panX = 0;
      panY = 0;
      applyWbTransform();
    });

    function applyWbTransform() {
      wbCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${wbZoom})`;
      wbBody.style.backgroundPosition = `${panX}px ${panY}px`;
    }

    document.getElementById('wbGridToggle').addEventListener('click', () => {
      if (wbBody.classList.contains('bg-grid')) {
        wbBody.classList.remove('bg-grid');
        wbBody.classList.add('bg-dark');
      } else {
        wbBody.classList.remove('bg-dark');
        wbBody.classList.add('bg-grid');
      }
    });

    document.getElementById('wbClear').addEventListener('click', () => {
      wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height);
    });

    wbCanvas.addEventListener('mousedown', (e) => {
      if (wbMode === 'pan') {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        wbBody.style.cursor = 'grabbing';
      } else {
        wbDrawing = true;
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        wbCtx.beginPath();
        wbCtx.moveTo(x, y);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyWbTransform();
      } else if (wbDrawing) {
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        if (wbMode === 'pen') {
          wbCtx.strokeStyle = '#0284c7';
          wbCtx.lineWidth = 3;
          wbCtx.lineCap = 'round';
          wbCtx.lineTo(x, y);
          wbCtx.stroke();
        } else if (wbMode === 'eraser') {
          wbCtx.clearRect(x - 20, y - 20, 40, 40);
        }
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      wbDrawing = false;
      if (wbMode === 'pan') wbBody.style.cursor = 'grab';
    });

    // Avvio iniziale
    renderStep();
  </script>
</body>
</html>
