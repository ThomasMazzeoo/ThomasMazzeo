<script>
// ═══════════════════════════════════════════
// I VETTORI — PARTE 2: COMPONENTI & TRIGONOMETRIA
// ═══════════════════════════════════════════

let currentStep = 1;
let animFrameId = null;

// Palette Colors
const COL = {
  bg: '#1b1b2f',
  bgDeep: '#121225',
  grid: 'rgba(100,130,200,0.12)',
  axis: 'rgba(180,200,255,0.35)',
  axisLabel: 'rgba(180,200,255,0.5)',
  a: '#58c4dd',       // Blue / Cyan
  b: '#ff8c42',       // Orange
  s: '#39ff14',       // Phosphor Green
  hypot: '#58c4dd',   // Cyan / Blue
  catOpp: '#ff8c42',  // Orange
  catAdj: '#39ff14',  // Green
  sum: '#39ff14',
  diff: '#ff3366',
  scaled: '#b388ff',
  yellow: '#ffee00',
  red: '#ff3366',
  white: '#f0f4fc',
  dimWhite: 'rgba(240,244,252,0.4)',
  dashed: 'rgba(88,196,221,0.45)'
};

// ═══════════════════════════════════════════
// VECTOR & GEOMETRY CANVAS ENGINE
// ═══════════════════════════════════════════

class VectorCanvas2 {
  constructor(canvasId, options = {}) {
    this.canvas = document.getElementById(canvasId);
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this.range = options.range || 6; // Coords range from -range to +range
    this.showAxes = options.showAxes !== false;
    this.centerOffsetX = options.centerOffsetX || 0; // In units
    this.centerOffsetY = options.centerOffsetY || 0;
    this.resize();
    this._resizeHandler = () => this.resize();
    window.addEventListener('resize', this._resizeHandler);
  }

  resize() {
    if (!this.canvas) return;
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const s = Math.min(rect.width, rect.height, 520);
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = s * dpr;
    this.canvas.height = s * dpr;
    this.canvas.style.width = s + 'px';
    this.canvas.style.height = s + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.size = s;
    this.unit = s / (this.range * 2);
    this.ox = s / 2 + this.centerOffsetX * this.unit;
    this.oy = s / 2 - this.centerOffsetY * this.unit;
  }

  clear() {
    this.ctx.clearRect(0, 0, this.size, this.size);
  }

  toScreen(x, y) {
    return [this.ox + x * this.unit, this.oy - y * this.unit];
  }

  toWorld(sx, sy) {
    return [(sx - this.ox) / this.unit, (this.oy - sy) / this.unit];
  }

  drawGrid() {
    const ctx = this.ctx;
    const s = this.size;
    const u = this.unit;
    const r = this.range;

    // Grid lines
    ctx.strokeStyle = COL.grid;
    ctx.lineWidth = 1;
    for (let i = -r * 2; i <= r * 2; i++) {
      const px = this.ox + i * u;
      const py = this.oy - i * u;
      if (px >= 0 && px <= s) {
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, s); ctx.stroke();
      }
      if (py >= 0 && py <= s) {
        ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(s, py); ctx.stroke();
      }
    }

    if (!this.showAxes) return;

    // Primary Axes
    ctx.strokeStyle = COL.axis;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, this.oy); ctx.lineTo(s, this.oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(this.ox, 0); ctx.lineTo(this.ox, s); ctx.stroke();

    // Axis Labels
    ctx.font = '11px "Share Tech Mono", monospace';
    ctx.fillStyle = COL.axisLabel;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const step = r > 10 ? 2 : 1;
    for (let i = -Math.floor(r); i <= Math.floor(r); i += step) {
      if (i === 0) continue;
      const px = this.ox + i * u;
      if (px > 10 && px < s - 10) ctx.fillText(i, px, this.oy + 4);
    }
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let i = -Math.floor(r); i <= Math.floor(r); i += step) {
      if (i === 0) continue;
      const py = this.oy - i * u;
      if (py > 10 && py < s - 10) ctx.fillText(i, this.ox - 5, py);
    }

    // Origin label
    ctx.fillStyle = COL.dimWhite;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText('O', this.ox - 5, this.oy + 4);

    // Axis names
    ctx.font = 'bold 13px "Share Tech Mono", monospace';
    ctx.fillStyle = COL.axisLabel;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('x', s - 14, this.oy + 14);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('y', this.ox + 14, 14);
  }

  // Draw clean, smooth vector arrow
  drawVector(x1, y1, x2, y2, color, lineWidth = 2.5, alpha = 1) {
    const ctx = this.ctx;
    const [sx1, sy1] = this.toScreen(x1, y1);
    const [sx2, sy2] = this.toScreen(x2, y2);
    const angle = Math.atan2(sy2 - sy1, sx2 - sx1);
    const dist = Math.hypot(sx2 - sx1, sy2 - sy1);
    if (dist < 1) return;
    const headLen = Math.min(13, dist * 0.4);

    ctx.save();
    ctx.globalAlpha = alpha;

    // Shaft
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx1, sy1);
    ctx.lineTo(sx2, sy2);
    ctx.stroke();

    // Arrowhead
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(sx2, sy2);
    ctx.lineTo(sx2 - headLen * Math.cos(angle - 0.35), sy2 - headLen * Math.sin(angle - 0.35));
    ctx.lineTo(sx2 - headLen * Math.cos(angle + 0.35), sy2 - headLen * Math.sin(angle + 0.35));
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // Draw dashed projection line
  drawDashedLine(x1, y1, x2, y2, color = COL.dashed, alpha = 0.6) {
    const ctx = this.ctx;
    const [sx1, sy1] = this.toScreen(x1, y1);
    const [sx2, sy2] = this.toScreen(x2, y2);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(sx1, sy1);
    ctx.lineTo(sx2, sy2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Draw angle arc with label
  drawArc(cx, cy, rWorld, startDeg, endDeg, color, counterClockwise = false, label = '') {
    const ctx = this.ctx;
    const [scx, scy] = this.toScreen(cx, cy);
    const rPx = rWorld * this.unit;
    const sRad = -startDeg * Math.PI / 180;
    const eRad = -endDeg * Math.PI / 180;

    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(scx, scy, rPx, sRad, eRad, counterClockwise);
    ctx.stroke();

    // Arrow on arc if desired
    const tipAngle = counterClockwise ? eRad : eRad;
    const tangent = tipAngle + (counterClockwise ? -Math.PI / 2 : Math.PI / 2);
    const tipX = scx + rPx * Math.cos(tipAngle);
    const tipY = scy + rPx * Math.sin(tipAngle);
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX - 7 * Math.cos(tangent - 0.5), tipY - 7 * Math.sin(tangent - 0.5));
    ctx.lineTo(tipX - 7 * Math.cos(tangent + 0.5), tipY - 7 * Math.sin(tangent + 0.5));
    ctx.closePath();
    ctx.fill();

    if (label) {
      const midAngle = (sRad + eRad) / 2;
      const lx = scx + (rPx + 16) * Math.cos(midAngle);
      const ly = scy + (rPx + 16) * Math.sin(midAngle);
      ctx.font = 'bold 12px "Share Tech Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, lx, ly);
    }
    ctx.restore();
  }

  // Draw 90 degree square indicator
  drawRightAngle(x, y, dirX = 1, dirY = 1, sizeWorld = 0.45, color = 'rgba(255,238,0,0.7)') {
    const ctx = this.ctx;
    const sz = sizeWorld;
    const [p0x, p0y] = this.toScreen(x, y);
    const [p1x, p1y] = this.toScreen(x + dirX * sz, y);
    const [p2x, p2y] = this.toScreen(x + dirX * sz, y + dirY * sz);
    const [p3x, p3y] = this.toScreen(x, y + dirY * sz);

    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.fillStyle = 'rgba(255,238,0,0.12)';
    ctx.beginPath();
    ctx.moveTo(p1x, p1y);
    ctx.lineTo(p2x, p2y);
    ctx.lineTo(p3x, p3y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p0x, p0y);
    ctx.lineTo(p1x, p1y);
    ctx.lineTo(p2x, p2y);
    ctx.lineTo(p3x, p3y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Draw point marker
  drawPoint(x, y, color = COL.white, radius = 4, label = '') {
    const ctx = this.ctx;
    const [sx, sy] = this.toScreen(x, y);
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(sx, sy, radius, 0, Math.PI * 2);
    ctx.fill();
    if (label) {
      ctx.font = 'bold 12px "Share Tech Mono", monospace';
      ctx.fillText(label, sx + 8, sy - 8);
    }
    ctx.restore();
  }

  // Procedural Pill Badge (Vector Arrow rendered natively without glyph bugs)
  drawPill(worldX, worldY, symbol, remainder, color, bg = 'rgba(18, 18, 37, 0.94)', prefix = '') {
    const ctx = this.ctx;
    const [sx, sy] = this.toScreen(worldX, worldY);
    ctx.save();
    ctx.font = 'bold 12px "Share Tech Mono", monospace';

    const cleanPref = prefix || '';
    const cleanSym = symbol || '';
    const cleanRem = remainder || '';

    const prefWidth = cleanPref ? ctx.measureText(cleanPref).width : 0;
    const symWidth = cleanSym ? ctx.measureText(cleanSym).width : 0;
    const remWidth = cleanRem ? ctx.measureText(cleanRem).width : 0;
    const totalW = prefWidth + symWidth + remWidth;
    const totalH = 17;
    const padX = 7;
    const padY = 3;

    const boxW = totalW + padX * 2;
    const boxH = totalH + padY * 2;
    let boxX = sx - boxW / 2;
    let boxY = sy - boxH / 2;

    // Viewport clamp
    if (boxX + boxW > this.size - 8) boxX = this.size - 8 - boxW;
    if (boxX < 8) boxX = 8;
    if (boxY + boxH > this.size - 8) boxY = this.size - 8 - boxH;
    if (boxY < 8) boxY = 8;

    ctx.fillStyle = bg;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(boxX, boxY, boxW, boxH, 4);
    else ctx.rect(boxX, boxY, boxW, boxH);
    ctx.fill();
    ctx.stroke();

    let curX = boxX + padX;
    const textY = boxY + boxH / 2 + 0.5;

    if (cleanPref) {
      ctx.fillStyle = color;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(cleanPref, curX, textY);
      curX += prefWidth;
    }

    if (cleanSym) {
      ctx.fillStyle = color;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(cleanSym, curX, textY);

      // Mini vector arrow procedurally drawn
      const arrowY = textY - 8;
      const arrowW = Math.max(7, symWidth - 1);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(curX, arrowY);
      ctx.lineTo(curX + arrowW, arrowY);
      ctx.lineTo(curX + arrowW - 2.5, arrowY - 2.5);
      ctx.moveTo(curX + arrowW, arrowY);
      ctx.lineTo(curX + arrowW - 2.5, arrowY + 2.5);
      ctx.stroke();

      curX += symWidth;
    }

    if (cleanRem) {
      ctx.fillStyle = color;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(cleanRem, curX, textY);
    }
    ctx.restore();
  }

  destroy() {
    window.removeEventListener('resize', this._resizeHandler);
  }
}

const totalSteps = STEPS.length;

// ═══════════════════════════════════════════
// STEP 1 IMPLEMENTATION: PITAGORA
// ═══════════════════════════════════════════
let vc1 = null;

function initStep1() {
  vc1 = new VectorCanvas2('cvPitagora', { range: 6 });
  updateStep1();
}

function updateStep1() {
  if (!vc1) return;
  const ax = parseFloat(document.getElementById('sliderAx').value);
  const ay = parseFloat(document.getElementById('sliderAy').value);

  document.getElementById('dispAx').textContent = (ax >= 0 ? '+' : '') + ax.toFixed(1);
  document.getElementById('dispAy').textContent = (ay >= 0 ? '+' : '') + ay.toFixed(1);

  document.getElementById('boxAx').textContent = Math.abs(ax).toFixed(1);
  document.getElementById('boxAy').textContent = Math.abs(ay).toFixed(1);

  const sqSum = ax * ax + ay * ay;
  const mod = Math.sqrt(sqSum);

  document.getElementById('boxSqSum').textContent = `${(ax*ax).toFixed(1)} + ${(ay*ay).toFixed(1)} = ${sqSum.toFixed(1)}`;
  document.getElementById('boxRad').textContent = sqSum.toFixed(1);
  document.getElementById('boxMod').textContent = mod.toFixed(2);

  vc1.clear();
  vc1.drawGrid();

  // Projections
  vc1.drawDashedLine(ax, 0, ax, ay, COL.dashed, 0.5);
  vc1.drawDashedLine(0, ay, ax, ay, COL.dashed, 0.5);

  // Component vectors
  if (Math.abs(ax) > 0.05) {
    vc1.drawVector(0, 0, ax, 0, COL.cyan, 3.2);
    vc1.drawPill(ax / 2, -0.6, 'a', '_x = ' + (ax >= 0 ? '+' : '') + ax.toFixed(1), COL.cyan);
  }
  if (Math.abs(ay) > 0.05) {
    vc1.drawVector(ax, 0, ax, ay, COL.orange, 3.2);
    vc1.drawPill(ax + (ax >= 0 ? 0.7 : -0.7), ay / 2, 'a', '_y = ' + (ay >= 0 ? '+' : '') + ay.toFixed(1), COL.orange);
  }

  // Right angle indicator in (ax, 0)
  if (Math.abs(ax) > 0.8 && Math.abs(ay) > 0.8) {
    const dirX = ax >= 0 ? -1 : 1;
    const dirY = ay >= 0 ? 1 : -1;
    vc1.drawRightAngle(ax, 0, dirX, dirY, 0.45);
  }

  // Hypotenuse / Vector
  if (mod > 0.05) {
    vc1.drawVector(0, 0, ax, ay, COL.green, 3.8);
    vc1.drawPill(ax / 2 - 0.4, ay / 2 + 0.4, 'a', ' = ' + mod.toFixed(2), COL.green);
  }
}

function step1SetPreset(x, y) {
  document.getElementById('sliderAx').value = x;
  document.getElementById('sliderAy').value = y;
  updateStep1();
}

// ═══════════════════════════════════════════
// STEP 2 IMPLEMENTATION: TRIGONOMETRIA BASE
// ═══════════════════════════════════════════
let vc2 = null;

function initStep2() {
  vc2 = new VectorCanvas2('cvTrigBase', { range: 6, showAxes: false, centerOffsetX: -1.2, centerOffsetY: -1.2 });
  updateStep2();
}

function updateStep2() {
  if (!vc2) return;
  const deg = parseFloat(document.getElementById('sliderTrigAngle').value);
  const hyp = parseFloat(document.getElementById('sliderTrigHyp').value);

  document.getElementById('dispTrigAngle').textContent = deg + '°';
  document.getElementById('dispTrigHyp').textContent = hyp.toFixed(1);

  const rad = deg * Math.PI / 180;
  const sinVal = Math.sin(rad);
  const cosVal = Math.cos(rad);

  const adj = hyp * cosVal; // CA (orizzontale)
  const opp = hyp * sinVal; // AB (verticale)

  const calcBox = document.getElementById('step2CalcBox');
  if (calcBox) {
    calcBox.innerHTML = `
      Valori per α = <strong>${deg}°</strong> e Ipotenusa BC = <strong>${hyp.toFixed(1)}</strong>:<br>
      • sin(${deg}°) ≈ <strong>${sinVal.toFixed(3)}</strong> ➜ <strong>AB</strong> = ${hyp.toFixed(1)} · ${sinVal.toFixed(3)} = <span style="color:var(--orange); font-weight:bold;">${opp.toFixed(2)}</span><br>
      • cos(${deg}°) ≈ <strong>${cosVal.toFixed(3)}</strong> ➜ <strong>CA</strong> = ${hyp.toFixed(1)} · ${cosVal.toFixed(3)} = <span style="color:var(--green); font-weight:bold;">${adj.toFixed(2)}</span>
    `;
  }

  vc2.clear();
  vc2.drawGrid();

  // Triangle vertices:
  // C at (0, 0)
  // A at (adj, 0)
  // B at (adj, opp)
  const ctx = vc2.ctx;
  const [scx, scy] = vc2.toScreen(0, 0);
  const [sax, say] = vc2.toScreen(adj, 0);
  const [sbx, sby] = vc2.toScreen(adj, opp);

  // Fill triangle subtly
  ctx.save();
  ctx.fillStyle = 'rgba(88,196,221,0.08)';
  ctx.beginPath();
  ctx.moveTo(scx, scy);
  ctx.lineTo(sax, say);
  ctx.lineTo(sbx, sby);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Draw 3 sides with dedicated colors
  // CA: Adiacente (Green)
  ctx.strokeStyle = COL.catAdj;
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(scx, scy); ctx.lineTo(sax, say); ctx.stroke();

  // AB: Opposto (Orange)
  ctx.strokeStyle = COL.catOpp;
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(sax, say); ctx.lineTo(sbx, sby); ctx.stroke();

  // BC: Ipotenusa (Blue/Cyan)
  ctx.strokeStyle = COL.hypot;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(scx, scy); ctx.lineTo(sbx, sby); ctx.stroke();

  // Vertices points & letters
  vc2.drawPoint(0, 0, COL.white, 4, 'C');

  vc2.drawPoint(adj, opp, COL.white, 4, 'B');

  vc2.drawArc(0, 0, 1.1, 0, deg, COL.yellow, false, `α = ${deg}°`);

  vc2.drawPill(adj / 2, -0.6, '', `CA = ${adj.toFixed(2)} (Adiacente)`, COL.catAdj);

      <strong>Vettore Opposto: -a</strong><br>
      Dato: <span class="vec-a"><span class="vec-sym">a</span> = (3, 2)</span>:<br>
      • Componenti opposte: <strong>(-a<sub>x</sub>, -a<sub>y</sub>) = (${ox}, ${oy})</strong><br>
      Stesso modulo, stessa direzione, ma <strong>verso opposto</strong> (ruotato di 180°)!
    `;
  }

  drawStep8Canvas();
}

function drawStep8Canvas() {
  if (!vc8) return;
  vc8.clear();
  vc8.drawGrid();

  const ax = 3, ay = 2;
  const bx = 2, by = 4;

  if (curOp === 'add') {
    const cx = ax + bx, cy = ay + by;
    vc8.drawVector(0, 0, ax, ay, COL.a, 3);
    vc8.drawPill(ax / 2 - 0.4, ay / 2 + 0.4, 'a', ' (3, 2)', COL.a);

    vc8.drawVector(ax, ay, cx, cy, COL.b, 3);
    vc8.drawPill(ax + bx / 2 + 0.6, ay + by / 2, 'b', ' (2, 4)', COL.b);

    vc8.drawVector(0, 0, cx, cy, COL.sum, 3.8);
    vc8.drawPill(cx / 2 - 0.6, cy / 2 + 0.5, 'c', ` = (${cx}, ${cy})`, COL.sum);
  } else if (curOp === 'scale') {
    vc8.drawVector(0, 0, ax * 2, ay * 2, COL.scaled, 3.8);
    vc8.drawPill(ax + 0.5, ay + 0.6, 'd', ' = 2·a (6, 4)', COL.scaled);

    vc8.drawVector(0, 0, ax, ay, COL.a, 2.8);
    vc8.drawPill(ax / 2 - 0.4, ay / 2 + 0.4, 'a', ' (3, 2)', COL.a);
  } else if (curOp === 'sub') {
    const ex = ax - bx, ey = ay - by;
    vc8.drawVector(0, 0, ax, ay, COL.a, 3);
    vc8.drawPill(ax / 2 - 0.4, ay / 2 + 0.4, 'a', ' (3, 2)', COL.a);

    vc8.drawVector(0, 0, bx, by, COL.b, 3);
    vc8.drawPill(bx / 2 + 0.5, by / 2, 'b', ' (2, 4)', COL.b);

    vc8.drawVector(0, 0, ex, ey, COL.red, 3.8);
    vc8.drawPill(ex / 2 - 0.6, ey / 2 - 0.4, 'e', ` = (${ex}, ${ey})`, COL.red);
  } else if (curOp === 'opp') {
    vc8.drawVector(0, 0, ax, ay, COL.a, 3.2);
    vc8.drawPill(ax / 2 - 0.4, ay / 2 + 0.4, 'a', ' (3, 2)', COL.a);

    vc8.drawVector(0, 0, -ax, -ay, COL.red, 3.6);
    vc8.drawPill(-ax / 2 - 0.5, -ay / 2 - 0.4, '', '-a (-3, -2)', COL.red);
  }
}

// ═══════════════════════════════════════════
// STEP 9 IMPLEMENTATION: GONIOMETRO 360 PLAYGROUND
// ═══════════════════════════════════════════
let vc9 = null;

function initStep9() {
  vc9 = new VectorCanvas2('cvLab', { range: 7 });
  updateStep9();
}

function updateStep9() {
  if (!vc9) return;
  const deg = parseFloat(document.getElementById('sliderLabAngle').value);
  const mod = parseFloat(document.getElementById('sliderLabMod').value);

  document.getElementById('dispLabAngle').textContent = deg + '°';
  document.getElementById('dispLabMod').textContent = mod.toFixed(2);

  const rad = deg * Math.PI / 180;
  const cosV = Math.cos(rad);
  const sinV = Math.sin(rad);

  const ax = mod * cosV;
  const ay = mod * sinV;
  const negAngle = deg === 0 ? 0 : deg - 360;

  let quad = "I";
  if (deg > 90 && deg <= 180) quad = "II";
  else if (deg > 180 && deg <= 270) quad = "III";
  else if (deg > 270 && deg < 360) quad = "IV";

  const formCard = document.getElementById('step9FormulaCard');
  if (formCard) {
    formCard.innerHTML = `
      <strong>a<sub>x</sub> = ${mod.toFixed(2)} · cos(${deg}°) = ${ax >= 0 ? '+' : ''}${ax.toFixed(2)}</strong><br>
      <strong>a<sub>y</sub> = ${mod.toFixed(2)} · sin(${deg}°) = ${ay >= 0 ? '+' : ''}${ay.toFixed(2)}</strong>
    `;
  }

  const info = document.getElementById('step9InfoBox');
  if (info) {
    info.innerHTML = `
      • <strong>Angolo antiorario (+):</strong> α = ${deg}°<br>
      • <strong>Angolo orario equivalente (-):</strong> β = ${negAngle}°<br>
      • <strong>Quadrante:</strong> ${quad} Quadrante<br>
      • <strong>cos(${deg}°):</strong> ${cosV.toFixed(3)} ➜ a<sub>x</sub> verso ${ax >= 0 ? 'destra (→)' : 'sinistra (←)'}<br>
      • <strong>sin(${deg}°):</strong> ${sinV.toFixed(3)} ➜ a<sub>y</sub> verso ${ay >= 0 ? 'l\'alto (↑)' : 'il basso (↓)'}
    `;
  }

  const pit = document.getElementById('step9PitagoraBox');
  if (pit) {
    pit.innerHTML = `
      <strong>Ricostruzione con Pitagora:</strong><br>
      a = √(${ax.toFixed(2)}² + ${ay.toFixed(2)}²) = √(${ (ax*ax).toFixed(2) } + ${ (ay*ay).toFixed(2) }) = √${ (ax*ax + ay*ay).toFixed(2) } = <strong>${mod.toFixed(2)}</strong>
    `;
  }

  vc9.clear();
  vc9.drawGrid();

  // Projections
  vc9.drawDashedLine(ax, 0, ax, ay, COL.dashed, 0.45);
  vc9.drawDashedLine(0, ay, ax, ay, COL.dashed, 0.45);

  // Arcs
  vc9.drawArc(0, 0, 1.3, 0, deg, COL.yellow, false, `${deg}°`);

  // Components
  vc9.drawVector(0, 0, ax, 0, COL.cyan, 3.2);
  vc9.drawPill(ax / 2, (ay >= 0 ? -0.6 : 0.6), 'a', `_x = ${ax >= 0 ? '+' : ''}${ax.toFixed(2)}`, COL.cyan);

  vc9.drawVector(0, 0, 0, ay, COL.orange, 3.2);
  vc9.drawPill((ax >= 0 ? -0.8 : 0.8), ay / 2, 'a', `_y = ${ay >= 0 ? '+' : ''}${ay.toFixed(2)}`, COL.orange);

  // Main Vector
  vc9.drawVector(0, 0, ax, ay, COL.green, 3.8);
  vc9.drawPill(ax / 2 + (ax >= 0 ? 0.3 : -0.3), ay / 2 + (ay >= 0 ? 0.4 : -0.4), 'a', ` = ${mod.toFixed(2)}`, COL.green);
}

function step9QuickSet(deg) {
  document.getElementById('sliderLabAngle').value = deg;
  updateStep9();
}

// ═══════════════════════════════════════════
// QUIZ ENGINE
// ═══════════════════════════════════════════

function checkQuiz(el, isCorrect, fbId) {
  const parent = el.parentElement;
  parent.querySelectorAll('.quiz-option').forEach(o => {
    o.classList.add('disabled');
    if (o === el) {
      o.classList.add(isCorrect ? 'correct' : 'wrong');
    }
  });

  const fb = document.getElementById(fbId);
  if (fb) {
    fb.classList.add('show', isCorrect ? 'ok' : 'ko');
    if (isCorrect) {
      fb.innerHTML = '✅ <strong>Esatto! Ottima risposta!</strong> Hai applicato correttamente il concetto.';
    } else {
      fb.innerHTML = '❌ <strong>Risposta non corretta.</strong> Rileggi con calma la spiegazione e le formule nella slide corrispondente!';
    }
  }
}

// ═══════════════════════════════════════════
// STEP NAVIGATION ENGINE
// ═══════════════════════════════════════════

function loadCurrentStep() {
  cancelAnim();
  const step = STEPS[currentStep - 1];

  document.getElementById('stepBadge').textContent = step.badge;
  document.getElementById('stepTitle').textContent = step.title;
  document.getElementById('stepRule').textContent = step.rule;
  document.getElementById('stepCounterText').textContent = `PASSO ${currentStep} DI ${totalSteps}`;

  const card = document.getElementById('focusCard');
  card.innerHTML = step.render();

  // Jump buttons selector
  const jumpSel = document.getElementById('jumpSelector');
  jumpSel.innerHTML = '';
  for (let i = 1; i <= totalSteps; i++) {
    const btn = document.createElement('button');
    btn.className = 'jump-btn' + (i === currentStep ? ' active' : '');
    btn.textContent = i;
    btn.onclick = () => goToStep(i);
    jumpSel.appendChild(btn);
  }

  document.getElementById('btnPrev').disabled = (currentStep === 1);
  const nextBtn = document.getElementById('btnNext');
  nextBtn.innerHTML = currentStep === totalSteps
    ? 'RICOMINCIA <span>↺</span>'
    : 'SUCCESSIVO <span>►</span>';

  // Mount callback
  if (step.onMount) {
    setTimeout(step.onMount, 50);
  }
}

function nextStep() {
  currentStep = currentStep < totalSteps ? currentStep + 1 : 1;
  loadCurrentStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevStep() {
  if (currentStep > 1) {
    currentStep--;
    loadCurrentStep();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function goToStep(s) {
  currentStep = s;
  loadCurrentStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextStep();
  else if (e.key === 'ArrowLeft') prevStep();
});

window.addEventListener('DOMContentLoaded', () => {
  loadCurrentStep();
});
</script>
