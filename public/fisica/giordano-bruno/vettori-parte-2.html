<script>
// ═══════════════════════════════════════════
// I VETTORI — CORSO COMPLETO BIENNIO (LIGHT THEME)
// (Pagine 86 – 93 del libro di testo)
// ═══════════════════════════════════════════

let currentStep = 1;
let animFrameId = null;

// High contrast light theme palette
const COL = {
  bg: '#ffffff',
  bgDeep: '#f8fafc',
  grid: 'rgba(148, 163, 184, 0.22)',
  axis: 'rgba(51, 65, 85, 0.8)',
  axisLabel: 'rgba(71, 85, 105, 0.85)',
  a: '#0284c7',        // Rich Sky Blue
  b: '#ea580c',        // Orange
  s: '#16a34a',        // Emerald Green
  v: '#0284c7',        // Sky Blue
  hypot: '#0284c7',    // Sky Blue
  catOpp: '#ea580c',   // Orange
  catAdj: '#16a34a',   // Emerald Green
  sum: '#16a34a',
  diff: '#dc2626',
  scaled: '#9333ea',
  yellow: '#d97706',   // Warm Amber (readable on white!)
  red: '#dc2626',
  white: '#1e293b',    // Point markers on white canvas
  dimWhite: 'rgba(51, 65, 85, 0.7)',
  dashed: 'rgba(100, 116, 139, 0.55)'
};

// ═══════════════════════════════════════════
// CANVAS ENGINE
// ═══════════════════════════════════════════

class VectorCanvas2 {
  constructor(canvasId, options = {}) {
    this.canvas = document.getElementById(canvasId);
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this.range = options.range || 6;
    this.showAxes = options.showAxes !== false;
    this.centerOffsetX = options.centerOffsetX || 0;
    this.centerOffsetY = options.centerOffsetY || 0;
    this.resize();
    this._resizeHandler = () => this.resize();
    window.addEventListener('resize', this._resizeHandler);
  }

  resize() {
    if (!this.canvas) return;
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const s = Math.min(rect.width, rect.height, 520);
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = s * dpr;
    this.canvas.height = s * dpr;
    this.canvas.style.width = s + 'px';
    this.canvas.style.height = s + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.size = s;
    this.unit = s / (this.range * 2);
    this.ox = s / 2 + this.centerOffsetX * this.unit;
    this.oy = s / 2 - this.centerOffsetY * this.unit;
  }

  clear() {
    this.ctx.clearRect(0, 0, this.size, this.size);
  }

  toScreen(x, y) {
    return [this.ox + x * this.unit, this.oy - y * this.unit];
  }

  drawGrid() {
    const ctx = this.ctx;
    const s = this.size;
    const u = this.unit;
    const r = this.range;

    ctx.strokeStyle = COL.grid;
    ctx.lineWidth = 1;
    for (let i = -r * 2; i <= r * 2; i++) {
      const px = this.ox + i * u;
      const py = this.oy - i * u;
      if (px >= 0 && px <= s) {
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, s); ctx.stroke();
      }
      if (py >= 0 && py <= s) {
        ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(s, py); ctx.stroke();
      }
    }

    if (!this.showAxes) return;

    ctx.strokeStyle = COL.axis;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, this.oy); ctx.lineTo(s, this.oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(this.ox, 0); ctx.lineTo(this.ox, s); ctx.stroke();

    ctx.font = '11px "Share Tech Mono", monospace';
    ctx.fillStyle = COL.axisLabel;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const step = r > 12 ? 4 : (r > 7 ? 2 : 1);
    for (let i = -Math.floor(r); i <= Math.floor(r); i += step) {
      if (i === 0) continue;
      const px = this.ox + i * u;
      if (px > 10 && px < s - 10) ctx.fillText(i, px, this.oy + 4);
    }
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let i = -Math.floor(r); i <= Math.floor(r); i += step) {
      if (i === 0) continue;
      const py = this.oy - i * u;
      if (py > 10 && py < s - 10) ctx.fillText(i, this.ox - 5, py);
    }

    ctx.fillStyle = COL.axisLabel;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText('O', this.ox - 5, this.oy + 4);

    ctx.font = 'bold 13px "Share Tech Mono", monospace';
    ctx.fillStyle = COL.axis;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('x', s - 14, this.oy + 14);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('y', this.ox + 14, 14);
  }

  drawVector(x1, y1, x2, y2, color, lineWidth = 2.5, alpha = 1) {
    const ctx = this.ctx;
    const [sx1, sy1] = this.toScreen(x1, y1);
    const [sx2, sy2] = this.toScreen(x2, y2);
    const angle = Math.atan2(sy2 - sy1, sx2 - sx1);
    const dist = Math.hypot(sx2 - sx1, sy2 - sy1);
    if (dist < 1) return;
    const headLen = Math.min(13, dist * 0.4);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx1, sy1);
    ctx.lineTo(sx2, sy2);
    ctx.stroke();

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(sx2, sy2);
    ctx.lineTo(sx2 - headLen * Math.cos(angle - 0.35), sy2 - headLen * Math.sin(angle - 0.35));
    ctx.lineTo(sx2 - headLen * Math.cos(angle + 0.35), sy2 - headLen * Math.sin(angle + 0.35));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  drawDashedLine(x1, y1, x2, y2, color = COL.dashed, alpha = 0.7) {
    const ctx = this.ctx;
    const [sx1, sy1] = this.toScreen(x1, y1);
    const [sx2, sy2] = this.toScreen(x2, y2);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(sx1, sy1);
    ctx.lineTo(sx2, sy2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  drawArc(cx, cy, rWorld, startDeg, endDeg, color, counterClockwise = false, label = '') {
    const ctx = this.ctx;
    const [scx, scy] = this.toScreen(cx, cy);
    const rPx = rWorld * this.unit;
    const sRad = -startDeg * Math.PI / 180;
    const eRad = -endDeg * Math.PI / 180;

    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(scx, scy, rPx, sRad, eRad, counterClockwise);
    ctx.stroke();

    const tipAngle = eRad;
    const tangent = tipAngle + (counterClockwise ? -Math.PI / 2 : Math.PI / 2);
    const tipX = scx + rPx * Math.cos(tipAngle);
    const tipY = scy + rPx * Math.sin(tipAngle);
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX - 7 * Math.cos(tangent - 0.5), tipY - 7 * Math.sin(tangent - 0.5));
    ctx.lineTo(tipX - 7 * Math.cos(tangent + 0.5), tipY - 7 * Math.sin(tangent + 0.5));
    ctx.closePath();
    ctx.fill();

    if (label) {
      const midAngle = (sRad + eRad) / 2;
      const lx = scx + (rPx + 16) * Math.cos(midAngle);
      const ly = scy + (rPx + 16) * Math.sin(midAngle);
      ctx.font = 'bold 12px "Share Tech Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, lx, ly);
    }
    ctx.restore();
  }

  drawRightAngle(x, y, dirX = 1, dirY = 1, sizeWorld = 0.45, color = '#ca8a04') {
    const ctx = this.ctx;
    const sz = sizeWorld;
    const [p0x, p0y] = this.toScreen(x, y);
    const [p1x, p1y] = this.toScreen(x + dirX * sz, y);
    const [p2x, p2y] = this.toScreen(x + dirX * sz, y + dirY * sz);
    const [p3x, p3y] = this.toScreen(x, y + dirY * sz);

    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.fillStyle = 'rgba(202, 138, 4, 0.12)';
    ctx.beginPath();
    ctx.moveTo(p1x, p1y);
    ctx.lineTo(p2x, p2y);
    ctx.lineTo(p3x, p3y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p0x, p0y);
    ctx.lineTo(p1x, p1y);
    ctx.lineTo(p2x, p2y);
    ctx.lineTo(p3x, p3y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  drawPoint(x, y, color = COL.white, radius = 4, label = '') {
    const ctx = this.ctx;
    const [sx, sy] = this.toScreen(x, y);
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(sx, sy, radius, 0, Math.PI * 2);
    ctx.fill();
    if (label) {
      ctx.font = 'bold 12px "Share Tech Mono", monospace';
      ctx.fillStyle = '#0f172a';
      ctx.fillText(label, sx + 8, sy - 8);
    }
    ctx.restore();
  }

  drawPill(worldX, worldY, symbol, remainder, color, bg = '#ffffff', prefix = '') {
    const ctx = this.ctx;
    const [sx, sy] = this.toScreen(worldX, worldY);
    ctx.save();
    ctx.font = 'bold 12px "Share Tech Mono", monospace';

    const cleanPref = prefix || '';
    const cleanSym = symbol || '';
    const cleanRem = remainder || '';

    const prefWidth = cleanPref ? ctx.measureText(cleanPref).width : 0;
    const symWidth = cleanSym ? ctx.measureText(cleanSym).width : 0;
    const remWidth = cleanRem ? ctx.measureText(cleanRem).width : 0;
    const totalW = prefWidth + symWidth + remWidth;
    const totalH = 17;
    const padX = 7;
    const padY = 3;

    const boxW = totalW + padX * 2;
    const boxH = totalH + padY * 2;
    let boxX = sx - boxW / 2;
    let boxY = sy - boxH / 2;

    if (boxX + boxW > this.size - 8) boxX = this.size - 8 - boxW;
    if (boxX < 8) boxX = 8;
    if (boxY + boxH > this.size - 8) boxY = this.size - 8 - boxH;
    if (boxY < 8) boxY = 8;

    // Crisp white card with colored border
    ctx.fillStyle = bg;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(boxX, boxY, boxW, boxH, 4);
    else ctx.rect(boxX, boxY, boxW, boxH);
    ctx.fill();
    ctx.stroke();

    let curX = boxX + padX;
    const textY = boxY + boxH / 2 + 0.5;

    if (cleanPref) {
      ctx.fillStyle = color;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(cleanPref, curX, textY);
      curX += prefWidth;
    }

    if (cleanSym) {
      ctx.fillStyle = color;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(cleanSym, curX, textY);

      const arrowY = textY - 8;
      const arrowW = Math.max(7, symWidth - 1);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(curX, arrowY);
      ctx.lineTo(curX + arrowW, arrowY);
      ctx.lineTo(curX + arrowW - 2.5, arrowY - 2.5);
      ctx.moveTo(curX + arrowW, arrowY);
      ctx.lineTo(curX + arrowW - 2.5, arrowY + 2.5);
      ctx.stroke();

      curX += symWidth;
    }

    if (cleanRem) {
      ctx.fillStyle = color;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(cleanRem, curX, textY);
    }
    ctx.restore();
  }

  destroy() {
    window.removeEventListener('resize', this._resizeHandler);
  }
}

function cancelAnim() {
  if (animFrameId) {
    cancelAnimationFrame(animFrameId);
    animFrameId = null;
  }
}

let vcNapoli = null;
let modeNapoli = 'dist';

function initStepNapoli() {
  vcNapoli = new VectorCanvas2('cvNapoli', { range: 32 });
  stepNapoliSet('dist');
}

function stepNapoliSet(mode) {
  modeNapoli = mode;
  document.getElementById('btnNapDist').classList.toggle('active', mode === 'dist');
  document.getElementById('btnNapSpost').classList.toggle('active', mode === 'spost');

  const exp = document.getElementById('boxNapoliExplain');
  if (exp) {
    if (mode === 'dist') {
      exp.innerHTML = `
        <strong>Distanza scalare = 25 km:</strong><br>
        Sapere soltanto che ci siamo allontanati di 25 km non specifica dove siamo arrivati: potremmo essere a Caserta, a Procida o a Castellammare.
      `;
    } else {
      exp.innerHTML = `
        <strong>Spostamento vettoriale s⃗ = 25 km a Sud-Est:</strong><br>
        Avendo specificato direzione (retta NO-SE) e verso (Sud-Est), siamo certi al 100% di trovarci a <strong>Castellammare di Stabia</strong>!
      `;
    }
  }

  if (!vcNapoli) return;
  vcNapoli.clear();
  vcNapoli.drawGrid();

  const ctx = vcNapoli.ctx;
  const [nox, noy] = vcNapoli.toScreen(0, 0);

  ctx.save();
  ctx.strokeStyle = modeNapoli === 'dist' ? COL.red : 'rgba(220, 38, 38, 0.4)';
  ctx.lineWidth = modeNapoli === 'dist' ? 2.5 : 1.5;
  ctx.setLineDash(modeNapoli === 'dist' ? [] : [6, 4]);
  ctx.beginPath();
  ctx.arc(nox, noy, 25 * vcNapoli.unit, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.save();
  ctx.font = 'bold 11px "Share Tech Mono", monospace';
  ctx.fillStyle = COL.axisLabel;
  ctx.fillText('NORD ↑', nox, noy - 25 * vcNapoli.unit - 8);
  ctx.fillText('SUD ↓', nox, noy + 25 * vcNapoli.unit + 14);
  ctx.fillText('EST →', nox + 25 * vcNapoli.unit + 8, noy);
  ctx.fillText('← OVEST', nox - 25 * vcNapoli.unit - 16, noy);
  ctx.restore();

  vcNapoli.drawPoint(0, 0, COL.yellow, 5, 'Napoli (Centro)');
  vcNapoli.drawPoint(0, 25, COL.cyan, 4, 'Caserta (25 km N)');
  vcNapoli.drawPoint(-24, -7, COL.orange, 4, 'Isola di Procida (25 km O)');

  const cx = 17.7, cy = -17.7;
  vcNapoli.drawPoint(cx, cy, COL.green, 6, 'Castellammare (25 km SE)');

  if (modeNapoli === 'spost') {
    vcNapoli.drawVector(0, 0, cx, cy, COL.green, 3.8);
    vcNapoli.drawPill(cx / 2 + 1.2, cy / 2 - 1.2, 's', ' = 25 km (Sud-Est)', COL.green);
  } else {
    vcNapoli.drawPill(12, 18, '', 'Raggio = 25 km (Distanza)', COL.red);
  }
}

let vcTermo = null;

function initStepTermometro() {
  vcTermo = new VectorCanvas2('cvTermometro', { range: 6, showAxes: false });
  updateStepTermometro();
}

function updateStepTermometro() {
  if (!vcTermo) return;
  const t = parseFloat(document.getElementById('sliderTemp').value);
  document.getElementById('dispTemp').textContent = (t >= 0 ? '+' : '') + t + ' °C';

  vcTermo.clear();
  const ctx = vcTermo.ctx;
  const s = vcTermo.size;

  const bx = s * 0.32, by = s * 0.1, bw = s * 0.36, bh = s * 0.8;
  ctx.fillStyle = '#f1f5f9';
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 12);
  else ctx.rect(bx, by, bw, bh);
  ctx.fill();
  ctx.stroke();

  const tx = s * 0.5, ty = s * 0.2, tw = 12, th = s * 0.58;
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1;
  ctx.fillRect(tx - tw / 2, ty, tw, th);
  ctx.strokeRect(tx - tw / 2, ty, tw, th);

  const bulbRadius = 18;
  const bulbY = ty + th + 4;
  ctx.fillStyle = COL.red;
  ctx.beginPath();
  ctx.arc(tx, bulbY, bulbRadius, 0, Math.PI * 2);
  ctx.fill();

  const clampedT = Math.max(-20, Math.min(50, t));
  const frac = (clampedT - (-20)) / 70;
  const colHeight = th * frac;
  const colTopY = (ty + th) - colHeight;

  ctx.fillStyle = COL.red;
  ctx.fillRect(tx - tw / 2 + 2, colTopY, tw - 4, colHeight + 6);

  ctx.font = '10px "Share Tech Mono", monospace';
  ctx.fillStyle = '#334155';
  ctx.textAlign = 'right';
  for (let val = -20; val <= 50; val += 10) {
    const f = (val - (-20)) / 70;
    const yPos = (ty + th) - th * f;
    ctx.fillRect(tx - tw / 2 - 8, yPos - 1, 8, 2);
    ctx.fillText(val + '°', tx - tw / 2 - 12, yPos + 3);
  }

  ctx.font = 'bold 12px "Share Tech Mono", monospace';
  ctx.fillStyle = COL.cyan;
  ctx.textAlign = 'center';
  ctx.fillText('°C CELSIUS', tx, by + 22);

  vcTermo.drawPill(0, -3.8, '', `T = ${(t >= 0 ? '+' : '') + t} °C`, COL.yellow);
}

function stepTermoSet(v) {
  document.getElementById('sliderTemp').value = v;
  updateStepTermometro();
}

let vcAnat = null;
let anatFlipped = false;

function initStepAnatomia() {
  vcAnat = new VectorCanvas2('cvAnatomia', { range: 6 });

function updateStepAnatomia() {
  if (!vcAnat) return;
  const mod = parseFloat(document.getElementById('sliderAnatMod').value);
  const ang = parseFloat(document.getElementById('sliderAnatAng').value);

  document.getElementById('dispAnatMod').textContent = mod.toFixed(1) + ' u';
  document.getElementById('dispAnatAng').textContent = ang + '°';

  vcAnat.clear();
  vcAnat.drawGrid();

  const effectiveAng = anatFlipped ? (ang + 180) : ang;
  const rad = effectiveAng * Math.PI / 180;
  const vx = mod * Math.cos(rad);
  const vy = mod * Math.sin(rad);

  const lineExtent = 5.8;
  const dirCos = Math.cos(ang * Math.PI / 180);
  const dirSin = Math.sin(ang * Math.PI / 180);
  vcAnat.drawDashedLine(-dirCos * lineExtent, -dirSin * lineExtent, dirCos * lineExtent, dirSin * lineExtent, COL.yellow, 0.55);
  vcAnat.drawPill(-dirCos * 4.2, -dirSin * 4.2, '', 'Retta = Direzione', COL.yellow);

  vcAnat.drawVector(0, 0, vx, vy, COL.green, 4);
  vcAnat.drawPill(vx / 2 - 0.4, vy / 2 + 0.4, '', `Modulo = ${mod.toFixed(1)} u`, COL.green);

  vcAnat.drawPoint(0, 0, COL.white, 4, 'O (Coda)');
  vcAnat.drawPoint(vx, vy, COL.cyan, 4, 'Punta (Verso)');
}

let vcTrig = null;

function initStepTrigBase() {
  vcTrig = new VectorCanvas2('cvTrigBase', { range: 6, showAxes: false, centerOffsetX: -1.2, centerOffsetY: -1.2 });
  updateStepTrigBase();
}

function updateStepTrigBase() {
  if (!vcTrig) return;
  const deg = parseFloat(document.getElementById('sliderTrigAngle').value);
  const hyp = parseFloat(document.getElementById('sliderTrigHyp').value);

  document.getElementById('dispTrigAngle').textContent = deg + '°';
  document.getElementById('dispTrigHyp').textContent = hyp.toFixed(1);

  const rad = deg * Math.PI / 180;
  const sinVal = Math.sin(rad);
  const cosVal = Math.cos(rad);

  const adj = hyp * cosVal;
  const opp = hyp * sinVal;

  const calcBox = document.getElementById('stepTrigCalcBox');
  if (calcBox) {
    calcBox.innerHTML = `
      Valori per α = <strong>${deg}°</strong> e Ipotenusa BC = <strong>${hyp.toFixed(1)}</strong>:<br>
      • sin(${deg}°) ≈ <strong>${sinVal.toFixed(3)}</strong> ➜ <strong>AB</strong> = ${hyp.toFixed(1)} · ${sinVal.toFixed(3)} = <span style="color:var(--orange); font-weight:bold;">${opp.toFixed(2)}</span><br>
      • cos(${deg}°) ≈ <strong>${cosVal.toFixed(3)}</strong> ➜ <strong>CA</strong> = ${hyp.toFixed(1)} · ${cosVal.toFixed(3)} = <span style="color:var(--green); font-weight:bold;">${adj.toFixed(2)}</span>
    `;
  }

  vcTrig.clear();
  vcTrig.drawGrid();

  const ctx = vcTrig.ctx;
  const [scx, scy] = vcTrig.toScreen(0, 0);
  const [sax, say] = vcTrig.toScreen(adj, 0);
  const [sbx, sby] = vcTrig.toScreen(adj, opp);

  ctx.save();
  ctx.fillStyle = 'rgba(2, 132, 199, 0.05)';
  ctx.beginPath();
  ctx.moveTo(scx, scy);
  ctx.lineTo(sax, say);
  ctx.lineTo(sbx, sby);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = COL.catAdj;
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(scx, scy); ctx.lineTo(sax, say); ctx.stroke();

  ctx.strokeStyle = COL.catOpp;
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(sax, say); ctx.lineTo(sbx, sby); ctx.stroke();

  ctx.strokeStyle = COL.hypot;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(scx, scy); ctx.lineTo(sbx, sby); ctx.stroke();

  vcTrig.drawPoint(0, 0, COL.white, 4, 'C');
  vcTrig.drawPoint(adj, 0, COL.white, 4, 'A');
  vcTrig.drawPoint(adj, opp, COL.white, 4, 'B');

  vcTrig.drawRightAngle(adj, 0, -1, 1, 0.45);
  vcTrig.drawArc(0, 0, 1.1, 0, deg, COL.yellow, false, `α = ${deg}°`);

  vcTrig.drawPill(adj / 2, -0.6, '', `CA = ${adj.toFixed(2)} (Adiacente)`, COL.catAdj);
  vcTrig.drawPill(adj + 0.8, opp / 2, '', `AB = ${opp.toFixed(2)} (Opposto)`, COL.catOpp);
  vcTrig.drawPill(adj / 2 - 0.4, opp / 2 + 0.5, '', `BC = ${hyp.toFixed(1)} (Ipotenusa)`, COL.hypot);
}

  document.getElementById('sliderTrigAngle').value = a;

}

function stepNotableSelect(deg) {
  [0, 30, 45, 60, 90].forEach(d => {
    const btn = document.getElementById('btnNot' + d);
    if (btn) btn.classList.toggle('active', d === deg);
  });

  const hyp = 5;
  const rad = deg * Math.PI / 180;
  const sinVal = Math.sin(rad);
  const cosVal = Math.cos(rad);
  const adj = hyp * cosVal;
  const opp = hyp * sinVal;

  const box = document.getElementById('stepNotableDetailBox');
  if (box) {
    if (deg === 0) box.innerHTML = `<strong>Angolo 0°:</strong> Il cateto opposto collassa a zero (sin 0° = 0), il cateto adiacente coincide con l'ipotenusa (cos 0° = 1).`;
    else if (deg === 30) box.innerHTML = `<strong>Angolo 30°:</strong> Il cateto opposto è esattamente <strong>metà dell'ipotenusa</strong>: sin(30°) = 1/2 = 0.500!`;
    else if (deg === 45) box.innerHTML = `<strong>Angolo 45°:</strong> Triangolo isoscele: cateti identici! sin(45°) = cos(45°) = √2 / 2 ≈ 0.707.`;
    else if (deg === 60) box.innerHTML = `<strong>Angolo 60°:</strong> Il cateto adiacente è metà dell'ipotenusa (cos 60° = 1/2), quello opposto vale √3 / 2 ≈ 0.866.`;
    else if (deg === 90) box.innerHTML = `<strong>Angolo 90°:</strong> Il cateto adiacente collassa a zero (cos 90° = 0), il cateto opposto coincide con l'ipotenusa (sin 90° = 1).`;
  }

  vcNotable.clear();
  vcNotable.drawGrid();

  if (deg > 0 && deg < 90) {
    vcNotable.drawDashedLine(adj, 0, adj, opp, COL.dashed, 0.45);
    vcNotable.drawRightAngle(adj, 0, -1, 1, 0.4);
    vcNotable.drawVector(0, 0, adj, 0, COL.catAdj, 3);
    vcNotable.drawVector(adj, 0, adj, opp, COL.catOpp, 3);
    vcNotable.drawArc(0, 0, 1.2, 0, deg, COL.yellow, false, `${deg}°`);
    vcNotable.drawPill(adj / 2, -0.6, '', `cos = ${cosVal.toFixed(3)}`, COL.catAdj);
    vcNotable.drawPill(adj + 0.9, opp / 2, '', `sin = ${sinVal.toFixed(3)}`, COL.catOpp);
  } else if (deg === 0) {
    vcNotable.drawVector(0, 0, hyp, 0, COL.catAdj, 3.5);
    vcNotable.drawPill(hyp / 2, -0.6, '', `cos(0°) = 1.0`, COL.catAdj);
  } else if (deg === 90) {
    vcNotable.drawVector(0, 0, 0, hyp, COL.catOpp, 3.5);
    vcNotable.drawPill(0.9, hyp / 2, '', `sin(90°) = 1.0`, COL.catOpp);

// ═══════════════════════════════════════════
// STEP & SECTION NAVIGATION
// ═══════════════════════════════════════════

function updateSectionPills() {
  const b1 = document.getElementById('secBtn1');
  const b2 = document.getElementById('secBtn2');
  const b3 = document.getElementById('secBtn3');
  if (!b1 || !b2 || !b3) return;

  b1.classList.toggle('active', currentStep >= 1 && currentStep <= 4);
  b2.classList.toggle('active', currentStep >= 5 && currentStep <= 10);
  b3.classList.toggle('active', currentStep >= 11);
}

function jumpToSection(sec) {
  if (sec === 'sec1') goToStep(1);
  else if (sec === 'sec2') goToStep(5);
  else if (sec === 'sec3') goToStep(11);
}

function loadCurrentStep() {
  cancelAnim();
  const step = STEPS[currentStep - 1];

  document.getElementById('stepBadge').textContent = step.badge;
  document.getElementById('stepTitle').textContent = step.title;
  document.getElementById('stepRule').textContent = step.rule;
  document.getElementById('stepCounterText').textContent = `PASSO ${currentStep} DI ${totalSteps}`;

  const card = document.getElementById('focusCard');
  card.innerHTML = step.render();

  const jumpSel = document.getElementById('jumpSelector');
  jumpSel.innerHTML = '';
  for (let i = 1; i <= totalSteps; i++) {
    const btn = document.createElement('button');
    btn.className = 'jump-btn' + (i === currentStep ? ' active' : '');
    btn.textContent = i;
    btn.onclick = () => goToStep(i);
    jumpSel.appendChild(btn);
  }

  document.getElementById('btnPrev').disabled = (currentStep === 1);
  const nextBtn = document.getElementById('btnNext');
  nextBtn.innerHTML = currentStep === totalSteps
    ? 'RICOMINCIA <span>↺</span>'
    : 'SUCCESSIVO <span>►</span>';

  updateSectionPills();

  if (step.onMount) {
    setTimeout(step.onMount, 50);
  }
}

function nextStep() {
  currentStep = currentStep < totalSteps ? currentStep + 1 : 1;
  loadCurrentStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevStep() {
  if (currentStep > 1) {
    currentStep--;
    loadCurrentStep();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function goToStep(s) {
  currentStep = s;
  loadCurrentStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextStep();
  else if (e.key === 'ArrowLeft') prevStep();
});

window.addEventListener('DOMContentLoaded', () => {
  loadCurrentStep();
});
</script>

</body>
</html>
