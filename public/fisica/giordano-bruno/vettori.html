<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
/* ═══════════════════════════════════════════
   DESIGN SYSTEM — 3BLUE1BROWN INSPIRED
   Dark BG, vibrant colored vectors, clean grid
   ═══════════════════════════════════════════ */
:root {
  --bg: #1b1b2f;
  --bg-deep: #121225;
  --card-bg: #16162b;
  --grid-color: rgba(100, 130, 200, 0.12);
  --grid-axis: rgba(180, 200, 255, 0.35);
  --green: #39ff14;
  --green-rgb: 57, 255, 20;
  --cyan: #00f5ff;
  --cyan-rgb: 0, 245, 255;
  --yellow: #ffee00;
  --yellow-rgb: 255, 238, 0;
  --red: #ff3366;
  --red-rgb: 255, 51, 102;
  --blue: #58c4dd;
  --blue-rgb: 88, 196, 221;
  --orange: #ff8c42;
  --orange-rgb: 255, 140, 66;
  --purple: #b388ff;
  --purple-rgb: 179, 136, 255;
  --white: #f0f4fc;
  --text-dim: #8b9bb4;
  --border: rgba(88, 196, 221, 0.2);
  --glow-blue: 0 0 16px rgba(88, 196, 221, 0.35);
  --glow-green: 0 0 16px rgba(57, 255, 20, 0.35);
  --font-pixel: 'Press Start 2P', monospace;
  --font-title: 'Orbitron', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg);
  color: var(--white);
  font-family: var(--font-body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* Subtle scanline CRT */
body::after {
  content: "";
  display: block;
  position: fixed;
  inset: 0;
  background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.12) 50%);
  background-size: 100% 4px;
  z-index: 999;
  pointer-events: none;
  opacity: 0.15;
}

/* ═══════════ TOP BAR ═══════════ */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.85rem 1.75rem;
  background: var(--bg-deep);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--green);
  text-decoration: none;
  font-family: var(--font-pixel);
  font-size: 0.6rem;
  letter-spacing: 1px;
  padding: 0.35rem 0.75rem;
  border: 1px solid rgba(57,255,20,0.22);
  border-radius: 4px;
  background: rgba(57,255,20,0.06);
  transition: all 0.2s ease;
}
.back-link:hover {
  background: rgba(57,255,20,0.18);
  box-shadow: var(--glow-green);
  transform: translateX(-2px);
}
.school-tag {
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: var(--cyan);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.step-indicator {
  font-family: var(--font-pixel);
  font-size: 0.6rem;
  color: var(--yellow);
  background: rgba(255,238,0,0.1);
  border: 1px solid rgba(255,238,0,0.3);
  padding: 0.35rem 0.85rem;
  border-radius: 4px;
}

/* ═══════════ MAIN LAYOUT ═══════════ */
.main-stage {
  flex: 1;
  max-width: 1200px;
  width: 96%;
  margin: 1.2rem auto 2rem;
  display: flex;
  flex-direction: column;
}
.step-header {
  text-align: center;
  margin-bottom: 1rem;
}
.step-subtitle-badge {
  display: inline-block;
  font-family: var(--font-pixel);
  font-size: 0.55rem;
  color: var(--blue);
  background: rgba(88,196,221,0.08);
  border: 1px solid rgba(88,196,221,0.22);
  padding: 0.25rem 0.6rem;
  border-radius: 3px;
  margin-bottom: 0.4rem;
  letter-spacing: 1.5px;
}
.step-title {
  font-family: var(--font-title);
  font-size: 1.5rem;
  color: var(--blue);
  text-shadow: var(--glow-blue);
  letter-spacing: 1.5px;
  margin-bottom: 0.3rem;
}
.step-rule {
  color: var(--text-dim);
  font-size: 0.9rem;
  max-width: 760px;
  margin: 0 auto;
  line-height: 1.5;
}

/* ═══════════ CONTENT CARD ═══════════ */
.focus-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
  box-shadow: 0 10px 40px rgba(0,0,0,0.45);
  animation: cardFade 0.25s ease;
  min-height: 480px;
  display: flex;
  flex-direction: column;
}
@keyframes cardFade {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════ CANVAS AREA ═══════════ */
.canvas-wrapper {
  display: flex;
  gap: 1.2rem;
  align-items: flex-start;
  flex: 1;
}
.canvas-side {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.canvas-container {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  max-width: 520px;
  border-radius: 10px;
  overflow: hidden;
  background: var(--bg-deep);
  border: 1px solid var(--border);
}
.canvas-container canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.explain-side {
  flex: 0 0 320px;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}

@media (max-width: 900px) {
  .canvas-wrapper { flex-direction: column; }

}

/* ═══════════ EXPLANATION PANELS ═══════════ */
.info-box {

}
.info-box.green { background: rgba(57,255,20,0.06); border-color: var(--green); }
.info-box.yellow { background: rgba(255,238,0,0.06); border-color: var(--yellow); }
.info-box.orange { background: rgba(255,140,66,0.06); border-color: var(--orange); }
.info-box.red { background: rgba(255,51,102,0.06); border-color: var(--red); }
.info-box.purple { background: rgba(179,136,255,0.06); border-color: var(--purple); }
.info-box strong { color: var(--white); }
.info-box .highlight { color: var(--yellow); font-weight: 600; }

.key-concept {
  background: rgba(255,238,0,0.07);
  border: 1px solid rgba(255,238,0,0.2);
  border-radius: 8px;
  padding: 0.7rem 0.9rem;
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--yellow);
  text-align: center;
  font-family: var(--font-mono);
}

/* Real Vector arrow in HTML (Clean, no broken glyphs!) */
.vec-sym {
  position: relative;
  display: inline-block;
  font-weight: 700;
  font-family: var(--font-mono);
  padding: 0 1px;
}
.vec-sym::before {

}

.vec-a { color: #58c4dd; }
.vec-b { color: #ff8c42; }
.vec-sum { color: #39ff14; }

/* ═══════════ ANIMATION CONTROLS ═══════════ */

  margin-top: 0.7rem;

}
.anim-btn {

}
.anim-btn:hover {

}

/* ═══════════ BOTTOM NAV ═══════════ */
.bottom-nav {

}
.jump-btn {

}
.jump-btn:hover {

}
.jump-btn.active {

.nav-btn {
  font-family: var(--font-pixel);
  font-size: 0.6rem;

  border-radius: 6px;

  display: inline-flex;
  align-items: center;

  letter-spacing: 1px;
}
.btn-prev {

}
.btn-prev:hover:not(:disabled) {
  border-color: var(--white);
  color: var(--white);
  transform: translateX(-3px);
}
.btn-prev:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-next {
  background: var(--blue);
  border: 1px solid var(--blue);
  color: var(--bg);
  font-weight: bold;
  box-shadow: var(--glow-blue);

.btn-next:hover {
  background: #7dd8ee;
  box-shadow: 0 0 22px rgba(88,196,221,0.6);
  transform: translateX(3px);

/* Focus Feedback */
.focus-feedback {
  background: rgba(88,196,221,0.06);
  border-left: 3px solid var(--blue);
  padding: 0.75rem 1rem;
  border-radius: 0 6px 6px 0;

  margin-top: auto;
  line-height: 1.5;
  color: var(--white);
}

/* ═══════════ PRINT ═══════════ */
@media print {
  body { background: #fff !important; color: #000 !important; }
  .top-bar, .bottom-nav { display: none !important; }

/* ═══════════ QUIZ STYLES ═══════════ */
.quiz-option {
  background: rgba(88,196,221,0.06);
  border: 1px solid rgba(88,196,221,0.2);
  border-radius: 8px;
  padding: 0.7rem 1rem;
  margin-bottom: 0.5rem;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 0.88rem;
  color: var(--white);
  font-family: var(--font-body);
}
.quiz-option:hover {
  border-color: var(--blue);
  background: rgba(88,196,221,0.12);
}
.quiz-option.correct {
  border-color: var(--green);
  background: rgba(57,255,20,0.12);

}
.quiz-option.wrong {
  border-color: var(--red);
  background: rgba(255,51,102,0.12);
  color: var(--red);
}
.quiz-option.disabled { pointer-events: none; opacity: 0.7; }
.quiz-feedback {
  font-size: 0.85rem;
  padding: 0.6rem 0.9rem;
  border-radius: 6px;
  margin-top: 0.5rem;
  line-height: 1.5;
  display: none;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.ok { background: rgba(57,255,20,0.08); color: var(--green); border-left: 3px solid var(--green); }
.quiz-feedback.ko { background: rgba(255,51,102,0.08); color: var(--red); border-left: 3px solid var(--red); }
</style>
</head>
<body>

  <header class="top-bar">
    <a href="/#fisica-laboratorio" class="back-link">
      <span>◄</span> FISICA LAB
    </a>
    <div class="school-tag">
      <span>🏫</span> ISS GIORDANO BRUNO — LABORATORIO DI FISICA
    </div>
    <div class="step-indicator" id="stepCounterText">
      PASSO 1 DI 7
    </div>
  </header>

  <main class="main-stage">
    <div class="step-header">
      <div class="step-subtitle-badge" id="stepBadge">FASE 1</div>
      <h1 class="step-title" id="stepTitle">I VETTORI</h1>
      <p class="step-rule" id="stepRule"></p>
    </div>

    <div class="focus-card" id="focusCard"></div>

    <div class="bottom-nav">
      <button class="nav-btn btn-prev" id="btnPrev" onclick="prevStep()" disabled>
        <span>◄</span> PRECEDENTE
      </button>
      <div class="step-jump-selector" id="jumpSelector"></div>
      <button class="nav-btn btn-next" id="btnNext" onclick="nextStep()">
        SUCCESSIVO <span>►</span>
      </button>
    </div>
  </main>

<script>
// ═══════════════════════════════════════════
// VECTOR LESSON — 3BLUE1BROWN STYLE
// ═══════════════════════════════════════════

let currentStep = 1;
const totalSteps = 7;
let animFrameId = null;

// ── Colors ──
const COL = {
  bg: '#1b1b2f',
  grid: 'rgba(100,130,200,0.12)',
  axis: 'rgba(180,200,255,0.35)',
  axisLabel: 'rgba(180,200,255,0.5)',
  a: '#58c4dd',
  b: '#ff8c42',
  sum: '#39ff14',
  diff: '#ff3366',
  scaled: '#b388ff',
  white: '#f0f4fc',
  dimWhite: 'rgba(240,244,252,0.4)',
  yellow: '#ffee00',
  component: 'rgba(88,196,221,0.35)',
};

// ═══════════════════════════════════════════
// GRID & VECTOR DRAWING ENGINE
// ═══════════════════════════════════════════

class VectorCanvas {
  constructor(canvasId) {
    this.canvas = document.getElementById(canvasId);
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    this._resizeHandler = () => this.resize();
    window.addEventListener('resize', this._resizeHandler);
  }

  resize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const s = Math.min(rect.width, rect.height, 520);
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = s * dpr;
    this.canvas.height = s * dpr;
    this.canvas.style.width = s + 'px';
    this.canvas.style.height = s + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.size = s;
    this.unit = s / 12; // -6 to +6
    this.ox = s / 2;
    this.oy = s / 2;
  }

  clear() {
    this.ctx.clearRect(0, 0, this.size, this.size);
  }

  // World to screen coords
  toScreen(x, y) {
    return [this.ox + x * this.unit, this.oy - y * this.unit];
  }

  drawGrid() {
    const ctx = this.ctx;
    const s = this.size;
    const u = this.unit;

    // Grid lines
    ctx.strokeStyle = COL.grid;
    ctx.lineWidth = 1;
    for (let i = -6; i <= 6; i++) {
      const px = this.ox + i * u;
      const py = this.oy - i * u;
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(s, py); ctx.stroke();
    }

    // Axes
    ctx.strokeStyle = COL.axis;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, this.oy); ctx.lineTo(s, this.oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(this.ox, 0); ctx.lineTo(this.ox, s); ctx.stroke();

    // Axis labels
    ctx.font = '11px "Share Tech Mono", monospace';
    ctx.fillStyle = COL.axisLabel;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (let i = -5; i <= 5; i++) {
      if (i === 0) continue;
      const px = this.ox + i * u;
      ctx.fillText(i, px, this.oy + 4);
    }
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let i = -5; i <= 5; i++) {
      if (i === 0) continue;
      const py = this.oy - i * u;
      ctx.fillText(i, this.ox - 5, py);
    }

    // Origin
    ctx.fillStyle = COL.dimWhite;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText('O', this.ox - 5, this.oy + 4);

    // Axis names
    ctx.font = 'bold 13px "Share Tech Mono", monospace';
    ctx.fillStyle = COL.axisLabel;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('x', s - 14, this.oy + 14);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('y', this.ox + 14, 14);
  }

  // Draw clean vector arrow
  drawVector(x1, y1, x2, y2, color, lineWidth = 2.5, alpha = 1) {
    const ctx = this.ctx;
    const [sx1, sy1] = this.toScreen(x1, y1);
    const [sx2, sy2] = this.toScreen(x2, y2);
    const angle = Math.atan2(sy2 - sy1, sx2 - sx1);
    const headLen = 12;

    ctx.save();
    ctx.globalAlpha = alpha;

    // Shaft
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx1, sy1);
    ctx.lineTo(sx2, sy2);
    ctx.stroke();

    // Arrowhead
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(sx2, sy2);
    ctx.lineTo(sx2 - headLen * Math.cos(angle - 0.35), sy2 - headLen * Math.sin(angle - 0.35));
    ctx.lineTo(sx2 - headLen * Math.cos(angle + 0.35), sy2 - headLen * Math.sin(angle + 0.35));
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // Draw a sleek pill badge with vector arrow rendered procedurally (Zero tofu glyphs!)
  drawPill(worldX, worldY, symbol, remainder, color, bg = 'rgba(18, 18, 37, 0.92)') {
    const ctx = this.ctx;
    const [sx, sy] = this.toScreen(worldX, worldY);
    ctx.save();
    ctx.font = 'bold 12px "Share Tech Mono", monospace';

    const cleanRem = remainder || '';
    const cleanSym = symbol || '';

    const symWidth = cleanSym ? ctx.measureText(cleanSym).width : 0;
    const remWidth = cleanRem ? ctx.measureText(cleanRem).width : 0;
    const totalW = symWidth + remWidth;
    const totalH = 17;
    const padX = 7;
    const padY = 3;

    const boxW = totalW + padX * 2;
    const boxH = totalH + padY * 2;
    const boxX = sx - boxW / 2;
    const boxY = sy - boxH / 2;

    // Pill background
    ctx.fillStyle = bg;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(boxX, boxY, boxW, boxH, 4);
    else ctx.rect(boxX, boxY, boxW, boxH);
    ctx.fill();
    ctx.stroke();

    let curX = boxX + padX;
    const textY = sy + 0.5;

    // Symbol with procedural vector arrow on top
    if (cleanSym) {
      ctx.fillStyle = color;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(cleanSym, curX, textY);

      // Procedural mini vector arrow
      const arrowY = textY - 8;
      const arrowW = Math.max(7, symWidth - 1);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(curX, arrowY);
      ctx.lineTo(curX + arrowW, arrowY);
      ctx.lineTo(curX + arrowW - 2.5, arrowY - 2.5);
      ctx.moveTo(curX + arrowW, arrowY);
      ctx.lineTo(curX + arrowW - 2.5, arrowY + 2.5);
      ctx.stroke();

      curX += symWidth;
    }

    if (cleanRem) {
      ctx.fillStyle = color;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(cleanRem, curX, textY);
    }

    ctx.restore();
  }

  // Draw floating multi-line info card on canvas
  drawInfoCard(worldX, worldY, lines, color, bg = 'rgba(18, 18, 37, 0.94)') {
    const ctx = this.ctx;
    const [sx, sy] = this.toScreen(worldX, worldY);
    ctx.save();
    ctx.font = '11px "Share Tech Mono", monospace';

    let maxW = 0;
    lines.forEach(l => {
      const w = ctx.measureText(l).width;
      if (w > maxW) maxW = w;
    });

    const lineH = 16;
    const padX = 10;
    const padY = 8;
    const boxW = maxW + padX * 2;
    const boxH = lines.length * lineH + padY * 2;

    const boxX = sx;
    const boxY = sy - boxH / 2;

    ctx.fillStyle = bg;
    ctx.strokeStyle = 'rgba(88, 196, 221, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(boxX, boxY, boxW, boxH, 6);
    else ctx.rect(boxX, boxY, boxW, boxH);
    ctx.fill();
    ctx.stroke();

    lines.forEach((l, i) => {
      ctx.fillStyle = i === 0 ? color : 'rgba(240, 244, 252, 0.9)';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(l, boxX + padX, boxY + padY + i * lineH);
    });

    ctx.restore();
  }

  drawDashedLine(x1, y1, x2, y2, color, alpha = 0.5) {
    const ctx = this.ctx;
    const [sx1, sy1] = this.toScreen(x1, y1);
    const [sx2, sy2] = this.toScreen(x2, y2);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(sx1, sy1);
    ctx.lineTo(sx2, sy2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  drawPoint(x, y, color, radius = 4) {
    const ctx = this.ctx;
    const [sx, sy] = this.toScreen(x, y);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(sx, sy, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  drawComponentLines(x, y, color) {
    this.drawDashedLine(x, 0, x, y, color, 0.35);
    this.drawDashedLine(0, y, x, y, color, 0.35);
  }

  destroy() {
    window.removeEventListener('resize', this._resizeHandler);
  }
}

// ═══════════════════════════════════════════
// ANIMATION HELPERS
// ═══════════════════════════════════════════

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp01(t) { return Math.max(0, Math.min(1, t)); }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function cancelAnim() {
  if (animFrameId) {
    cancelAnimationFrame(animFrameId);
    animFrameId = null;
  }
}

// STEP DRAWING FUNCTIONS (PILL-BASED & COLLISION-FREE)
// ═══════════════════════════════════════════

// ── STEP 1 ──
function step1Draw(mode) {
  cancelAnim();
  const vc = new VectorCanvas('cv1');
  if (!vc.canvas) return;
  vc.clear();
  vc.drawGrid();

  if (mode === 'scalar' || mode === 'both') {
    const [sx, sy] = vc.toScreen(-3, 3);
    vc.ctx.font = 'bold 24px "Share Tech Mono", monospace';
    vc.ctx.fillStyle = COL.yellow;
    vc.ctx.textAlign = 'center';
    vc.ctx.textBaseline = 'middle';
    vc.ctx.fillText('25 °C', sx, sy);
    vc.drawPill(-3, 2.2, '', '(solo un numero)', 'rgba(255,238,0,0.85)', 'rgba(18,18,37,0.8)');
  }

  if (mode === 'vector' || mode === 'both') {
    // Vector F
    vc.drawVector(0, 0, 3, 2, COL.a, 3);
    // Pill label placed safely above the shaft (no line collision!)
    vc.drawPill(1.3, 1.6, 'F', ' = (3, 2)', COL.a);

    // Floating card safely to the right
    vc.drawInfoCard(3.3, 2.3, [
      '• Direzione: retta a ~34° ↗',
      '• Verso: in alto a destra ↗',
      '• Modulo: |F| ≈ 3.6 N'
    ], COL.a);
  }

  document.querySelectorAll('#focusCard .anim-btn').forEach(b => {
    b.classList.remove('active');
    if ((mode === 'both' && b.textContent.includes('TUTTO')) ||
        (mode === 'scalar' && b.textContent.includes('SCALARE')) ||
        (mode === 'vector' && b.textContent.includes('VETTORE'))) {
      b.classList.add('active');
    }
  });
}
function step1Show(m) { step1Draw(m); }

// ── STEP 2: COMPONENTI ──
function step2Static() {
  cancelAnim();
  const vc = new VectorCanvas('cv2');
  if (!vc.canvas) return;
  vc.clear();
  vc.drawGrid();
  vc.drawComponentLines(3, 4, COL.component);

  // Components: horizontal (inside triangle) and vertical (right side)
  vc.drawVector(0, 0, 3, 0, COL.yellow, 2.2, 0.85);
  vc.drawPill(1.5, 0.45, '', 'ax = 3', COL.yellow); // Above axis tick marks!

  vc.drawVector(3, 0, 3, 4, COL.yellow, 2.2, 0.85);
  vc.drawPill(3.8, 2.0, '', 'ay = 4', COL.yellow); // Outside right!

  // Hypotenuse vector a
  vc.drawVector(0, 0, 3, 4, COL.a, 3);
  vc.drawPill(1.1, 2.7, 'a', ' = (3, 4)', COL.a); // Outside upper-left!

  // Tip point
  vc.drawPoint(3, 4, COL.a, 5);
  vc.drawPill(3.0, 4.6, '', '(3, 4)', COL.a); // Clear of the arrow tip!

  document.querySelectorAll('#focusCard .anim-btn').forEach(b => b.classList.remove('active'));
  const btnStatic = document.querySelectorAll('#focusCard .anim-btn')[1];
  if (btnStatic) btnStatic.classList.add('active');
}

function step2Anim() {
  cancelAnim();
  const vc = new VectorCanvas('cv2');
  if (!vc.canvas) return;

  document.querySelectorAll('#focusCard .anim-btn').forEach(b => b.classList.remove('active'));
  const btnAnim = document.querySelectorAll('#focusCard .anim-btn')[0];
  if (btnAnim) btnAnim.classList.add('active');

  const duration = 2400;
  const start = performance.now();

  function frame(now) {
    const elapsed = now - start;
    const t = clamp01(elapsed / duration);

    vc.clear();
    vc.drawGrid();

    // Phase 1: draw vector a growing (0 -> 0.4)
    const t1 = clamp01(t / 0.4);
    const vx = lerp(0, 3, easeInOut(t1));
    const vy = lerp(0, 4, easeInOut(t1));
    vc.drawVector(0, 0, vx, vy, COL.a, 3);
    if (t1 > 0.6) {
      vc.drawPill(1.1, 2.7, 'a', ' = (3, 4)', COL.a);
    }

    // Phase 2: show components (0.4 -> 0.8)
    if (t > 0.4) {
      const t2 = clamp01((t - 0.4) / 0.4);
      const alpha = easeInOut(t2);
      vc.drawDashedLine(3, 0, 3, 4, COL.component, alpha * 0.4);
      vc.drawDashedLine(0, 4, 3, 4, COL.component, alpha * 0.4);
      vc.drawVector(0, 0, 3 * alpha, 0, COL.yellow, 2.2, alpha * 0.85);
      vc.drawVector(3, 0, 3, 4 * alpha, COL.yellow, 2.2, alpha * 0.85);

      if (t2 > 0.5) {
        vc.drawPill(1.5, 0.45, '', 'ax = 3', COL.yellow);
        vc.drawPill(3.8, 2.0, '', 'ay = 4', COL.yellow);
      }
    }

    // Phase 3: show tip point
    if (t > 0.8) {
      const t3 = clamp01((t - 0.8) / 0.2);
      vc.drawPoint(3, 4, COL.a, 5 * easeInOut(t3));
      if (t3 > 0.4) {
        vc.drawPill(3.0, 4.6, '', '(3, 4)', COL.a);
      }
    }

    if (t < 1) {
      animFrameId = requestAnimationFrame(frame);
    }
  }
  animFrameId = requestAnimationFrame(frame);
}

// ── STEP 3: SOMMA PUNTA-CODA ──
let step3Phase = 0;

function step3Reset() {
  cancelAnim();
  step3Phase = 0;
  const vc = new VectorCanvas('cv3');
  if (!vc.canvas) return;
  vc.clear();
  vc.drawGrid();

  ['step3msg1','step3msg2','step3msg3'].forEach(id => { const el = document.getElementById(id); if(el) el.style.opacity = '0.3'; });
  const r = document.getElementById('step3result'); if(r) r.style.opacity = '0';
}

function step3Anim() {
  step3Phase++;
  if (step3Phase > 3) { step3Reset(); step3Phase = 1; }
  cancelAnim();

  const vc = new VectorCanvas('cv3');
  if (!vc.canvas) return;

  const ax = 3, ay = 2, bx = 1, by = 3;
  const duration = 750;
  const start = performance.now();

  function frame(now) {
    const t = clamp01((now - start) / duration);
    const e = easeInOut(t);
    vc.clear();
    vc.drawGrid();

    // Phase 1: draw a
    if (step3Phase >= 1) {
      const p = step3Phase === 1 ? e : 1;
      vc.drawVector(0, 0, ax * p, ay * p, COL.a, 3);
      if (p > 0.6) {
        vc.drawPill(1.5, 0.5, 'a', ' = (3, 2)', COL.a);
        vc.drawPoint(ax, ay, COL.a, 4);
      }
      const m1 = document.getElementById('step3msg1'); if(m1) m1.style.opacity = '1';
    }

    // Phase 2: draw b at tip of a
    if (step3Phase >= 2) {
      const p = step3Phase === 2 ? e : 1;
      vc.drawVector(ax, ay, ax + bx * p, ay + by * p, COL.b, 3);
      if (p > 0.6) {
        vc.drawPill(3.9, 3.5, 'b', ' = (1, 3)', COL.b);
      }
      const m2 = document.getElementById('step3msg2'); if(m2) m2.style.opacity = '1';
    }

    // Phase 3: draw sum s
    if (step3Phase >= 3) {
      const p = step3Phase === 3 ? e : 1;
      vc.drawVector(0, 0, (ax + bx) * p, (ay + by) * p, COL.sum, 3.5);
      if (p > 0.6) {
        vc.drawPill(1.4, 3.1, 's', ' = a + b', COL.sum);
        vc.drawPoint(ax + bx, ay + by, COL.sum, 5);
        vc.drawPill(4.0, 5.6, '', '(4, 5)', COL.sum);
      }
      const m3 = document.getElementById('step3msg3'); if(m3) m3.style.opacity = '1';
      const r = document.getElementById('step3result'); if(r) r.style.opacity = p > 0.5 ? '1' : '0';
    }

    if (t < 1) animFrameId = requestAnimationFrame(frame);
  }
  animFrameId = requestAnimationFrame(frame);
}

// ── STEP 4: PARALLELOGRAMMA ──
let step4Phase = 0;

function step4Reset() {
  cancelAnim();
  step4Phase = 0;
  const vc = new VectorCanvas('cv4');
  if (!vc.canvas) return;
  vc.clear();
  vc.drawGrid();
  ['step4msg1','step4msg2','step4msg3'].forEach(id => { const el = document.getElementById(id); if(el) el.style.opacity = '0.3'; });
  const r = document.getElementById('step4result'); if(r) r.style.opacity = '0';
}

function step4Anim() {
  step4Phase++;
  if (step4Phase > 3) { step4Reset(); step4Phase = 1; }
  cancelAnim();

  const vc = new VectorCanvas('cv4');
  if (!vc.canvas) return;

  const ax = 3, ay = 1, bx = 1, by = 3;
  const duration = 750;
  const start = performance.now();

  function frame(now) {
    const t = clamp01((now - start) / duration);
    const e = easeInOut(t);
    vc.clear();
    vc.drawGrid();

    // Phase 1: both from origin
    if (step4Phase >= 1) {
      const p = step4Phase === 1 ? e : 1;
      vc.drawVector(0, 0, ax * p, ay * p, COL.a, 3);
      vc.drawVector(0, 0, bx * p, by * p, COL.b, 3);
      if (p > 0.6) {
        vc.drawPill(1.8, 0.35, 'a', ' = (3, 1)', COL.a);
        vc.drawPill(0.1, 1.8, 'b', ' = (1, 3)', COL.b);
      }
      const m1 = document.getElementById('step4msg1'); if(m1) m1.style.opacity = '1';
    }

    // Phase 2: parallelogram sides
    if (step4Phase >= 2) {
      const p = step4Phase === 2 ? e : 1;
      vc.drawDashedLine(ax, ay, ax + bx * p, ay + by * p, COL.b, 0.55);
      vc.drawDashedLine(bx, by, bx + ax * p, by + ay * p, COL.a, 0.55);
      const m2 = document.getElementById('step4msg2'); if(m2) m2.style.opacity = '1';
    }

    // Phase 3: diagonal = sum
    if (step4Phase >= 3) {
      const p = step4Phase === 3 ? e : 1;
      vc.drawDashedLine(ax, ay, ax + bx, ay + by, COL.b, 0.55);
      vc.drawDashedLine(bx, by, bx + ax, by + ay, COL.a, 0.55);
      vc.drawVector(0, 0, (ax + bx) * p, (ay + by) * p, COL.sum, 3.5);
      if (p > 0.6) {
        vc.drawPill(1.8, 2.6, 's', ' = a + b', COL.sum);
        vc.drawPoint(ax + bx, ay + by, COL.sum, 5);
        vc.drawPill(4.7, 4.3, '', '(4, 4)', COL.sum);
      }
      const m3 = document.getElementById('step4msg3'); if(m3) m3.style.opacity = '1';
      const r = document.getElementById('step4result'); if(r) r.style.opacity = p > 0.5 ? '1' : '0';
    }

    if (t < 1) animFrameId = requestAnimationFrame(frame);
  }
  animFrameId = requestAnimationFrame(frame);
}

// ── STEP 5: DIFFERENZA ──
let step5Phase = 0;

function step5Reset() {
  cancelAnim();
  step5Phase = 0;
  const vc = new VectorCanvas('cv5');
  if (!vc.canvas) return;
  vc.clear();
  vc.drawGrid();
  // Vector a
  vc.drawVector(0, 0, 4, 2, COL.a, 3);
  vc.drawPill(2.0, 1.6, 'a', ' = (4, 2)', COL.a);
  // Vector b
  vc.drawVector(0, 0, 1, 3, COL.b, 2.5);
  vc.drawPill(0.3, 2.0, 'b', ' = (1, 3)', COL.b);

  ['step5msg1','step5msg2','step5msg3'].forEach(id => { const el = document.getElementById(id); if(el) el.style.opacity = '0.3'; });
  const r = document.getElementById('step5result'); if(r) r.style.opacity = '0';
}

function step5Anim() {
  step5Phase++;
  if (step5Phase > 3) { step5Reset(); step5Phase = 1; }
  cancelAnim();

  const vc = new VectorCanvas('cv5');
  if (!vc.canvas) return;

  const ax = 4, ay = 2, bx = 1, by = 3;
  const duration = 850;
  const start = performance.now();

  function frame(now) {
    const t = clamp01((now - start) / duration);
    const e = easeInOut(t);
    vc.clear();
    vc.drawGrid();

    // Vector a
    vc.drawVector(0, 0, ax, ay, COL.a, 3);
    vc.drawPill(2.0, 1.6, 'a', ' = (4, 2)', COL.a);

    // Phase 1: show -b
    if (step5Phase >= 1) {
      const p = step5Phase === 1 ? e : 1;
      vc.drawVector(0, 0, bx, by, COL.b, 2, Math.max(0.15, 1 - p * 0.7));
      vc.drawVector(0, 0, -bx * p, -by * p, COL.orange, 2.5, p);
      if (p > 0.6) {
        vc.drawPill(-1.1, -1.9, '-b', ' = (-1, -3)', COL.orange);
      }
      const m1 = document.getElementById('step5msg1'); if(m1) m1.style.opacity = '1';
    }

    // Phase 2: translated -b to tip of a
    if (step5Phase >= 2) {
      const p = step5Phase === 2 ? e : 1;
      const sx = lerp(0, ax, p);
      const sy = lerp(0, ay, p);
      vc.drawVector(sx, sy, sx - bx, sy - by, COL.orange, 2.5);
      if (p > 0.7) {
        vc.drawPill(4.2, 0.6, '-b', '', COL.orange);
      }
      const m2 = document.getElementById('step5msg2'); if(m2) m2.style.opacity = '1';
    }

    // Phase 3: difference d = a - b
    if (step5Phase >= 3) {
      const p = step5Phase === 3 ? e : 1;
      vc.drawVector(ax, ay, ax - bx, ay - by, COL.orange, 2.2, 0.7);
      vc.drawVector(0, 0, (ax - bx) * p, (ay - by) * p, COL.diff, 3.5);
      if (p > 0.6) {
        vc.drawPill(1.3, -1.0, 'd', ' = a - b', COL.diff);
        vc.drawPoint(ax - bx, ay - by, COL.diff, 5);
        vc.drawPill(3.8, -1.0, '', '(3, -1)', COL.diff);
      }
      const m3 = document.getElementById('step5msg3'); if(m3) m3.style.opacity = '1';
      const r = document.getElementById('step5result'); if(r) r.style.opacity = p > 0.5 ? '1' : '0';
    }

    if (t < 1) animFrameId = requestAnimationFrame(frame);
  }
  animFrameId = requestAnimationFrame(frame);
}

// ── STEP 6: SCALARE × VETTORE ──
function step6Draw(k) {
  cancelAnim();
  const vc = new VectorCanvas('cv6');
  if (!vc.canvas) return;

  const ax = 2, ay = 1;
  const duration = 600;
  const start = performance.now();

  document.querySelectorAll('#focusCard .anim-btn').forEach(b => {
    b.classList.remove('active');
    if (b.textContent.includes(k === -1.5 ? '−1.5' : k === -1 ? '−1' : String(k))) b.classList.add('active');
  });

  const rx = k * ax, ry = k * ay;
  const textEl = document.getElementById('step6text');
  let desc = '';
  if (k === 2) desc = `2 · a = (${rx}, ${ry}) — il vettore raddoppia la lunghezza!`;
  else if (k === 0.5) desc = `0.5 · a = (${rx}, ${ry}) — il vettore si dimezza!`;
  else if (k === -1) desc = `−1 · a = (${rx}, ${ry}) — stessa lunghezza, verso opposto!`;
  else if (k === -1.5) desc = `−1.5 · a = (${rx}, ${ry}) — più lungo E verso opposto!`;
  if (textEl) textEl.textContent = desc;

  function frame(now) {
    const t = clamp01((now - start) / duration);
    const e = easeInOut(t);
    vc.clear();
    vc.drawGrid();

    // Original vector (dimmed)
    vc.drawVector(0, 0, ax, ay, COL.a, 2, 0.4);
    vc.drawPill(0.8, 0.9, 'a', ' = (2, 1)', COL.a, 'rgba(18,18,37,0.7)');

    // Scaled vector growing
    const cx = ax * k * e;
    const cy = ay * k * e;
    vc.drawVector(0, 0, cx, cy, COL.purple, 3.2);

    if (t > 0.7) {
      const pillX = (cx * 0.5) + (k < 0 ? -0.4 : -0.4);
      const pillY = (cy * 0.5) + (k < 0 ? -0.5 : 0.5);
      vc.drawPill(pillX, pillY, `${k}·a`, '', COL.purple);
      vc.drawPoint(rx, ry, COL.purple, 5);
      vc.drawPill(rx + (rx >= 0 ? 0.7 : -0.7), ry + (ry >= 0 ? 0.4 : -0.4), '', `(${rx}, ${ry})`, COL.purple);
    }

    if (t < 1) animFrameId = requestAnimationFrame(frame);
  }
  animFrameId = requestAnimationFrame(frame);
}

// ── QUIZ ──
function checkQuiz(el, isCorrect, fbId) {
  const parent = el.parentElement;
  parent.querySelectorAll('.quiz-option').forEach(o => {
    o.classList.add('disabled');
    if (o === el) {
      o.classList.add(isCorrect ? 'correct' : 'wrong');
    }
  });
  const fb = document.getElementById(fbId);
  if (fb) {
    fb.classList.add('show', isCorrect ? 'ok' : 'ko');
    if (isCorrect) {
      fb.textContent = '✅ Esatto! Ottimo lavoro!';
    } else {
      fb.textContent = '❌ Non è la risposta giusta. Rileggi la spiegazione nel passo corrispondente e riprova!';
    }
  }
}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════

function loadCurrentStep() {
  cancelAnim();
  const step = STEPS[currentStep - 1];

  document.getElementById('stepBadge').textContent = step.badge;
  document.getElementById('stepTitle').textContent = step.title;
  document.getElementById('stepRule').textContent = step.rule;
  document.getElementById('stepCounterText').textContent = `PASSO ${currentStep} DI ${totalSteps}`;

  const card = document.getElementById('focusCard');
  card.innerHTML = step.render();

  // Jump buttons
  const jumpSel = document.getElementById('jumpSelector');
  jumpSel.innerHTML = '';
  for (let i = 1; i <= totalSteps; i++) {
    const btn = document.createElement('button');
    btn.className = 'jump-btn' + (i === currentStep ? ' active' : '');
    btn.textContent = i;
    btn.onclick = () => goToStep(i);
    jumpSel.appendChild(btn);
  }

  document.getElementById('btnPrev').disabled = (currentStep === 1);
  const nextBtn = document.getElementById('btnNext');
  nextBtn.innerHTML = currentStep === totalSteps
    ? 'RICOMINCIA <span>↺</span>'
    : 'SUCCESSIVO <span>►</span>';

  // Post-render callback
  if (step.onMount) {
    setTimeout(step.onMount, 60);
  }
}

function nextStep() {
  currentStep = currentStep < totalSteps ? currentStep + 1 : 1;
  loadCurrentStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevStep() {
  if (currentStep > 1) {
    currentStep--;
    loadCurrentStep();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function goToStep(s) {
  currentStep = s;
  loadCurrentStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextStep();
  else if (e.key === 'ArrowLeft') prevStep();
});

window.addEventListener('DOMContentLoaded', () => {
  loadCurrentStep();
});
</script>
