/* ══════════════════════════════════════════════════════════════════════════════
   ARCHITETTURA ZERO-SCROLL 100VH OTTIMIZZATA PER LIM PROMETHEAN

:root {
  --bg-page: #f1f5f9;
  --bg-panel: #ffffff;
  --bg-canvas: #ffffff;
  --bg-subtle: #f8fafc;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #64748b;
  --border-ui: #cbd5e1;
  --border-light: #e2e8f0;

  --c-p1: #2563eb;       /* Blu: Corpo 1 (Lui / Vagone 1) */
  --c-p2: #ea580c;       /* Arancio/Corallo: Corpo 2 (Lei / Vagone 2) */
  --c-ptot: #16a34a;     /* Verde: Risultante / Conservazione p */
  --c-kin: #7c3aed;      /* Viola: Energia Cinetica K */
  --c-warn: #dc2626;     /* Rosso: Attenzione segni / Perdita K */

  --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-tech: 'Share Tech Mono', monospace;
}

body.dark-mode {
  --bg-page: #090d16;
  --bg-panel: #111827;
  --bg-canvas: #0f172a;
  --bg-subtle: #1e293b;
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --border-ui: #334155;
  --border-light: #1f2937;

  --c-p1: #60a5fa;
  --c-p2: #fb923c;
  --c-ptot: #4ade80;
  --c-kin: #a78bfa;
  --c-warn: #f87171;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  font-family: var(--font-main);
  background-color: var(--bg-page);
  color: var(--text-primary);
  transition: background-color 0.2s ease, color 0.2s ease;
}

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* Fallback per schermi piccoli / tablet verticali */
@media (max-width: 980px), (max-height: 580px) {
  body {
    height: auto;
    min-height: 100vh;
    overflow-y: auto;
  }
}

/* ──────────────── HEADER COMPATTO LIM ──────────────── */
.app-header {

}

.header-left {

.btn-back-course {

}

}

.btn-sim-primary {
  background: #2563eb;
  color: #ffffff;

}
.btn-sim-primary:hover {

  color: #ffffff;
}

.sim-phase-tags {

  border: 1px solid var(--border-ui);

}

.steps-pane {

}

}

.step-badge {
  font-family: var(--font-tech);
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--c-p1);
  background: rgba(37, 99, 235, 0.1);
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid rgba(37, 99, 235, 0.25);
}

.book-ref-tag {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--bg-subtle);
  padding: 2px 8px;
  border-radius: 5px;
  border: 1px solid var(--border-light);
}

.step-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text-primary);
  line-height: 1.25;
}

/* Scala testo per LIM */
.step-body {
  display: flex;
  flex-direction: column;
  gap: 9px;
  font-size: 0.92rem;

}

body.scale-xl .step-body { font-size: 1.15rem; line-height: 1.54; }

.problem-quote {
  background: var(--bg-subtle);
  border: 1px solid var(--border-ui);
  border-left: 4px solid var(--c-p1);

  font-weight: 700;
}

.callout-box {
  padding: 8px 12px;
  border-radius: 0 8px 8px 0;
  font-size: 0.92em;
  border-left: 4px solid;
}
.callout-green {
  background: #f0fdf4;

}

.callout-warn {
  background: #fef2f2;

}

.callout-blue {
  background: #eff6ff;
  border-color: #2563eb;
  color: #1e40af;
}
body.dark-mode .callout-blue { background: rgba(37, 99, 235, 0.14); color: #bfdbfe; }

.callout-amber {
  background: #fffbeb;
  border-color: #d97706;
  color: #92400e;
}
body.dark-mode .callout-amber { background: rgba(217, 119, 6, 0.14); color: #fcd34d; }

.math-card {
  background: var(--bg-subtle);
  border: 1px solid var(--border-ui);
  border-radius: 8px;
  padding: 8px 12px;
  overflow-x: auto;
  color: var(--text-primary);
}
.math-card .katex-display {
  margin: 0.35em 0 !important;
}

/* Passaggi rivelabili cliccabili alla LIM */
.reveal-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.reveal-step {
  border: 1px solid var(--border-ui);
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg-subtle);
}
.reveal-btn {
  width: 100%;
  text-align: left;
  padding: 7px 11px;
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-weight: 700;
  font-size: 0.92em;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.reveal-btn:hover {
  background: rgba(37, 99, 235, 0.06);
}
.reveal-content {
  padding: 6px 11px 9px;
  border-top: 1px dashed var(--border-ui);
  background: var(--bg-panel);
  display: none;
}
.reveal-step.open .reveal-content {
  display: block;
}
.reveal-step.open .reveal-chevron {
  transform: rotate(180deg);
}
.reveal-chevron {
  transition: transform 0.2s ease;
  font-size: 0.8em;
  color: var(--c-p1);
}

/* Grid dati compatta */
.data-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}
.data-pill {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--border-ui);
  background: var(--bg-subtle);
  font-size: 0.88em;
}
.data-pill.p1 { border-left: 4px solid var(--c-p1); }
.data-pill.p2 { border-left: 4px solid var(--c-p2); }

/* Sliders Sandbox */
.sandbox-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.slider-box {
  background: var(--bg-subtle);
  border: 1px solid var(--border-ui);
  border-radius: 8px;
  padding: 7px 10px;
}
.slider-head {
  display: flex;
  justify-content: space-between;
  font-size: 0.82em;
  font-weight: 700;
  margin-bottom: 3px;
}
.slider-box input[type="range"] {
  width: 100%;
  accent-color: var(--c-p1);
  cursor: pointer;
}

/* Quiz Rapido LIM */
.quiz-box {
  border: 1px solid var(--border-ui);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--bg-subtle);
}
.quiz-q {
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 6px;
  font-size: 0.92em;
}
.quiz-opts {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.quiz-opt {
  text-align: left;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--border-ui);
  background: var(--bg-panel);
  color: var(--text-primary);
  font-size: 0.88em;

}
.quiz-opt:hover { border-color: var(--c-p1); }

body.dark-mode .quiz-opt.correct { background: rgba(22, 163, 74, 0.25); color: #86efac; }
body.dark-mode .quiz-opt.wrong { background: rgba(220, 38, 38, 0.25); color: #fca5a5; }

/* ──────────────── FOOTER NAVIGAZIONE PASSI ──────────────── */
.steps-footer-nav {
  background: var(--bg-panel);
  border-top: 2px solid var(--border-ui);
  padding: 7px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  z-index: 35;
}

.step-pills-list {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
}

.step-pill {
  padding: 5px 10px;
  border-radius: 999px;
  border: 1.5px solid var(--border-ui);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  font-family: var(--font-main);
  font-weight: 700;
  font-size: 0.78rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;

.step-pill:hover {
  border-color: var(--c-p1);
  color: var(--c-p1);
}

  background: #2563eb;
  border-color: #1d4ed8;

  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
}

.btn-nav-step {
  padding: 6px 14px;
  font-size: 0.85rem;
  font-weight: 700;
  border-radius: 8px;
  border: 1.5px solid var(--border-ui);
  background: var(--bg-subtle);
  color: var(--text-primary);

  align-items: center;

/* ──────────────── LAYER PENNA LIM GLOBALE + TOOLBAR FLOTTANTE ──────────────── */
canvas#globalPenCanvas {

  inset: 0;
  width: 100vw;
  height: 100vh;

  pointer-events: none;

.lim-floating-bar {

.lim-tools-row {

.btn-lim-action {

<header class="app-header">

    <div class="title-container">
      <h1>💥 Gli Urti &amp; Conservazione della Quantità di Moto</h1>

/* ──────────────── CALCOLI FISICI IN TEMPO REALE ──────────────── */
function getPhysics() {
  const { m1, v1, m2, v2, elastic } = STATE;
  const p1_i = m1 * v1;
  const p2_i = m2 * v2;
  const pTot = p1_i + p2_i;

  const K_i = 0.5 * m1 * v1 * v1 + 0.5 * m2 * v2 * v2;

  let v1_f, v2_f;
  if (elastic) {
    v1_f = ((m1 - m2) * v1 + 2 * m2 * v2) / (m1 + m2);
    v2_f = ((m2 - m1) * v2 + 2 * m1 * v1) / (m1 + m2);
  } else {
    const vf = pTot / (m1 + m2);
    v1_f = vf;
    v2_f = vf;
  }

  const p1_f = m1 * v1_f;
  const p2_f = m2 * v2_f;
  const K_f = 0.5 * m1 * v1_f * v1_f + 0.5 * m2 * v2_f * v2_f;
  const dK = K_f - K_i; // <= 0

  // Verifica se avviene realmente un urto (v1 > v2 partendo da sinistra a destra)
  const canCollide = (v1 - v2) > 0.001;

  return {
    p1_i, p2_i, pTot,
    v1_f, v2_f, p1_f, p2_f,
    K_i, K_f, dK,
    canCollide
  };
}

  STATE.isPlaying = false;
  updatePlayButton();
  updatePhaseButtons();
  updateTelemetry();
  document.getElementById('modeBadge').textContent = sc.label;
}

/* ──────────────── RENDER PASSO E KATEX ──────────────── */
function renderKaTeX(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\(", right: "\\)", display: false },
        { left: "$", right: "$", display: false }
      ],
      throwOnError: false
    });
  }
}

function goToStep(stepNum) {
  STATE.activeStep = Math.max(1, Math.min(7, stepNum));
  const step = STEPS[STATE.activeStep];
  loadScenario(step.scenario);
  renderStep();

  document.querySelectorAll('.step-pill').forEach(p => {
    p.classList.toggle('active', parseInt(p.dataset.step) === STATE.activeStep);
  });
  document.getElementById('btnPrevStep').disabled = (STATE.activeStep === 1);
  document.getElementById('btnNextStep').disabled = (STATE.activeStep === 7);
}

/* ──────────────── MOTORE GRAFICO CANVAS HIGH-DPI ──────────────── */
const simCanvas = document.getElementById('simCanvas');
const ctx = simCanvas.getContext('2d');

function resizeSimCanvas() {
  const wrap = document.getElementById('canvasWrapper');
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  if (w > 0 && h > 0) {
    simCanvas.width = Math.round(w * dpr);
    simCanvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}
new ResizeObserver(resizeSimCanvas).observe(document.getElementById('canvasWrapper'));

function drawArrow(x1, y1, x2, y2, color, width = 3, label = "") {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len < 3) return;
  const angle = Math.atan2(dy, dx);
  const head = Math.min(11, Math.max(7, len * 0.25));

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();

  if (label) {
    ctx.font = "700 12px 'IBM Plex Mono', monospace";
    ctx.textAlign = "center";
    const lx = (x1 + x2) / 2;
    const ly = y1 - 8;
    ctx.fillText(label, lx, ly);
  }
  ctx.restore();
}

function drawSkater(x, y, color, label, isFemale, liftedOffset = 0, labelBottom = false) {
  ctx.save();
  ctx.translate(x, y - liftedOffset);

  // Ombra sul ghiaccio
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath();
  ctx.ellipse(0, 32 + liftedOffset, 18, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pattini
  ctx.strokeStyle = "#475569";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-10, 30); ctx.lineTo(-2, 30);
  ctx.moveTo(2, 30); ctx.lineTo(10, 30);
  ctx.stroke();

  // Corpo stilizzato elegante
  ctx.fillStyle = color;
  if (isFemale) {
    // Gonna pattinaggio
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(-14, 16);
    ctx.lineTo(14, 16);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.roundRect(-10, -10, 20, 26, 6);
    ctx.fill();
  }

  // Gambe
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-5, 16); ctx.lineTo(-6, 29);
  ctx.moveTo(5, 16); ctx.lineTo(6, 29);
  ctx.stroke();

  // Testa
  ctx.fillStyle = "#fde68a";
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, -19, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Etichetta
  ctx.fillStyle = color;
  ctx.font = "800 12px 'Inter', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(label, 0, labelBottom ? 50 + liftedOffset : -34);

  ctx.restore();
}

function drawTrainCar(x, y, w, h, color, label, coupled = false) {
  ctx.save();
  ctx.translate(x, y);

  // Scocca vagone
  ctx.fillStyle = color;
  ctx.strokeStyle = "#0f172a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-w / 2, -h, w, h - 10, 6);
  ctx.fill();
  ctx.stroke();

  // Finestrini / striscia tecnica
  ctx.fillStyle = "rgba(255,255,255,0.22)";
  ctx.fillRect(-w / 2 + 8, -h + 8, w - 16, 10);

  // Ruote ferroviarie
  ctx.fillStyle = "#334155";
  [-w / 3, w / 3].forEach(wx => {
    ctx.beginPath();
    ctx.arc(wx, -6, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#94a3b8";
    ctx.beginPath();
    ctx.arc(wx, -6, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#334155";
  });

  // Etichetta massa
  ctx.fillStyle = "#ffffff";
  ctx.font = "800 12px 'Inter', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(label, 0, -h / 2 + 4);

  ctx.restore();
}

function drawCart(x, y, w, h, color, label) {
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = color;
  ctx.strokeStyle = "#0f172a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-w / 2, -h, w, h - 8, 8);
  ctx.fill();
  ctx.stroke();

  // Ruote
  ctx.fillStyle = "#1e293b";
  [-w / 3, w / 3].forEach(wx => {
    ctx.beginPath();
    ctx.arc(wx, -5, 6, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = "#ffffff";
  ctx.font = "800 12px 'Inter', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(label, 0, -h / 2 + 2);

  ctx.restore();
}

function drawHUDBars(w, h, phys, afterImpact, isDark) {
  const boxW = Math.min(270, w * 0.44);
  const boxH = 82;
  const x0 = w - boxW - 14;
  const y0 = 12;

  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = isDark ? "rgba(15, 23, 42, 0.88)" : "rgba(248, 250, 252, 0.92)";
  ctx.strokeStyle = isDark ? "#334155" : "#cbd5e1";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(x0, y0, boxW, boxH, 10);
  ctx.fill();
  ctx.stroke();

  ctx.font = "800 11px 'Share Tech Mono', monospace";
  ctx.fillStyle = isDark ? "#e2e8f0" : "#0f172a";
  ctx.fillText("BILANCIO LIVE: p vs ENERGIA K", x0 + 10, y0 + 17);

  // Barra 1: p_tot (sempre 100% costante!)
  const maxBarW = boxW - 20;
  const cGreen = isDark ? "#4ade80" : "#16a34a";
  const cPurple = isDark ? "#a78bfa" : "#7c3aed";

  ctx.font = "700 10.5px 'IBM Plex Mono', monospace";
  ctx.fillStyle = cGreen;
  ctx.fillText(`p_tot = ${phys.pTot >= 0 ? '+' : ''}${phys.pTot.toFixed(0)} kg·m/s (COSTANTE!)`, x0 + 10, y0 + 34);

  ctx.fillStyle = isDark ? "#1e293b" : "#e2e8f0";
  ctx.fillRect(x0 + 10, y0 + 38, maxBarW, 9);
  ctx.fillStyle = cGreen;
  const pRatio = Math.abs(phys.pTot) > 0.01 ? 0.85 : 0.04;
  ctx.fillRect(x0 + 10, y0 + 38, maxBarW * pRatio, 9);

  // Barra 2: K_tot (cala nell'anelastico!)
  const curK = afterImpact ? phys.K_f : phys.K_i;
  const kRatio = phys.K_i > 0.001 ? Math.max(0.03, curK / phys.K_i) : 0;
  ctx.fillStyle = cPurple;
  const kPerc = phys.K_i > 0.001 ? Math.round((curK / phys.K_i) * 100) : 100;
  ctx.fillText(`K_tot = ${curK.toFixed(0)} J (${kPerc}% iniziale)`, x0 + 10, y0 + 62);

  ctx.fillStyle = isDark ? "#1e293b" : "#e2e8f0";
  ctx.fillRect(x0 + 10, y0 + 66, maxBarW, 9);
  ctx.fillStyle = cPurple;
  ctx.fillRect(x0 + 10, y0 + 66, maxBarW * kRatio, 9);

  ctx.restore();
}

function drawFrame() {
  const wrap = document.getElementById('canvasWrapper');
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  if (w === 0 || h === 0) return;

  const isDark = document.body.classList.contains('dark-mode');
  const c1 = isDark ? "#60a5fa" : "#2563eb";
  const c2 = isDark ? "#fb923c" : "#ea580c";
  const cTot = isDark ? "#4ade80" : "#16a34a";

  ctx.clearRect(0, 0, w, h);

  // Griglia leggera cartesiana
  ctx.strokeStyle = isDark ? "rgba(255,255,255,0.04)" : "rgba(15,23,42,0.04)";
  ctx.lineWidth = 1;
  for (let gx = 0; gx < w; gx += 40) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
  }
  for (let gy = 0; gy < h; gy += 40) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
  }

  const phys = getPhysics();
  const trackY = h * 0.65;

  // Pista / Binario / Ghiaccio
  ctx.strokeStyle = isDark ? "#475569" : "#94a3b8";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(20, trackY + 32);
  ctx.lineTo(w - 20, trackY + 32);
  ctx.stroke();

  if (STATE.kind === "trains") {
    // Traversine ferroviarie
    ctx.strokeStyle = isDark ? "#334155" : "#cbd5e1";
    ctx.lineWidth = 3;
    for (let tx = 28; tx < w - 24; tx += 22) {
      ctx.beginPath();
      ctx.moveTo(tx, trackY + 32);
      ctx.lineTo(tx, trackY + 39);
      ctx.stroke();
    }
  } else if (STATE.kind === "skaters") {
    // Riflesso azzurro pista ghiaccio
    ctx.fillStyle = isDark ? "rgba(56, 189, 248, 0.08)" : "rgba(186, 230, 253, 0.35)";
    ctx.fillRect(20, trackY + 32, w - 40, 12);
  }

  // Asse orientato in basso
  drawArrow(w * 0.08, trackY + 58, w * 0.25, trackY + 58, isDark ? "#94a3b8" : "#475569", 2, "+x (verso positivo)");

  // Calcolo posizioni in pixel
  const centerX = w * 0.50;
  const bodyW = STATE.kind === "skaters" ? 36 : 84;
  const bodyH = STATE.kind === "skaters" ? 45 : 44;
  const pxPerMeter = (w * 0.052) * STATE.unitScale;

  // Calcoliamo lo spostamento in base al tempo rispetto a tImpact
  const dtImpact = STATE.t - STATE.tImpact;
  const afterImpact = dtImpact >= 0 && phys.canCollide;

  let x1, x2, curV1, curV2, lifted = 0;

  if (!phys.canCollide) {
    // Nessun urto possibile (v1 <= v2)
    x1 = centerX - 90 + STATE.v1 * pxPerMeter * (STATE.t - 1.0);
    x2 = centerX + 90 + STATE.v2 * pxPerMeter * (STATE.t - 1.0);
    curV1 = STATE.v1;
    curV2 = STATE.v2;
  } else if (!afterImpact) {
    // Prima dell'urto: convergono esattamente a centerX a t = tImpact
    const timeToHit = STATE.tImpact - STATE.t;
    x1 = (centerX - bodyW / 2) - STATE.v1 * pxPerMeter * timeToHit;
    x2 = (centerX + bodyW / 2) - STATE.v2 * pxPerMeter * timeToHit;
    curV1 = STATE.v1;
    curV2 = STATE.v2;
  } else {
    // Dopo l'urto
    if (STATE.elastic) {
      x1 = (centerX - bodyW / 2) + phys.v1_f * pxPerMeter * dtImpact;
      x2 = (centerX + bodyW / 2) + phys.v2_f * pxPerMeter * dtImpact;
    } else {
      const commonX = centerX + phys.v1_f * pxPerMeter * dtImpact;
      if (STATE.kind === "skaters") {
        // Lui solleva lei!
        const liftProgress = Math.min(1, dtImpact / 0.45);
        lifted = 36 * liftProgress;
        x1 = commonX;
        x2 = commonX + 8 * (1 - liftProgress);
      } else {
        x1 = commonX - bodyW / 2;
        x2 = commonX + bodyW / 2;
      }
    }
    curV1 = phys.v1_f;
    curV2 = phys.v2_f;
  }

  // Clamp visivo morbido dentro l'area
  const clampX = x => Math.max(46, Math.min(w - 46, x));
  const dx1 = clampX(x1);
  const dx2 = clampX(x2);

  // Disegno corpi
  if (STATE.kind === "skaters") {
    drawSkater(dx1, trackY, c1, `Lui: ${STATE.m1}kg`, false, 0, lifted > 4);
    drawSkater(dx2, trackY, c2, `Lei: ${STATE.m2}kg`, true, lifted, false);
  } else if (STATE.kind === "trains") {
    drawTrainCar(dx1, trackY + 32, bodyW, bodyH, c1, `${(STATE.m1/1000).toFixed(1)}t`);
    drawTrainCar(dx2, trackY + 32, bodyW, bodyH, c2, `${(STATE.m2/1000).toFixed(1)}t`);
  } else {
    drawCart(dx1, trackY + 32, bodyW, bodyH, c1, `${STATE.m1} kg`);
    drawCart(dx2, trackY + 32, bodyW, bodyH, c2, `${STATE.m2} kg`);
  }

  // Effetto flash all'impatto
  if (phys.canCollide && Math.abs(dtImpact) < 0.18) {
    ctx.save();
    ctx.strokeStyle = "#f59e0b";
    ctx.lineWidth = 3;
    const r = 18 + (0.18 - Math.abs(dtImpact)) * 80;
    ctx.beginPath();
    ctx.arc(centerX, trackY, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "#f59e0b";
    ctx.font = "900 13px 'Inter', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(STATE.elastic ? "RIMBALZO!" : "AGGANCIO / URTO!", centerX, trackY - 46);
    ctx.restore();
  }

  // Frecce Velocità sopra ai corpi
  const vecScale = 14 * STATE.unitScale;
  if (!afterImpact || STATE.elastic || !phys.canCollide) {
    if (Math.abs(curV1) > 0.01) {
      drawArrow(dx1, trackY - 58, dx1 + curV1 * vecScale, trackY - 58, c1, 3.5, `v₁ = ${curV1 >= 0 ? '+' : ''}${curV1.toFixed(2)} m/s`);
    } else {
      ctx.save();
      ctx.fillStyle = c1; ctx.font = "700 11px 'IBM Plex Mono'"; ctx.textAlign = "center";
      ctx.fillText("v₁ = 0 m/s", dx1, trackY - 58);
      ctx.restore();
    }

    if (Math.abs(curV2) > 0.01) {
      drawArrow(dx2, trackY - 82, dx2 + curV2 * vecScale, trackY - 82, c2, 3.5, `v₂ = ${curV2 >= 0 ? '+' : ''}${curV2.toFixed(2)} m/s`);
    } else {
      ctx.save();
      ctx.fillStyle = c2; ctx.font = "700 11px 'IBM Plex Mono'"; ctx.textAlign = "center";
      ctx.fillText("v₂ = 0 (fermo)", dx2, trackY - 82);
      ctx.restore();
    }
  } else {
    // Velocità comune finale
    const midX = (dx1 + dx2) / 2;
    const arrowY = STATE.kind === "skaters" ? trackY - 102 : trackY - 72;
    if (Math.abs(curV1) > 0.01) {
      drawArrow(midX, arrowY, midX + curV1 * vecScale * 1.4, arrowY, cTot, 4, `v_f = ${curV1 >= 0 ? '+' : ''}${curV1.toFixed(2)} m/s (uniti)`);
    } else {
      ctx.save();
      ctx.fillStyle = cTot; ctx.font = "800 12px 'IBM Plex Mono'"; ctx.textAlign = "center";
      ctx.fillText("v_f = 0 m/s (fermi!)", midX, arrowY);
      ctx.restore();
    }
  }

  // Box riepilogo p_1, p_2, p_tot in alto a sinistra
  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = isDark ? "rgba(15, 23, 42, 0.88)" : "rgba(248, 250, 252, 0.92)";
  ctx.strokeStyle = isDark ? "#334155" : "#cbd5e1";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(14, 12, Math.min(255, w * 0.44), 82, 10);
  ctx.fill();
  ctx.stroke();

  ctx.font = "800 11px 'Share Tech Mono', monospace";
  ctx.fillStyle = isDark ? "#e2e8f0" : "#0f172a";
  ctx.fillText(afterImpact ? "STATO: DOPO L'URTO" : "STATO: PRIMA DELL'URTO", 24, 29);

  ctx.font = "700 11px 'IBM Plex Mono', monospace";
  const p1Show = afterImpact ? phys.p1_f : phys.p1_i;
  const p2Show = afterImpact ? phys.p2_f : phys.p2_i;

  ctx.fillStyle = c1;
  ctx.fillText(`p₁ = ${p1Show >= 0 ? '+' : ''}${p1Show.toFixed(0)} kg·m/s`, 24, 48);
  ctx.fillStyle = c2;
  ctx.fillText(`p₂ = ${p2Show >= 0 ? '+' : ''}${p2Show.toFixed(0)} kg·m/s`, 24, 65);
  ctx.fillStyle = cTot;
  ctx.fillText(`p_tot = ${phys.pTot >= 0 ? '+' : ''}${phys.pTot.toFixed(0)} kg·m/s`, 24, 83);
  ctx.restore();

  // HUD Barre a destra
  drawHUDBars(w, h, phys, afterImpact, isDark);

  if (!phys.canCollide) {
    ctx.fillStyle = "#dc2626";
    ctx.font = "800 13px 'Inter', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("⚠️ I due corpi si allontanano (v₁ ≤ v₂): non avviene alcun urto!", w / 2, h * 0.3);
  }
}

/* ──────────────── LOOP ANIMAZIONE ──────────────── */
let lastTs = performance.now();
function animLoop(now) {
  const dt = Math.min(0.05, (now - lastTs) / 1000);
  lastTs = now;

  if (STATE.isPlaying) {
    const speed = STATE.isSlowMo ? 0.4 : 1.0;
    STATE.t += dt * speed;
    if (STATE.t >= STATE.tMax) {
      STATE.t = STATE.tMax;
      STATE.isPlaying = false;
      updatePlayButton();
    }
    updatePhaseButtons();
  }

  drawFrame();
  requestAnimationFrame(animLoop);
}

/* ──────────────── CONTROLLI SIMULAZIONE & NAVIGAZIONE ──────────────── */
document.getElementById('btnPlayPause').onclick = () => {
  if (STATE.t >= STATE.tMax - 0.05) STATE.t = 0;
  STATE.isPlaying = !STATE.isPlaying;
  updatePlayButton();
};
document.getElementById('btnResetSim').onclick = () => {
  STATE.t = 0;
  STATE.isPlaying = false;
  updatePlayButton();
  updatePhaseButtons();
};
document.getElementById('btnSlowMo').onclick = (e) => {
  STATE.isSlowMo = !STATE.isSlowMo;
  e.target.classList.toggle('active', STATE.isSlowMo);
};

document.getElementById('btnPhaseBefore').onclick = () => {
  STATE.isPlaying = false; STATE.t = 0.4;
  updatePlayButton(); updatePhaseButtons();
};
document.getElementById('btnPhaseImpact').onclick = () => {
  STATE.isPlaying = false; STATE.t = STATE.tImpact;
  updatePlayButton(); updatePhaseButtons();
};
document.getElementById('btnPhaseAfter').onclick = () => {
  STATE.isPlaying = false; STATE.t = STATE.tImpact + 1.2;
  updatePlayButton(); updatePhaseButtons();
};

document.getElementById('btnPrevStep').onclick = () => goToStep(STATE.activeStep - 1);
document.getElementById('btnNextStep').onclick = () => goToStep(STATE.activeStep + 1);
document.querySelectorAll('.step-pill').forEach(btn => {
  btn.onclick = () => goToStep(parseInt(btn.dataset.step));
});

/* ──────────────── STRUMENTI LIM: TESTO, TEMA, FULLSCREEN, PENNA GLOBALE ──────────────── */
document.getElementById('btnScaleFont').onclick = (e) => {
  STATE.fontScaleIdx = (STATE.fontScaleIdx + 1) % 3;
  document.body.classList.remove('scale-lg', 'scale-xl');
  if (STATE.fontScaleIdx === 1) document.body.classList.add('scale-lg');
  if (STATE.fontScaleIdx === 2) document.body.classList.add('scale-xl');
  e.target.textContent = ['A+ Testo', 'A++ Grande', 'A↺ Normale'][STATE.fontScaleIdx];
};

document.getElementById('btnToggleDark').onclick = (e) => {
  document.body.classList.toggle('dark-mode');
  e.target.textContent = document.body.classList.contains('dark-mode') ? '☀️ Chiaro' : '🌙 Tema';
};

document.getElementById('btnFullscreen').onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
};

/* Motore Penna LIM Globale su tutto lo schermo */
const penCanvas = document.getElementById('globalPenCanvas');
const penCtx = penCanvas.getContext('2d');
let penActive = false;
let penDrawing = false;
let penMode = 'pen'; // 'pen' | 'highlighter' | 'eraser'
let penColor = '#dc2626';
let strokes = [];
let currentStroke = null;

function resizePenCanvas() {
  const dpr = window.devicePixelRatio || 1;
  penCanvas.width = window.innerWidth * dpr;
  penCanvas.height = window.innerHeight * dpr;
  penCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redrawAllStrokes();
}
window.addEventListener('resize', resizePenCanvas);

function redrawAllStrokes() {
  penCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  for (const s of strokes) {
    if (s.points.length < 2) continue;
    penCtx.save();
    penCtx.lineCap = 'round';
    penCtx.lineJoin = 'round';
    if (s.mode === 'eraser') {
      penCtx.globalCompositeOperation = 'destination-out';
      penCtx.lineWidth = 24;
    } else if (s.mode === 'highlighter') {
      penCtx.globalAlpha = 0.35;
      penCtx.strokeStyle = s.color;
      penCtx.lineWidth = 18;
    } else {
      penCtx.strokeStyle = s.color;
      penCtx.lineWidth = 3.5;
    }
    penCtx.beginPath();
    penCtx.moveTo(s.points[0].x, s.points[0].y);
    for (let i = 1; i < s.points.length; i++) {
      penCtx.lineTo(s.points[i].x, s.points[i].y);
    }
    penCtx.stroke();
    penCtx.restore();
  }
}

penCanvas.addEventListener('pointerdown', (e) => {
  if (!penActive) return;
  penDrawing = true;
  penCanvas.setPointerCapture(e.pointerId);
  currentStroke = { mode: penMode, color: penColor, points: [{ x: e.clientX, y: e.clientY }] };
  strokes.push(currentStroke);
});

penCanvas.addEventListener('pointermove', (e) => {
  if (!penDrawing || !currentStroke) return;
  currentStroke.points.push({ x: e.clientX, y: e.clientY });
  redrawAllStrokes();
});

penCanvas.addEventListener('pointerup', () => {
  penDrawing = false;
  currentStroke = null;
});

function togglePen() {
  penActive = !penActive;
  penCanvas.classList.toggle('active', penActive);
  document.getElementById('btnTogglePen').classList.toggle('active', penActive);
  document.getElementById('limFloatingBar').classList.toggle('show', penActive);
}
document.getElementById('btnTogglePen').onclick = togglePen;
document.getElementById('btnLimClose').onclick = togglePen;

document.querySelectorAll('.lim-color-dot').forEach(dot => {
  dot.onclick = () => {
    document.querySelectorAll('.lim-color-dot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
    penColor = dot.dataset.color;
    if (penMode === 'eraser') {
      penMode = 'pen';
      document.getElementById('btnLimEraser').classList.remove('active');
    }
  };
});

document.getElementById('btnLimHighlighter').onclick = (e) => {
  penMode = (penMode === 'highlighter') ? 'pen' : 'highlighter';
  e.target.classList.toggle('active', penMode === 'highlighter');
  document.getElementById('btnLimEraser').classList.remove('active');
};
document.getElementById('btnLimEraser').onclick = (e) => {
  penMode = (penMode === 'eraser') ? 'pen' : 'eraser';
  e.target.classList.toggle('active', penMode === 'eraser');
  document.getElementById('btnLimHighlighter').classList.remove('active');
};
document.getElementById('btnLimUndo').onclick = () => {
  strokes.pop();
  redrawAllStrokes();
};
document.getElementById('btnLimClear').onclick = () => {
  strokes = [];
  redrawAllStrokes();
};

// Drag barra flottante penna
const bar = document.getElementById('limFloatingBar');
const handle = document.getElementById('limDragHandle');
let dragOff = null;
handle.addEventListener('pointerdown', (e) => {
  handle.setPointerCapture(e.pointerId);
  const r = bar.getBoundingClientRect();
  dragOff = { x: e.clientX - r.left, y: e.clientY - r.top };
});
handle.addEventListener('pointermove', (e) => {
  if (!dragOff) return;
  bar.style.right = 'auto';
  bar.style.left = `${Math.max(5, Math.min(window.innerWidth - 180, e.clientX - dragOff.x))}px`;
  bar.style.top = `${Math.max(5, Math.min(window.innerHeight - 100, e.clientY - dragOff.y))}px`;
});
handle.addEventListener('pointerup', () => { dragOff = null; });

// Scorciatoie tastiera LIM
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') goToStep(STATE.activeStep + 1);
  if (e.key === 'ArrowLeft') goToStep(STATE.activeStep - 1);
  if (e.key.toLowerCase() === 'p') togglePen();
  if (e.key.toLowerCase() === 'f') document.getElementById('btnFullscreen').click();
  if (e.key === ' ') { e.preventDefault(); document.getElementById('btnPlayPause').click(); }
});

/* ──────────────── AVVIO INIZIALE ──────────────── */
window.addEventListener('DOMContentLoaded', () => {
  renderKaTeX(document.querySelector('.app-header'));
  resizeSimCanvas();
  resizePenCanvas();
  goToStep(1);
  requestAnimationFrame(animLoop);
});
</script>
