<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esercizio Guidato LIM — Somma con Parallelogramma e Coordinate (Es. 20) — ISS Giordano Bruno</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body);"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      color: #0f172a;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.25rem;
    }
    .brand-text h1 { font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
    .brand-text p { font-size: 0.8rem; color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      user-select: none;
    }
    .btn:hover { background: #273549; border-color: var(--accent-blue); }
    .btn-primary { background: #0284c7; border-color: #38bdf8; }
    .btn-primary:hover { background: #0369a1; }
    .btn-amber { background: #b45309; border-color: #fbbf24; }
    .btn-amber:hover { background: #92400e; }

    main {
      flex: 1;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.25rem;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .simulation-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 580px;
    }

    .svg-container {
      width: 100%;
      flex: 1;
      min-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      max-height: 480px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      user-select: none;
    }

    .controls-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .step-pills { display: flex; gap: 0.35rem; }
    .step-pill {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .step-pill.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
      transform: scale(1.1);
    }
    .step-pill.completed {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .details-card {
      overflow-y: auto;
      max-height: 80vh;
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) transparent;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
    }

    .step-title {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    .step-desc {
      font-size: 0.98rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .formula-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent-amber);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      font-size: 1.15rem;
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .data-item {
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .data-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .data-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .tip-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-left: 4px solid var(--accent-green);
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 0.9rem;
      color: #86efac;
      margin-top: auto;
    }

    /* LIM Canvas Overlay */
    #limCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    #limCanvas.active { pointer-events: auto; cursor: crosshair; }

    /* LIM Floating Toolbar */
    .lim-toolbar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 0.4rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: #334155; }
    .tool-btn.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
    }
    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-dot.active { border-color: white; transform: scale(1.15); }

    /* Whiteboard Modal */
    .whiteboard-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .whiteboard-overlay.active { display: flex; }
    .wb-header {
      padding: 0.6rem 1.25rem;
      background: #1e293b;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      white-space: nowrap;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .wb-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }
    .wb-body.bg-grid {
      background-color: #ffffff;
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      background-size: 25px 25px;
    }
    .wb-body.bg-dark {
      background-color: #0f172a;
      background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px);
      background-size: 25px 25px;
    }
    #wbCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">📐</div>
      <div class="brand-text">
        <h1>Problema Svolto 20 — Pag. 109</h1>
        <p>Somma di Vettori sul Piano Cartesiano &amp; Risultante con Pitagora</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-amber" id="btnWhiteboard">
        <span>📄</span> Foglio Bianco LIM
      </button>
      <button class="btn" id="btnFullscreen">
        <span>⛶</span> Schermo Intero
      </button>
      <a href="/fisica/giordano-bruno/" class="btn">
        <span>↩</span> Indice Esercizi
      </a>
    </div>
  </header>

  <main>
    <!-- Card Grafica / Simulazione -->
    <div class="card simulation-card">
      <div class="svg-container" id="svgContainer">
        <canvas id="limCanvas"></canvas>
        <svg id="simSvg" viewBox="-2 -2 18 15">
          <defs>
            <marker id="arrowA" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8" />
            </marker>
            <marker id="arrowB" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#4ade80" />
            </marker>
            <marker id="arrowC" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#f87171" />
            </marker>
            <pattern id="grid" width="1" height="1" patternUnits="userSpaceOnUse">
              <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#334155" stroke-width="0.04" />
            </pattern>
          </defs>

          <!-- Griglia cartesiana quadrettata -->
          <rect x="-1" y="-1" width="17" height="14" fill="url(#grid)" />

          <!-- Assi coordinati graduati -->
          <line x1="-1" y1="0" x2="15.5" y2="0" stroke="#64748b" stroke-width="0.08" />
          <line x1="0" y1="-1" x2="0" y2="12.5" stroke="#64748b" stroke-width="0.08" />
          <text x="15.5" y="-0.3" fill="#94a3b8" font-size="0.6" font-weight="700">x</text>
          <text x="-0.8" y="12.5" fill="#94a3b8" font-size="0.6" font-weight="700">y</text>
          <text x="-0.5" y="-0.4" fill="#94a3b8" font-size="0.6">O</text>

          <!-- Tacche asse x -->
          <text x="2" y="-0.4" fill="#64748b" font-size="0.45" text-anchor="middle">2</text>
          <text x="4" y="-0.4" fill="#64748b" font-size="0.45" text-anchor="middle">4</text>
          <text x="6" y="-0.4" fill="#64748b" font-size="0.45" text-anchor="middle">6</text>
          <text x="8" y="-0.4" fill="#64748b" font-size="0.45" text-anchor="middle">8</text>
          <text x="10" y="-0.4" fill="#64748b" font-size="0.45" text-anchor="middle">10</text>
          <text x="12" y="-0.4" fill="#64748b" font-size="0.45" text-anchor="middle">12</text>
          <text x="14" y="-0.4" fill="#64748b" font-size="0.45" text-anchor="middle">14</text>

          <!-- Tacche asse y -->
          <text x="-0.5" y="2.1" fill="#64748b" font-size="0.45" text-anchor="end">2</text>
          <text x="-0.5" y="4.1" fill="#64748b" font-size="0.45" text-anchor="end">4</text>
          <text x="-0.5" y="6.1" fill="#64748b" font-size="0.45" text-anchor="end">6</text>
          <text x="-0.5" y="8.1" fill="#64748b" font-size="0.45" text-anchor="end">8</text>
          <text x="-0.5" y="9.1" fill="#64748b" font-size="0.45" text-anchor="end">9</text>
          <text x="-0.5" y="10.1" fill="#64748b" font-size="0.45" text-anchor="end">10</text>
          <text x="-0.5" y="12.1" fill="#64748b" font-size="0.45" text-anchor="end">12</text>

          <!-- TRASFORMAZIONE Y: SVG ha y crescente verso il basso, invertiamo la y geometrica -->
          <g transform="scale(1, -1) translate(0, 0)">
            <!-- Triangolo rettangolo OAB ombreggiato (Step 4 & 5) -->
            <polygon id="triOAB" points="0,0 12,0 12,-9" fill="rgba(248, 113, 113, 0.12)" stroke="rgba(248, 113, 113, 0.4)" stroke-width="0.05" opacity="0" />

            <!-- Lati paralleli tratteggiati del parallelogramma (Step 2+) -->
            <line id="parallSide1" x1="4" y1="-9" x2="12" y2="-9" stroke="#94a3b8" stroke-width="0.08" stroke-dasharray="0.3,0.3" opacity="0" />
            <line id="parallSide2" x1="8" y1="0" x2="12" y2="-9" stroke="#94a3b8" stroke-width="0.08" stroke-dasharray="0.3,0.3" opacity="0" />

            <!-- Proiezione B su asse orizzontale (Step 4+) -->
            <line id="projB" x1="12" y1="0" x2="12" y2="-9" stroke="#fbbf24" stroke-width="0.09" stroke-dasharray="0.2,0.2" opacity="0" />

            <!-- Vettore a (blu, orizzontale da 0 a 8) -->
            <line id="vecA" x1="0" y1="0" x2="7.8" y2="0" stroke="#38bdf8" stroke-width="0.2" marker-end="url(#arrowA)" />
            
            <!-- Vettore b (verde, da (0,0) a (4,9)) -->
            <line id="vecB" x1="0" y1="0" x2="3.9" y2="-8.8" stroke="#4ade80" stroke-width="0.2" marker-end="url(#arrowB)" />

            <!-- Vettore c = a + b (rosso, da (0,0) a (12,9)) -->
            <line id="vecC" x1="0" y1="0" x2="11.8" y2="-8.85" stroke="#f87171" stroke-width="0.28" marker-end="url(#arrowC)" opacity="0" />

            <!-- Punti notevoli A(12,9) e B(12,0) -->
            <circle id="ptA" cx="12" cy="-9" r="0.25" fill="#f87171" opacity="0" />
            <circle id="ptB" cx="12" cy="0" r="0.22" fill="#fbbf24" opacity="0" />
          </g>

          <!-- Etichette testuali (coordinate normali) -->
          <text id="lblA" x="4" y="0.8" fill="#38bdf8" font-size="0.65" font-weight="700" text-anchor="middle">a = 8</text>
          <text id="lblB" x="1.5" y="-5" fill="#4ade80" font-size="0.65" font-weight="700">b (4; 9)</text>
          <text id="lblC" x="6.8" y="-5.4" fill="#f87171" font-size="0.75" font-weight="800" opacity="0">c = a + b</text>
          
          <text id="lblPtA" x="12.3" y="-9.3" fill="#f87171" font-size="0.65" font-weight="800" opacity="0">A (12; 9)</text>
          <text id="lblPtB" x="12" y="1.2" fill="#fbbf24" font-size="0.65" font-weight="800" opacity="0" text-anchor="middle">B (12; 0)</text>

          <!-- Quote dimensioni triangolo OAB -->
          <text id="dimBase" x="6" y="1.4" fill="#fbbf24" font-size="0.6" font-weight="700" text-anchor="middle" opacity="0">Cateto OB = 12</text>
          <text id="dimHeight" x="12.4" y="-4.5" fill="#fbbf24" font-size="0.6" font-weight="700" opacity="0">Cateto AB = 9</text>
        </svg>
      </div>

      <!-- Barra di controllo e passaggi -->
      <div class="controls-bar">
        <div class="step-pills">
          <div class="step-pill active" onclick="goToStep(0)">1</div>
          <div class="step-pill" onclick="goToStep(1)">2</div>
          <div class="step-pill" onclick="goToStep(2)">3</div>
          <div class="step-pill" onclick="goToStep(3)">4</div>
          <div class="step-pill" onclick="goToStep(4)">5</div>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn" id="btnPrev" onclick="prevStep()">⏮ Prec</button>
          <button class="btn btn-primary" id="btnNext" onclick="nextStep()">Succ ⏭</button>
          <button class="btn" onclick="resetSteps()">🔄 Riavvia</button>
        </div>
      </div>
    </div>

    <!-- Card Dettagli Didattici -->
    <div class="card details-card">
      <div id="stepInfo">
        <!-- Generato dinamicamente da JS -->
      </div>
    </div>
  </main>

  <!-- LIM Floating Toolbar -->
  <div class="lim-toolbar">
    <button class="tool-btn active" id="btnPen" title="Penna">✏️</button>
    <button class="tool-btn" id="btnEraser" title="Gomma">🧹</button>
    <div class="color-dot active" style="background: #38bdf8;" onclick="setColor('#38bdf8', this)"></div>
    <div class="color-dot" style="background: #4ade80;" onclick="setColor('#4ade80', this)"></div>
    <div class="color-dot" style="background: #fbbf24;" onclick="setColor('#fbbf24', this)"></div>
    <div class="color-dot" style="background: #f87171;" onclick="setColor('#f87171', this)"></div>
    <button class="tool-btn" id="btnClearCanvas" title="Cancella Scritte">🗑️</button>
  </div>

  <!-- Whiteboard Overlay Modal -->
  <div class="whiteboard-overlay" id="whiteboardOverlay">
    <div class="wb-header">
      <div style="font-weight: 700; color: #f8fafc; display:flex; align-items:center; gap:0.5rem;">
        <span>📄</span> Foglio Bianco LIM — Spazio Libero
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <button class="btn" id="wbPenBtn">✏️ Penna</button>
        <button class="btn" id="wbEraserBtn">🧹 Gomma</button>
        <button class="btn" id="wbHandBtn" title="Trascina foglio">🖐️</button>
        <button class="btn" id="wbZoomIn">🔍+</button>
        <button class="btn" id="wbZoomOut">🔍-</button>
        <button class="btn" id="wbZoomReset">100%</button>
        <button class="btn" id="wbGridToggle">Griglia / Sfondo</button>
        <button class="btn" id="wbClear">🗑️ Svuota</button>
        <button class="btn btn-amber" id="wbClose">✕ Chiudi</button>
      </div>
    </div>
    <div class="wb-body bg-grid" id="whiteboardBody">
      <canvas id="wbCanvas"></canvas>
    </div>
  </div>

  <script>
    const stepsData = [
      {
        badge: "Passo 1 di 5 — Lettura degli Assi & Vettori",
        title: "Coordinate Cartesiane dei Vettori di Partenza",
        desc: "Osserva la scala graduata sugli assi coordinati con origine in $O(0,0)$:<br>• Il vettore $\\vec{a}$ (in azzurro) giace interamente lungo l'asse orizzontale $x$ ed ha una lunghezza pari a <strong>8 unità</strong>: $\\vec{a} = (8, 0)$.<br>• Il vettore $\\vec{b}$ (in verde) parte dall'origine e la sua freccia raggiunge il punto di coordinate $x=4$ e $y=9$: $\\vec{b} = (4, 9)$.",
        formula: "\\vec{a} = (8;\\, 0) \\quad \\text{e} \\quad \\vec{b} = (4;\\, 9)",
        data: [
          { label: "Vettore a", val: "a_x = 8, a_y = 0" },
          { label: "Vettore b", val: "b_x = 4, b_y = 9" },
          { label: "Origine comune", val: "O (0; 0)" },
          { label: "Obiettivo", val: "Trovare |c| = |a + b|" }
        ],
        tip: "💡 Il vettore $\\vec{a}$ è puramente orizzontale, quindi la sua componente verticale è nulla ($a_y = 0$). Il vettore $\\vec{b}$ si trova nel primo quadrante."
      },
      {
        badge: "Passo 2 di 5 — Costruzione Geometrica",
        title: "Regola del Parallelogramma & Vertice A",
        desc: "Tracciamo le rette parallele ai due vettori a partire dalle rispettive punte:<br>• Dalla punta di $\\vec{b}(4, 9)$ tracciamo un segmento orizzontale parallelo ad $\\vec{a}$ lungo 8 unità.<br>• Dalla punta di $\\vec{a}(8, 0)$ tracciamo un segmento parallelo a $\\vec{b}$ con spostamento $(+4, +9)$.<br>Le due rette si incontrano esattamente nel punto $A$ di coordinate:<br>$$x_A = 8 + 4 = 12 \\quad \\text{e} \\quad y_A = 0 + 9 = 9 \\implies A(12, 9)$$",
        formula: "A = (x_a + x_b;\\, y_a + y_b) = (8 + 4;\\, 0 + 9) = (12;\\, 9)",
        data: [
          { label: "Ascissa vertice A", val: "x_A = 12" },
          { label: "Ordinata vertice A", val: "y_A = 9" },
          { label: "Figura geometrica", val: "Parallelogramma" },
          { label: "Diagonale", val: "Vettore Somma c" }
        ],
        tip: "💡 Nel metodo del parallelogramma, il vertice opposto all'origine ha coordinate pari alla somma algebrica delle singole componenti dei due vettori!"
      },
      {
        badge: "Passo 3 di 5 — Il Vettore Risultante",
        title: "Tracciamento della Diagonale Risultante c",
        desc: "La diagonale che parte dall'origine $O(0,0)$ e punta verso il vertice opposto $A(12,9)$ rappresenta il vettore somma $\\vec{c} = \\vec{a} + \\vec{b}$ (in rosso).<br><br>Come facciamo ora a calcolare la sua lunghezza esatta in centimetri o unità di quadretto senza misurarla con un righello impreciso? Sfruttiamo la geometria del piano!",
        formula: "\\vec{c} = \\vec{a} + \\vec{b} = (12;\\, 9)",
        data: [
          { label: "Componente c_x", val: "12 unità" },
          { label: "Componente c_y", val: "9 unità" },
          { label: "Direzione", val: "Diagonale 1° Quadrante" },
          { label: "Modulo |c|", val: "Da determinare" }
        ],
        tip: "💡 Qualsiasi segmento obliquo sul piano cartesiano può essere visto come l'ipotenusa di un opportuno triangolo rettangolo."
      },
      {
        badge: "Passo 4 di 5 — Proiezione Ortogonale",
        title: "Costruzione del Triangolo Rettangolo OAB",
        desc: "Dalla punta $A(12, 9)$ del vettore $\\vec{c}$ abbassiamo la proiezione perpendicolare sull'asse orizzontale, individuando il punto $B(12, 0)$:<br>• Il segmento $OB$ è il cateto orizzontale di base e misura esattamente <strong>12 unità</strong>.<br>• Il segmento verticale $AB$ è il cateto di altezza e misura esattamente <strong>9 unità</strong>.<br>• L'angolo $\\widehat{OBA}$ è retto ($90^\\circ$), quindi il triangolo $OAB$ è <strong>rettangolo</strong> in $B$.",
        formula: "\\text{Cateto } OB = 12 \\quad \\text{e} \\quad \\text{Cateto } AB = 9",
        data: [
          { label: "Punto B", val: "(12; 0)" },
          { label: "Cateto orizzontale OB", val: "12 unità" },
          { label: "Cateto verticale AB", val: "9 unità" },
          { label: "Ipotenusa OA", val: "Lunghezza vettore c" }
        ],
        tip: "💡 Con questa proiezione abbiamo 'rettificato' il problema, trasformando un calcolo vettoriale in una semplice applicazione del Teorema di Pitagora!"
      },
      {
        badge: "Passo 5 di 5 — Calcolo del Modulo con Pitagora",
        title: "Applicazione del Teorema di Pitagora: c = 15",
        desc: "Il modulo $c$ corrisponde alla lunghezza dell'ipotenusa $OA$:<br>$$c = OA = \\sqrt{OB^2 + AB^2} = \\sqrt{12^2 + 9^2}$$<br>Eseguiamo i quadrati:<br>$$c = \\sqrt{144 + 81} = \\sqrt{225} = 15\\text{ unità}$$<br><strong>Curiosità geometrica:</strong> Noti nulla di speciale nei numeri $9$, $12$ e $15$? È la famosissima <em>terna pitagorica fondamentale $3-4-5$</em> moltiplicata esattamente per $3$! ($3\\times 3 = 9$, $4\\times 3 = 12$, $5\\times 3 = 15$).",
        formula: "c = \\sqrt{12^2 + 9^2} = \\sqrt{144 + 81} = \\sqrt{225} = 15",
        data: [
          { label: "12^2", val: "144" },
          { label: "9^2", val: "81" },
          { label: "Somma quadrati", val: "225" },
          { label: "Risultato finale", val: "c = 15 unità" }
        ],
        tip: "🎯 Risultato verificato al 100%! Il modulo del vettore risultante $\\vec{c}$ misura esattamente 15 unità della quadrettatura."
      }
    ];

    let currentStep = 0;

    function updateSimulation(step) {
      const parallSide1 = document.getElementById('parallSide1');
      const parallSide2 = document.getElementById('parallSide2');
      const vecC = document.getElementById('vecC');
      const lblC = document.getElementById('lblC');
      const ptA = document.getElementById('ptA');
      const lblPtA = document.getElementById('lblPtA');
      const projB = document.getElementById('projB');
      const ptB = document.getElementById('ptB');
      const lblPtB = document.getElementById('lblPtB');
      const triOAB = document.getElementById('triOAB');
      const dimBase = document.getElementById('dimBase');
      const dimHeight = document.getElementById('dimHeight');

      // Reset visibilità
      parallSide1.setAttribute('opacity', '0');
      parallSide2.setAttribute('opacity', '0');
      vecC.setAttribute('opacity', '0');
      lblC.setAttribute('opacity', '0');
      ptA.setAttribute('opacity', '0');
      lblPtA.setAttribute('opacity', '0');
      projB.setAttribute('opacity', '0');
      ptB.setAttribute('opacity', '0');
      lblPtB.setAttribute('opacity', '0');
      triOAB.setAttribute('opacity', '0');
      dimBase.setAttribute('opacity', '0');
      dimHeight.setAttribute('opacity', '0');

      if (step >= 1) {
        parallSide1.setAttribute('opacity', '1');
        parallSide2.setAttribute('opacity', '1');
        ptA.setAttribute('opacity', '1');
        lblPtA.setAttribute('opacity', '1');
      }
      if (step >= 2) {
        vecC.setAttribute('opacity', '1');
        lblC.setAttribute('opacity', '1');
      }
      if (step >= 3) {
        projB.setAttribute('opacity', '1');
        ptB.setAttribute('opacity', '1');
        lblPtB.setAttribute('opacity', '1');
        triOAB.setAttribute('opacity', '1');
        dimBase.setAttribute('opacity', '1');
        dimHeight.setAttribute('opacity', '1');
      }
      if (step >= 4) {
        // Step 5: tutto visibile e illuminato
        triOAB.setAttribute('fill', 'rgba(248, 113, 113, 0.22)');
      } else {
        triOAB.setAttribute('fill', 'rgba(248, 113, 113, 0.12)');
      }
    }

    function renderStep() {
      const data = stepsData[currentStep];
      const container = document.getElementById('stepInfo');

      let dataHtml = '';
      data.data.forEach(d => {
        dataHtml += `
          <div class="data-item">
            <div class="data-label">${d.label}</div>
            <div class="data-val">${d.val}</div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="step-badge">${data.badge}</div>
        <h2 class="step-title">${data.title}</h2>
        <div class="step-desc">${data.desc}</div>
        <div class="formula-box">$$${data.formula}$$</div>
        <div class="data-grid">${dataHtml}</div>
        <div class="tip-box">${data.tip}</div>
      `;

      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ]
        });
      }

      // Aggiorna pills
      const pills = document.querySelectorAll('.step-pill');
      pills.forEach((p, idx) => {
        p.classList.remove('active', 'completed');
        if (idx === currentStep) p.classList.add('active');
        else if (idx < currentStep) p.classList.add('completed');
      });

      // Aggiorna pulsanti
      document.getElementById('btnPrev').disabled = (currentStep === 0);
      document.getElementById('btnNext').disabled = (currentStep === stepsData.length - 1);

      updateSimulation(currentStep);
    }

    function goToStep(s) {
      currentStep = s;
      renderStep();
    }

    function nextStep() {
      if (currentStep < stepsData.length - 1) {
        currentStep++;
        renderStep();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    }

    function resetSteps() {
      currentStep = 0;
      renderStep();
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextStep();
      else if (e.key === 'ArrowLeft') prevStep();
    });

    // LIM Drawing logic
    const canvas = document.getElementById('limCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let currentColor = '#38bdf8';
    let currentMode = 'pen'; // 'pen' or 'eraser'

    function resizeCanvas() {
      const container = document.getElementById('svgContainer');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    const btnPen = document.getElementById('btnPen');
    const btnEraser = document.getElementById('btnEraser');
    const btnClearCanvas = document.getElementById('btnClearCanvas');

    btnPen.addEventListener('click', () => {
      currentMode = 'pen';
      canvas.classList.add('active');
      btnPen.classList.add('active');
      btnEraser.classList.remove('active');
    });

    btnEraser.addEventListener('click', () => {
      currentMode = 'eraser';
      canvas.classList.add('active');
      btnEraser.classList.add('active');
      btnPen.classList.remove('active');
    });

    btnClearCanvas.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    function setColor(col, el) {
      currentColor = col;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
      if (currentMode === 'eraser') {
        currentMode = 'pen';
        btnPen.classList.add('active');
        btnEraser.classList.remove('active');
      }
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
      if (!canvas.classList.contains('active')) return;
      isDrawing = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const p = getPos(e);
      if (currentMode === 'pen') {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      } else {
        ctx.clearRect(p.x - 15, p.y - 15, 30, 30);
      }
    }

    function endDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: true });
    canvas.addEventListener('touchmove', draw, { passive: true });
    canvas.addEventListener('touchend', endDraw);

    // Fullscreen
    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Whiteboard logic
    const wbOverlay = document.getElementById('whiteboardOverlay');
    const wbCanvas = document.getElementById('wbCanvas');
    const wbCtx = wbCanvas.getContext('2d');
    const wbBody = document.getElementById('whiteboardBody');
    let wbDrawing = false;
    let wbMode = 'pen';
    let wbZoom = 1;
    let panX = 0, panY = 0;
    let isPanning = false, startX = 0, startY = 0;

    function resizeWbCanvas() {
      wbCanvas.width = wbBody.clientWidth;
      wbCanvas.height = wbBody.clientHeight;
    }

    document.getElementById('btnWhiteboard').addEventListener('click', () => {
      wbOverlay.classList.add('active');
      resizeWbCanvas();
    });
    document.getElementById('wbClose').addEventListener('click', () => {
      wbOverlay.classList.remove('active');
    });

    document.getElementById('wbPenBtn').addEventListener('click', () => {
      wbMode = 'pen';
      wbBody.style.cursor = 'crosshair';
    });
    document.getElementById('wbEraserBtn').addEventListener('click', () => {
      wbMode = 'eraser';
      wbBody.style.cursor = 'cell';
    });
    const wbHandBtn = document.getElementById('wbHandBtn');
    wbHandBtn.addEventListener('click', () => {
      wbMode = 'pan';
      wbBody.style.cursor = 'grab';
    });

    document.getElementById('wbZoomIn').addEventListener('click', () => {
      wbZoom = Math.min(wbZoom + 0.2, 3);
      applyWbTransform();
    });
    document.getElementById('wbZoomOut').addEventListener('click', () => {
      wbZoom = Math.max(wbZoom - 0.2, 0.5);
      applyWbTransform();
    });
    document.getElementById('wbZoomReset').addEventListener('click', () => {
      wbZoom = 1;
      panX = 0;
      panY = 0;
      applyWbTransform();
    });

    function applyWbTransform() {
      wbCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${wbZoom})`;
      wbBody.style.backgroundPosition = `${panX}px ${panY}px`;
    }

    document.getElementById('wbGridToggle').addEventListener('click', () => {
      if (wbBody.classList.contains('bg-grid')) {
        wbBody.classList.remove('bg-grid');
        wbBody.classList.add('bg-dark');
      } else {
        wbBody.classList.remove('bg-dark');
        wbBody.classList.add('bg-grid');
      }
    });

    document.getElementById('wbClear').addEventListener('click', () => {
      wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height);
    });

    wbCanvas.addEventListener('mousedown', (e) => {
      if (wbMode === 'pan') {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        wbBody.style.cursor = 'grabbing';
      } else {
        wbDrawing = true;
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        wbCtx.beginPath();
        wbCtx.moveTo(x, y);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyWbTransform();
      } else if (wbDrawing) {
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        if (wbMode === 'pen') {
          wbCtx.strokeStyle = '#0284c7';
          wbCtx.lineWidth = 3;
          wbCtx.lineCap = 'round';
          wbCtx.lineTo(x, y);
          wbCtx.stroke();
        } else if (wbMode === 'eraser') {
          wbCtx.clearRect(x - 20, y - 20, 40, 40);
        }
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      wbDrawing = false;
      if (wbMode === 'pan') wbBody.style.cursor = 'grab';
    });

    // Avvio iniziale
    renderStep();
  </script>
</body>
</html>
