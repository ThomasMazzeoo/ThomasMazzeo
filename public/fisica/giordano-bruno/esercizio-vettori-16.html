<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esercizio Guidato LIM — Scomposizione Trigonometrica (Es. 28) — ISS Giordano Bruno</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body);"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #0f172a;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.25rem;
    }
    .brand-text h1 { font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
    .brand-text p { font-size: 0.8rem; color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      user-select: none;
    }
    .btn:hover { background: #273549; border-color: var(--accent-blue); }
    .btn-primary { background: #0284c7; border-color: #38bdf8; }
    .btn-primary:hover { background: #0369a1; }
    .btn-amber { background: #b45309; border-color: #fbbf24; }
    .btn-amber:hover { background: #92400e; }

    main {
      flex: 1;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.25rem;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .simulation-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 580px;
    }

    .svg-container {
      width: 100%;
      flex: 1;
      min-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      max-height: 480px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      user-select: none;
    }

    .controls-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .step-pills { display: flex; gap: 0.35rem; }
    .step-pill {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .step-pill.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
      transform: scale(1.1);
    }
    .step-pill.completed {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .details-card {
      overflow-y: auto;
      max-height: 80vh;
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) transparent;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
    }

    .step-title {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    .step-desc {
      font-size: 0.98rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .formula-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent-amber);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      font-size: 1.15rem;
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .data-item {
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .data-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .data-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .tip-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-left: 4px solid var(--accent-green);
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 0.9rem;
      color: #86efac;
      margin-top: auto;
    }

    /* LIM Canvas Overlay */
    #limCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 90;
      pointer-events: none;
    }
    #limCanvas.active { pointer-events: auto; cursor: crosshair; }

    /* LIM Floating Toolbar */
    .lim-toolbar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 0.4rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: #334155; }
    .tool-btn.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
    }
    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-dot.active { border-color: white; transform: scale(1.15); }

    /* Whiteboard Modal */
    .whiteboard-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .whiteboard-overlay.active { display: flex; }
    .wb-header {
      padding: 0.6rem 1.25rem;
      background: #1e293b;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      white-space: nowrap;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .wb-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }
    .wb-body.bg-grid {
      background-color: #ffffff;
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      background-size: 25px 25px;
    }
    .wb-body.bg-dark {
      background-color: #0f172a;
      background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px);
      background-size: 25px 25px;
    }
    #wbCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">📈</div>
      <div class="brand-text">
        <h1>Problema Guidato 28 — Pag. 110</h1>
        <p>Scomposizione Trigonometrica di un Vettore ($u_x = u\coslpha$, $u_y = u\sinlpha$)</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-amber" id="btnWhiteboard">
        <span>📄</span> Foglio Bianco LIM
      </button>
      <button class="btn" id="btnFullscreen">
        <span>⛶</span> Schermo Intero
      </button>
      <a href="/fisica/giordano-bruno/" class="btn">
        <span>↩</span> Indice Esercizi
      </a>
    </div>
  </header>

  <main>
    <!-- Card Grafica / Simulazione -->
    <div class="card simulation-card">
      <div class="svg-container" id="svgContainer">
        <canvas id="limCanvas"></canvas>
        <svg id="simSvg" viewBox="-1.5 -1 9.5 8">
          <defs>
            <marker id="arrowU" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#f87171" />
            </marker>
            <marker id="arrowUx" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8" />
            </marker>
            <marker id="arrowUy" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#4ade80" />
            </marker>
            <pattern id="grid" width="1" height="1" patternUnits="userSpaceOnUse">
              <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#334155" stroke-width="0.04" />
            </pattern>
          </defs>

          <!-- Griglia quadrettata dello sfondo -->
          <rect x="-1" y="-0.5" width="9" height="7.5" fill="url(#grid)" />

          <!-- Assi cartesiani -->
          <line x1="-0.8" y1="6" x2="7.5" y2="6" stroke="#64748b" stroke-width="0.08" />
          <line x1="0.5" y1="6.5" x2="0.5" y2="0" stroke="#64748b" stroke-width="0.08" />
          <text x="7.6" y="6.15" fill="#94a3b8" font-size="0.45" font-weight="700">x</text>
          <text x="0.3" y="-0.1" fill="#94a3b8" font-size="0.45" font-weight="700">y</text>
          <text x="0.1" y="6.4" fill="#94a3b8" font-size="0.45">O</text>

          <!-- Tacche asse x -->
          <text x="3.6" y="6.45" fill="#38bdf8" font-size="0.4" font-weight="700" text-anchor="middle" id="tickUx" opacity="0">3,1</text>
          
          <!-- Tacche asse y -->
          <text x="0.1" y="0.65" fill="#4ade80" font-size="0.4" font-weight="700" text-anchor="end" id="tickUy" opacity="0">5,4</text>

          <!-- Gruppo geometrico: Origine O posizionata a (0.5, 6) -->
          <g transform="translate(0.5, 6)">
            <!-- Triangolo rettangolo proiezioni (Step 2+) -->
            <polygon id="triProj" points="0,0 3.1,0 3.1,-5.37" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(148, 163, 184, 0.3)" stroke-width="0.04" opacity="0" />

            <!-- Triangolo equilatero gemello tratteggiato specchiato in basso (Step 5) -->
            <polygon id="triMirror" points="0,0 3.1,0 3.1,5.37" fill="none" stroke="rgba(251, 191, 36, 0.35)" stroke-width="0.04" stroke-dasharray="0.15,0.15" opacity="0" />
            <line id="lineMirror" x1="0" y1="0" x2="3.1" y2="5.37" stroke="rgba(251, 191, 36, 0.5)" stroke-width="0.05" stroke-dasharray="0.15,0.15" opacity="0" />

            <!-- Linee di proiezione tratteggiate -->
            <line id="projVert" x1="3.1" y1="0" x2="3.1" y2="-5.37" stroke="#fbbf24" stroke-width="0.07" stroke-dasharray="0.15,0.15" opacity="0" />
            <line id="projHoriz" x1="0" y1="-5.37" x2="3.1" y2="-5.37" stroke="#fbbf24" stroke-width="0.07" stroke-dasharray="0.15,0.15" opacity="0" />

            <!-- Arco angolo alfa = 60° -->
            <!-- Raggio r = 1.2. Inizio su asse x: (1.2, 0). Fine a 60°: x = 1.2*cos(60)=0.6, y = -1.2*sin(60)=-1.04 -->
            <path id="arcAngle" d="M 1.2 0 A 1.2 1.2 0 0 0 0.6 -1.04" fill="rgba(251, 191, 36, 0.25)" stroke="#fbbf24" stroke-width="0.06" />

            <!-- Componente orizzontale u_x (in ciano, Step 3+) -->
            <line id="vecUx" x1="0" y1="0" x2="3.0" y2="0" stroke="#38bdf8" stroke-width="0.18" marker-end="url(#arrowUx)" opacity="0" />

            <!-- Componente verticale u_y (in verde, Step 4+) -->
            <line id="vecUy" x1="0" y1="0" x2="0" y2="-5.25" stroke="#4ade80" stroke-width="0.18" marker-end="url(#arrowUy)" opacity="0" />

            <!-- Vettore u (rosso, ipotenusa: lunghezza 6.2 con angolo 60° -> x = 3.1, y = -5.37) -->
            <line id="vecU" x1="0" y1="0" x2="3.05" y2="-5.28" stroke="#f87171" stroke-width="0.22" marker-end="url(#arrowU)" />

            <!-- Vertice punta P(3.1, 5.37) -->
            <circle id="ptP" cx="3.1" cy="-5.37" r="0.15" fill="#f87171" />
          </g>

          <!-- Testi e quotature -->
          <text id="lblAngle" x="1.9" y="5.4" fill="#fbbf24" font-size="0.42" font-weight="700">60°</text>
          <text id="lblU" x="1.5" y="3.1" fill="#f87171" font-size="0.55" font-weight="800">u = 6,2</text>
          
          <text id="lblUx" x="2.0" y="6.6" fill="#38bdf8" font-size="0.48" font-weight="700" text-anchor="middle" opacity="0">u_x = 3,1</text>
          <text id="lblUy" x="-0.3" y="3.3" fill="#4ade80" font-size="0.48" font-weight="700" opacity="0">u_y = 5,4</text>
          
          <text id="lblP" x="3.8" y="0.4" fill="#f87171" font-size="0.45" font-weight="700" opacity="0">P (3,1; 5,4)</text>
          <text id="lblEquilateral" x="4.5" y="6.8" fill="#fbbf24" font-size="0.4" font-weight="700" opacity="0">Metà Triangolo Equilatero!</text>
        </svg>
      </div>

      <!-- Barra di controllo -->
      <div class="controls-bar">
        <div class="step-pills">
          <div class="step-pill active" onclick="goToStep(0)">1</div>
          <div class="step-pill" onclick="goToStep(1)">2</div>
          <div class="step-pill" onclick="goToStep(2)">3</div>
          <div class="step-pill" onclick="goToStep(3)">4</div>
          <div class="step-pill" onclick="goToStep(4)">5</div>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn" id="btnPrev" onclick="prevStep()">⏮ Prec</button>
          <button class="btn btn-primary" id="btnNext" onclick="nextStep()">Succ ⏭</button>
          <button class="btn" onclick="resetSteps()">🔄 Riavvia</button>
        </div>
      </div>
    </div>

    <!-- Card Dettagli Didattici -->
    <div class="card details-card">
      <div id="stepInfo">
        <!-- Generato dinamicamente da JS -->
      </div>
    </div>
  </main>

  <!-- LIM Floating Toolbar -->
  <div class="lim-toolbar">
    <button class="tool-btn" id="btnPen" title="Attiva/Disattiva Penna LIM">✏️</button>
    <button class="tool-btn" id="btnEraser" title="Gomma">🧹</button>
    <div class="color-dot active" style="background: #38bdf8;" onclick="setColor('#38bdf8', this)"></div>
    <div class="color-dot" style="background: #4ade80;" onclick="setColor('#4ade80', this)"></div>
    <div class="color-dot" style="background: #fbbf24;" onclick="setColor('#fbbf24', this)"></div>
    <div class="color-dot" style="background: #f87171;" onclick="setColor('#f87171', this)"></div>
    <button class="tool-btn" id="btnClearCanvas" title="Cancella Scritte">🗑️</button>
  </div>

  <!-- Whiteboard Overlay Modal -->
  <div class="whiteboard-overlay" id="whiteboardOverlay">
    <div class="wb-header">
      <div style="font-weight: 700; color: #f8fafc; display:flex; align-items:center; gap:0.5rem;">
        <span>📄</span> Foglio Bianco LIM — Spazio Libero
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <button class="btn" id="wbPenBtn">✏️ Penna</button>
        <button class="btn" id="wbEraserBtn">🧹 Gomma</button>
        <button class="btn" id="wbHandBtn" title="Trascina foglio">🖐️</button>
        <button class="btn" id="wbZoomIn">🔍+</button>
        <button class="btn" id="wbZoomOut">🔍-</button>
        <button class="btn" id="wbZoomReset">100%</button>
        <button class="btn" id="wbGridToggle">Griglia / Sfondo</button>
        <button class="btn" id="wbClear">🗑️ Svuota</button>
        <button class="btn btn-amber" id="wbClose">✕ Chiudi</button>
      </div>
    </div>
    <div class="wb-body bg-grid" id="whiteboardBody">
      <canvas id="wbCanvas"></canvas>
    </div>
  </div>

  <script>
    const stepsData = [
      {
        badge: "Passo 1 di 5 — Il Vettore Inclinato",
        title: "Modulo e Angolo con l'Asse Orizzontale",
        desc: "Il testo del problema ci fornisce due grandezze fondamentali:<br>• Il modulo del vettore: <strong>$u = 6{,}2$</strong> (l'ipotenusa del nostro triangolo).<br>• L'inclinazione: forma un angolo $\\alpha = 60^\\circ$ rispetto alla direzione orizzontale dell'asse $x$.<br><br>Il nostro obiettivo è 'smontare' questo vettore nelle sue due ombre proiettate: quanto spinge in avanti ($u_x$) e quanto spinge verso l'alto ($u_y$)?",
        formula: "u = 6{,}2 \\quad \\text{con} \\quad \\alpha = 60^\\circ",
        data: [
          { label: "Modulo ipotenusa u", val: "6,2" },
          { label: "Angolo con asse x", val: "α = 60°" },
          { label: "Angolo con asse y", val: "90° - 60° = 30°" },
          { label: "Tipo di problema", val: "Scomposizione Cartesiana" }
        ],
        tip: "💡 In fisica, qualsiasi vettore obliquo può essere trattato come la combinazione di due movimenti indipendenti e ortogonali tra loro."
      },
      {
        badge: "Passo 2 di 5 — Proiezioni Ortogonali",
        title: "Il Triangolo Rettangolo di Scomposizione",
        desc: "Dalla punta del vettore $\\vec{u}$ tracciamo due linee tratteggiate perpendicolari agli assi:<br>• La linea verticale cade sull'asse $x$, individuando la componente orizzontale $u_x$ come <strong>cateto adiacente</strong> all'angolo di $60^\\circ$.<br>• La linea orizzontale incontra l'asse $y$, individuando la componente verticale $u_y$ come <strong>cateto opposto</strong> all'angolo di $60^\\circ$.<br><br>Si forma un triangolo rettangolo con ipotenusa $u = 6{,}2$.",
        formula: "\\text{Cateto adiacente } = u_x \\quad \\text{e} \\quad \\text{Cateto opposto } = u_y",
        data: [
          { label: "Ipotenusa", val: "u = 6,2" },
          { label: "Cateto adiacente", val: "u_x (lungo asse x)" },
          { label: "Cateto opposto", val: "u_y (lungo asse y)" },
          { label: "Angolo retto", val: "90° alla base" }
        ],
        tip: "💡 Ricorda la regola mnemonica fondamentale: il <strong>COSenO</strong> va con l'angolo <strong>CONGIUNTO</strong> (adiacente al cateto), il <strong>SENO</strong> va con il cateto opposto o <strong>SOLLEVATO</strong>!"
      },
      {
        badge: "Passo 3 di 5 — Calcolo Componente Orizzontale",
        title: "Formula del Coseno: u_x = u · cos(60°)",

    let currentStep = 0;

    function updateSimulation(step) {
      const projVert = document.getElementById('projVert');
      const projHoriz = document.getElementById('projHoriz');
      const triProj = document.getElementById('triProj');
      const vecUx = document.getElementById('vecUx');
      const vecUy = document.getElementById('vecUy');
      const lblUx = document.getElementById('lblUx');
      const lblUy = document.getElementById('lblUy');
      const tickUx = document.getElementById('tickUx');
      const tickUy = document.getElementById('tickUy');
      const lblP = document.getElementById('lblP');
      const triMirror = document.getElementById('triMirror');
      const lineMirror = document.getElementById('lineMirror');
      const lblEquilateral = document.getElementById('lblEquilateral');

      // Reset
      projVert.setAttribute('opacity', '0');
      projHoriz.setAttribute('opacity', '0');
      triProj.setAttribute('opacity', '0');
      vecUx.setAttribute('opacity', '0');
      vecUy.setAttribute('opacity', '0');
      lblUx.setAttribute('opacity', '0');
      lblUy.setAttribute('opacity', '0');
      tickUx.setAttribute('opacity', '0');
      tickUy.setAttribute('opacity', '0');
      lblP.setAttribute('opacity', '0');
      triMirror.setAttribute('opacity', '0');
      lineMirror.setAttribute('opacity', '0');
      lblEquilateral.setAttribute('opacity', '0');

      if (step >= 1) {
        projVert.setAttribute('opacity', '1');
        projHoriz.setAttribute('opacity', '1');
        triProj.setAttribute('opacity', '1');
        lblP.setAttribute('opacity', '1');
      }
      if (step >= 2) {
        vecUx.setAttribute('opacity', '1');
        lblUx.setAttribute('opacity', '1');
        tickUx.setAttribute('opacity', '1');
      }
      if (step >= 3) {
        vecUy.setAttribute('opacity', '1');
        lblUy.setAttribute('opacity', '1');
        tickUy.setAttribute('opacity', '1');
      }
      if (step >= 4) {
        triMirror.setAttribute('opacity', '1');
        lineMirror.setAttribute('opacity', '1');
        lblEquilateral.setAttribute('opacity', '1');
      }
    }

    function renderStep() {
      const data = stepsData[currentStep];
      const container = document.getElementById('stepInfo');

      let dataHtml = '';
      data.data.forEach(d => {
        dataHtml += `
          <div class="data-item">
            <div class="data-label">${d.label}</div>
            <div class="data-val">${d.val}</div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="step-badge">${data.badge}</div>
        <h2 class="step-title">${data.title}</h2>
        <div class="step-desc">${data.desc}</div>
        <div class="formula-box">$$${data.formula}$$</div>
        <div class="data-grid">${dataHtml}</div>
        <div class="tip-box">${data.tip}</div>
      `;

      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ]
        });
      }

      // Aggiorna pills
      const pills = document.querySelectorAll('.step-pill');
      pills.forEach((p, idx) => {
        p.classList.remove('active', 'completed');
        if (idx === currentStep) p.classList.add('active');
        else if (idx < currentStep) p.classList.add('completed');
      });

      // Aggiorna pulsanti
      document.getElementById('btnPrev').disabled = (currentStep === 0);
      document.getElementById('btnNext').disabled = (currentStep === stepsData.length - 1);

      updateSimulation(currentStep);
    }

    function goToStep(s) {
      currentStep = s;
      renderStep();
    }

    function nextStep() {
      if (currentStep < stepsData.length - 1) {
        currentStep++;
        renderStep();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    }

    function resetSteps() {
      currentStep = 0;
      renderStep();
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextStep();
      else if (e.key === 'ArrowLeft') prevStep();
    });

    // LIM Drawing logic
    const canvas = document.getElementById('limCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let currentColor = '#38bdf8';
    let currentMode = 'pen';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    const btnPen = document.getElementById('btnPen');
    const btnEraser = document.getElementById('btnEraser');
    const btnClearCanvas = document.getElementById('btnClearCanvas');

    btnPen.addEventListener('click', () => {
      if (canvas.classList.contains('active') && currentMode === 'pen') {
        canvas.classList.remove('active');
        btnPen.classList.remove('active');
      } else {
        currentMode = 'pen';
        canvas.classList.add('active');
        btnPen.classList.add('active');
        btnEraser.classList.remove('active');
      }
    });

    btnEraser.addEventListener('click', () => {
      if (canvas.classList.contains('active') && currentMode === 'eraser') {
        canvas.classList.remove('active');
        btnEraser.classList.remove('active');
      } else {
        currentMode = 'eraser';
        canvas.classList.add('active');
        btnEraser.classList.add('active');
        btnPen.classList.remove('active');
      }
    });

    btnClearCanvas.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    function setColor(col, el) {
      currentColor = col;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
      currentMode = 'pen';
      canvas.classList.add('active');
      btnPen.classList.add('active');
      btnEraser.classList.remove('active');
    }

    function getPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX, y: clientY };
    }

    function startDraw(e) {
      if (!canvas.classList.contains('active')) return;
      isDrawing = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const p = getPos(e);
      if (currentMode === 'pen') {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      } else {
        ctx.clearRect(p.x - 15, p.y - 15, 30, 30);
      }
    }

    function endDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: true });
    canvas.addEventListener('touchmove', draw, { passive: true });
    canvas.addEventListener('touchend', endDraw);

    // Fullscreen
    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Whiteboard logic
    const wbOverlay = document.getElementById('whiteboardOverlay');
    const wbCanvas = document.getElementById('wbCanvas');
    const wbCtx = wbCanvas.getContext('2d');
    const wbBody = document.getElementById('whiteboardBody');
    let wbDrawing = false;
    let wbMode = 'pen';
    let wbZoom = 1;
    let panX = 0, panY = 0;
    let isPanning = false, startX = 0, startY = 0;

    function resizeWbCanvas() {
      wbCanvas.width = wbBody.clientWidth;
      wbCanvas.height = wbBody.clientHeight;
    }

    document.getElementById('btnWhiteboard').addEventListener('click', () => {
      wbOverlay.classList.add('active');
      resizeWbCanvas();
    });
    document.getElementById('wbClose').addEventListener('click', () => {
      wbOverlay.classList.remove('active');
    });

    document.getElementById('wbPenBtn').addEventListener('click', () => {
      wbMode = 'pen';
      wbBody.style.cursor = 'crosshair';
    });
    document.getElementById('wbEraserBtn').addEventListener('click', () => {
      wbMode = 'eraser';
      wbBody.style.cursor = 'cell';
    });
    const wbHandBtn = document.getElementById('wbHandBtn');
    wbHandBtn.addEventListener('click', () => {
      wbMode = 'pan';
      wbBody.style.cursor = 'grab';
    });

    document.getElementById('wbZoomIn').addEventListener('click', () => {
      wbZoom = Math.min(wbZoom + 0.2, 3);
      applyWbTransform();
    });
    document.getElementById('wbZoomOut').addEventListener('click', () => {
      wbZoom = Math.max(wbZoom - 0.2, 0.5);
      applyWbTransform();
    });
    document.getElementById('wbZoomReset').addEventListener('click', () => {
      wbZoom = 1;
      panX = 0;
      panY = 0;
      applyWbTransform();
    });

    function applyWbTransform() {
      wbCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${wbZoom})`;
      wbBody.style.backgroundPosition = `${panX}px ${panY}px`;
    }

    document.getElementById('wbGridToggle').addEventListener('click', () => {
      if (wbBody.classList.contains('bg-grid')) {
        wbBody.classList.remove('bg-grid');
        wbBody.classList.add('bg-dark');
      } else {
        wbBody.classList.remove('bg-dark');
        wbBody.classList.add('bg-grid');
      }
    });

    document.getElementById('wbClear').addEventListener('click', () => {
      wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height);
    });

    wbCanvas.addEventListener('mousedown', (e) => {
      if (wbMode === 'pan') {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        wbBody.style.cursor = 'grabbing';
      } else {
        wbDrawing = true;
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        wbCtx.beginPath();
        wbCtx.moveTo(x, y);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyWbTransform();
      } else if (wbDrawing) {
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        if (wbMode === 'pen') {
          wbCtx.strokeStyle = '#0284c7';
          wbCtx.lineWidth = 3;
          wbCtx.lineCap = 'round';
          wbCtx.lineTo(x, y);
          wbCtx.stroke();
        } else if (wbMode === 'eraser') {
          wbCtx.clearRect(x - 20, y - 20, 40, 40);
        }
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      wbDrawing = false;
      if (wbMode === 'pan') wbBody.style.cursor = 'grab';
    });

    // Avvio iniziale
    renderStep();
  </script>
</body>
</html>
