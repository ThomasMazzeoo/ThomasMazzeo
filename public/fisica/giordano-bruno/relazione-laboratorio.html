<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Relazione di Laboratorio — ISS Giordano Bruno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
/* ═══════════════════════════════════════════
   DESIGN SYSTEM: ESSENZIALE, PULITO, RETRO NEON
   ═══════════════════════════════════════════ */
:root {
  --bg: #070b14;
  --card-bg: #0d1527;
  --card-inner: #070c18;
  --green: #39ff14;
  --green-rgb: 57, 255, 20;
  --cyan: #00f5ff;
  --yellow: #ffee00;
  --red: #ff3366;
  --red-rgb: 255, 51, 102;
  --white: #f0f4fc;
  --text-dim: #8b9bb4;
  --border: rgba(57, 255, 20, 0.22);
  --border-cyan: rgba(0, 245, 255, 0.22);
  --glow-green: 0 0 16px rgba(57, 255, 20, 0.35);
  --glow-cyan: 0 0 16px rgba(0, 245, 255, 0.35);
  --font-pixel: 'Press Start 2P', monospace;
  --font-title: 'Orbitron', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg);
  color: var(--white);
  font-family: var(--font-body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-image:
    linear-gradient(rgba(57, 255, 20, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(57, 255, 20, 0.025) 1px, transparent 1px);
  background-size: 32px 32px;
  position: relative;
  overflow-x: hidden;
}

/* Scanline leggera */
body::after {
  content: "";
  display: block;
  position: fixed;
  inset: 0;
  background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.18) 50%);
  background-size: 100% 4px;
  z-index: 999;
  pointer-events: none;
  opacity: 0.25;
}

/* ═══════════════════════════════════════════
   TOP NAVIGATION BAR (MINIMALE E PULITA)
   ═══════════════════════════════════════════ */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.85rem 1.75rem;
  background: #040812;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--green);
  text-decoration: none;
  font-family: var(--font-pixel);
  font-size: 0.65rem;
  letter-spacing: 1px;
  padding: 0.35rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: rgba(57, 255, 20, 0.06);
  transition: all 0.2s ease;
}
.back-link:hover {
  background: rgba(57, 255, 20, 0.18);
  box-shadow: var(--glow-green);
  transform: translateX(-2px);
}

.school-tag {
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: var(--cyan);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.step-indicator {
  font-family: var(--font-pixel);
  font-size: 0.65rem;
  color: var(--yellow);
  background: rgba(255, 238, 0, 0.1);
  border: 1px solid rgba(255, 238, 0, 0.3);
  padding: 0.35rem 0.85rem;
  border-radius: 4px;
}

/* ═══════════════════════════════════════════
   MAIN STAGE (AREA CENTRALE A FOCUS SINGOLO)
   ═══════════════════════════════════════════ */
.main-stage {
  flex: 1;
  max-width: 1040px;
  width: 95%;
  margin: 1.5rem auto 2.5rem;
  display: flex;
  flex-direction: column;
}

/* Header del singolo passo */
.step-header {
  text-align: center;
  margin-bottom: 1.5rem;
}

.step-subtitle-badge {
  display: inline-block;
  font-family: var(--font-pixel);
  font-size: 0.58rem;
  color: var(--cyan);
  background: rgba(0, 245, 255, 0.08);
  border: 1px solid var(--border-cyan);
  padding: 0.25rem 0.6rem;
  border-radius: 3px;
  margin-bottom: 0.45rem;
  letter-spacing: 1.5px;
}

.step-title {
  font-family: var(--font-title);
  font-size: 1.6rem;
  color: var(--green);
  text-shadow: var(--glow-green);
  letter-spacing: 1.5px;
  margin-bottom: 0.35rem;
}

.step-rule {
  color: var(--text-dim);
  font-size: 0.95rem;
  max-width: 720px;
  margin: 0 auto;
  line-height: 1.5;
}

/* Card Contenuto Principale */
.focus-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.85rem;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  animation: cardFade 0.25s ease;
  min-height: 440px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

@keyframes cardFade {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════════
   LAYOUT A CONFRONTO AFFIANCATO (SIDE-BY-SIDE)
   ═══════════════════════════════════════════ */
.compare-frame {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
  margin-bottom: 1.2rem;
}

@media (max-width: 768px) {
  .compare-frame {
    grid-template-columns: 1fr;
  }
}

/* Colonna Sbagliata (Rosso) */
.col-bad {
  background: rgba(255, 51, 102, 0.04);
  border: 1.5px solid rgba(255, 51, 102, 0.35);
  border-radius: 8px;
  padding: 1.25rem 1.4rem;
  display: flex;
  flex-direction: column;
  position: relative;
}

.col-bad-header {
  font-family: var(--font-pixel);
  font-size: 0.65rem;
  color: var(--red);
  letter-spacing: 1px;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  border-bottom: 1px solid rgba(255, 51, 102, 0.2);
  padding-bottom: 0.5rem;
}

/* Colonna Corretta (Verde) */
.col-good {
  background: rgba(57, 255, 20, 0.04);
  border: 1.5px solid rgba(57, 255, 20, 0.35);
  border-radius: 8px;
  padding: 1.25rem 1.4rem;
  display: flex;
  flex-direction: column;
  position: relative;
}

.col-good-header {
  font-family: var(--font-pixel);
  font-size: 0.65rem;
  color: var(--green);
  letter-spacing: 1px;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  border-bottom: 1px solid rgba(57, 255, 20, 0.2);
  padding-bottom: 0.5rem;
}

.doc-paper {
  background: #ffffff;
  color: #1a1a2e;
  border-radius: 6px;
  padding: 1.25rem 1.4rem;
  font-family: 'Times New Roman', serif;
  line-height: 1.5;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  font-size: 0.88rem;
  flex: 1;
}

.doc-paper h4 {
  font-size: 1.05rem;
  text-align: center;
  margin-bottom: 0.6rem;
  text-transform: uppercase;
  font-weight: bold;
}

.tag-bad {
  background: rgba(255, 51, 102, 0.15);
  color: #c40033;
  padding: 2px 5px;
  border-radius: 3px;
  font-weight: bold;
  border-bottom: 1px dashed var(--red);
}

.tag-good {
  background: rgba(30, 168, 10, 0.15);
  color: #0b6b0b;
  padding: 2px 5px;
  border-radius: 3px;
  font-weight: bold;
  border-bottom: 1px solid var(--green);
}

.why-box {
  margin-top: 0.8rem;
  font-size: 0.8rem;
  padding: 0.5rem 0.75rem;
  border-radius: 4px;
}
.why-box-bad {
  background: rgba(255, 51, 102, 0.1);
  color: #ff99aa;
  border-left: 3px solid var(--red);
}
.why-box-good {
  background: rgba(57, 255, 20, 0.1);
  color: #bbffaa;
  border-left: 3px solid var(--green);
}

/* Colonna Taccuino Appunti al Banco (Giallo/Ambra) */
.col-notebook {
  background: rgba(255, 238, 0, 0.03);
  border: 1.5px solid rgba(255, 238, 0, 0.35);
  border-radius: 8px;
  padding: 1.25rem 1.4rem;
  display: flex;
  flex-direction: column;
  position: relative;
}

.col-notebook-header {
  font-family: var(--font-pixel);
  font-size: 0.65rem;
  color: var(--yellow);
  letter-spacing: 1px;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  border-bottom: 1px solid rgba(255, 238, 0, 0.2);
  padding-bottom: 0.5rem;
}

.notebook-paper {
  background: #081122;
  color: #dce7f8;
  border: 1px solid rgba(255, 238, 0, 0.2);
  border-radius: 6px;
  padding: 1.2rem 1.3rem;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  line-height: 1.55;
  box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
  flex: 1;
}

.notebook-paper h4 {
  color: var(--yellow);
  font-size: 0.95rem;
  margin-bottom: 0.5rem;
  border-bottom: 1px dashed rgba(255, 238, 0, 0.3);
  padding-bottom: 4px;
}

/* Scheda Compito per Casa */
.hw-box {
  background: #081122;
  border: 1.5px solid var(--border-cyan);
  border-radius: 8px;
  padding: 1.4rem 1.6rem;
  margin-bottom: 1rem;
}

.hw-badge {
  display: inline-block;
  background: rgba(255, 136, 0, 0.15);
  border: 1px solid var(--orange);
  color: var(--orange);
  font-family: var(--font-pixel);
  font-size: 0.62rem;
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 0.75rem;
  letter-spacing: 1px;
}

.hw-task-item {
  background: rgba(0, 245, 255, 0.04);
  border-left: 3px solid var(--cyan);
  padding: 0.65rem 0.9rem;
  border-radius: 0 4px 4px 0;
  font-size: 0.86rem;
  line-height: 1.5;
  margin-bottom: 0.55rem;
}

/* ═══════════════════════════════════════════
   STEP 3: STRUMENTI
   ═══════════════════════════════════════════ */
.meter-card-display {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

/* ═══════════════════════════════════════════
   STEP 4: CALCOLATORE DATI E FORMULE
   ═══════════════════════════════════════════ */
.calc-table {
  width: 100%;
  border-collapse: collapse;
  margin: 0.8rem 0;
  font-size: 0.85rem;
}
.calc-table th, .calc-table td {
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 0.5rem;
  text-align: center;
}
.calc-table th {
  background: rgba(57, 255, 20, 0.08);
  color: var(--green);
  font-family: var(--font-mono);
}
.calc-table input {
  width: 75px;
  background: #050811;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: var(--yellow);
  font-family: var(--font-mono);
  font-size: 0.95rem;
  text-align: center;
  padding: 4px;
  border-radius: 4px;
}

/* ═══════════════════════════════════════════
   STEP 5: CANVAS GRAFICI AFFIANCATI
   ═══════════════════════════════════════════ */
.canvas-mini {
  background: #050914;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  width: 100%;
  height: 190px;
  display: block;
}

/* ═══════════════════════════════════════════
   BOTTOM ACTION BAR (NAVIGAZIONE AVANTI/INDIETRO)
   ═══════════════════════════════════════════ */
.bottom-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.step-jump-selector {
  display: flex;
  gap: 0.4rem;
  align-items: center;
}

.jump-btn {
  background: var(--card-inner);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: var(--text-dim);
  font-family: var(--font-pixel);
  font-size: 0.55rem;
  width: 28px;
  height: 28px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.jump-btn:hover {
  border-color: var(--green);
  color: var(--white);
}
.jump-btn.active {
  background: var(--green);
  color: var(--bg);
  border-color: var(--green);
  box-shadow: var(--glow-green);
  font-weight: bold;
}

.nav-btn {
  font-family: var(--font-pixel);
  font-size: 0.65rem;
  padding: 0.8rem 1.4rem;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.25s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  letter-spacing: 1px;
}

.btn-prev {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: var(--text-dim);
}
.btn-prev:hover:not(:disabled) {
  border-color: var(--white);
  color: var(--white);
  transform: translateX(-3px);
}
.btn-prev:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.btn-next {
  background: var(--green);
  border: 1px solid var(--green);
  color: var(--bg);
  font-weight: bold;
  box-shadow: var(--glow-green);
}
.btn-next:hover {
  background: #50ff33;
  box-shadow: 0 0 22px rgba(57, 255, 20, 0.6);
  transform: translateX(3px);
}

/* Feedback box inferiore */
.focus-feedback {
  background: rgba(0, 245, 255, 0.06);
  border-left: 3px solid var(--cyan);
  padding: 0.8rem 1.1rem;
  border-radius: 0 6px 6px 0;
  font-size: 0.82rem;
  margin-top: 1.25rem;
  line-height: 1.5;
  color: var(--white);
}

/* Print Clean */
@media print {
  body { background: #fff !important; color: #000 !important; }
  .top-bar, .bottom-nav { display: none !important; }
  .focus-card { border: none !important; box-shadow: none !important; padding: 0 !important; }
}
</style>
</head>
<body>

  <!-- ── Top Navigation Bar (Senza sbarra a pallini) ── -->
  <header class="top-bar">
    <a href="/#fisica-laboratorio" class="back-link">
      <span>◄</span> FISICA LAB
    </a>
    <div class="school-tag">
      <span>🏫</span> ISS GIORDANO BRUNO — LABORATORIO DI FISICA
    </div>
    <div class="step-indicator" id="stepCounterText">
      PASSO 1 DI 8
    </div>
  </header>

  <!-- ── Main Stage (Area Centrale a Focus Singolo) ── -->
  <main class="main-stage">

    <div class="step-header">
      <div class="step-subtitle-badge" id="stepBadge">FASE 1 — IL METODO SCIENTIFICO</div>
      <h1 class="step-title" id="stepTitle">L'ANATOMIA DI UNA RELAZIONE</h1>
      <p class="step-rule" id="stepRule">
        Confronta gli errori più comuni con la versione scientifica corretta per imparare subito a impostare la tua relazione.
      </p>
    </div>

    <!-- Area Card con Contenuto Specifico dello Step Corrente -->
    <div class="focus-card" id="focusCard">
      <!-- Dynamic Step Content Populated by JavaScript -->
    </div>

    <!-- Bottom Action Bar (Navigazione Avanti/Indietro con Selettore Diretto) -->
    <div class="bottom-nav">
      <button class="nav-btn btn-prev" id="btnPrev" onclick="prevStep()" disabled>
        <span>◄</span> PRECEDENTE
      </button>

      <div class="step-jump-selector" id="jumpSelector">
        <button class="jump-btn active" onclick="goToStep(1)">1</button>
        <button class="jump-btn" onclick="goToStep(2)">2</button>
        <button class="jump-btn" onclick="goToStep(3)">3</button>
        <button class="jump-btn" onclick="goToStep(4)">4</button>
        <button class="jump-btn" onclick="goToStep(5)">5</button>
        <button class="jump-btn" onclick="goToStep(6)">6</button>
        <button class="jump-btn" onclick="goToStep(7)">7</button>
        <button class="jump-btn" onclick="goToStep(8)">8</button>
      </div>

      <button class="nav-btn btn-next" id="btnNext" onclick="nextStep()">
        SUCCESSIVO <span>►</span>
      </button>
    </div>

  </main>

<script>
// ═══════════════════════════════════════════
// STATO & DATI DELLA LEZIONE (CONFRONTO AFFIANCATO)
// ═══════════════════════════════════════════
let currentStep = 1;
const totalSteps = 8;

const STEPS = [
  // ── PASSO 1: CONFRONTO GLOBALE AFFIANCATO ──
  {
    badge: "FASE 1 — IL METODO SCIENTIFICO",
    title: "L'ANATOMIA DI UNA RELAZIONE",
    rule: "Guarda il confronto diretto: a sinistra gli errori più diffusi da evitare, a destra come devi impostare il tuo lavoro.",
    render: () => `
      <div class="compare-frame">
        <!-- Colonna Errata -->
        <div class="col-bad">
          <div class="col-bad-header">
            <span>❌</span> 1. COSA NON FARE (ERRORI COMUNI)
          </div>
          <div class="doc-paper">
            <h4 style="color: #c40033;">ESPERIMENTO CON LA MOLLA</h4>
            <p><strong>Obiettivo:</strong> <span class="tag-bad">"Oggi ci siamo divertiti a vedere quanto tirava la molla attaccandoci dei pesetti."</span></p>
            <p><strong>Strumenti:</strong> <span class="tag-bad">"Abbiamo usato un righello normale e una bilancia trovata sul banco."</span></p>
            <p><strong>Misure:</strong> "Allungamento: 4.2, 4.4, 4.3. Risultato: <span class="tag-bad">k = 22.84615384 N/m precisi</span>."</p>
            <p><strong>Conclusioni:</strong> <span class="tag-bad">"L'esperimento è perfetto, non ci sono stati errori."</span></p>
          </div>
          <div class="why-box why-box-bad">
            <strong>❌ Errori da evitare:</strong> Linguaggio da diario personale, strumenti senza sensibilità/portata, troppe cifre decimali a caso e negazione delle incertezze.
          </div>
        </div>

        <!-- Colonna Corretta -->
        <div class="col-good">
          <div class="col-good-header">
            <span>✔️</span> 2. COSA DEVI FARE (METODO SCIENTIFICO)
          </div>
          <div class="doc-paper">
            <h4 style="color: #0b6b0b;">VERIFICA DELLA LEGGE DI HOOKE</h4>
            <p><strong>Obiettivo:</strong> <span class="tag-good">"Determinare sperimentalmente la costante elastica k di una molla tramite la forza peso applicata."</span></p>
            <p><strong>Strumenti:</strong> <span class="tag-good">"Asta millimetrata (p: 100 cm, s: 0.1 cm), Bilancia tecnica (p: 500 g, s: 0.1 g)."</span></p>
            <p><strong>Misure:</strong> "Δl_medio = <span class="tag-good">(4.3 ± 0.1) cm</span>. Risultato: <span class="tag-good">k = (22.8 ± 0.5) N/m</span>."</p>
            <p><strong>Conclusioni:</strong> <span class="tag-good">"Proporzionalità diretta verificata; le incertezze sono compatibili con la sensibilità strumentale."</span></p>
          </div>
          <div class="why-box why-box-good">
            <strong>✔️ Punti di forza:</strong> Verbo all'infinito, caratteristiche metrologiche precise, unità di misura S.I., cifre significative corrette e spirito critico.
          </div>
        </div>
      </div>

      <div class="focus-feedback">
        💡 <strong>Ricorda:</strong> Chiunque legga la tua relazione deve poter ripetere il tuo stesso identico esperimento e ottenere gli stessi risultati.
      </div>
    `
  },

  // ── PASSO 2: TITOLO & OBIETTIVO AFFIANCATI ──
  {
    badge: "FASE 2 — IL PRIMO BLOCCO",
    title: "IL TITOLO E L'OBIETTIVO",
    rule: "La regola d'oro: il tuo obiettivo deve sempre iniziare con un VERBO ALL'INFINITO (Determinare, Misurare, Verificare) e indicare metodo e grandezza.",
    render: () => `
      <div class="compare-frame">
        <!-- Colonna Errata -->
        <div class="col-bad">
          <div class="col-bad-header">
            <span>❌</span> COSA NON SCRIVERE (LINGUAGGIO INFORMALE)
          </div>
          <div style="font-size: 0.9rem; line-height: 1.6; color: #ff99aa; margin-bottom: 0.8rem;">
            <em>"Oggi con il compagno di banco abbiamo appeso dei pesetti alla molla per vedere quanto scendeva in basso."</em>
          </div>
          <div class="why-box why-box-bad">
            <strong>Perché è bocciato:</strong><br>
            • Descrive un'azione manuale vaga, non lo scopo scientifico.<br>
            • Non specifica la legge fisica di riferimento (Hooke).<br>
            • Manca la grandezza fisica cercata (costante elastica <em>k</em>).
          </div>
        </div>

        <!-- Colonna Corretta -->
        <div class="col-good">
          <div class="col-good-header">
            <span>✔️</span> COME DEVI FORMULARLO
          </div>
          <div style="font-size: 0.9rem; line-height: 1.6; color: #bbffaa; margin-bottom: 0.8rem;">
            <em>"<strong>Determinare</strong> sperimentalmente la costante elastica <strong>k</strong> di una molla elicoidale mediante la <strong>legge di Hooke</strong>."</em>
          </div>
          <div class="why-box why-box-good">

// FUNZIONI DI NAVIGAZIONE STEP
// ═══════════════════════════════════════════
function loadCurrentStep() {
  const step = STEPS[currentStep - 1];

  // Aggiorna header
  document.getElementById('stepBadge').textContent = step.badge;
  document.getElementById('stepTitle').textContent = step.title;
  document.getElementById('stepRule').textContent = step.rule;
  document.getElementById('stepCounterText').textContent = `PASSO ${currentStep} DI ${totalSteps}`;

  // Renderizza card principale
  const card = document.getElementById('focusCard');
  card.innerHTML = step.render();

  // Aggiorna selettore numerico in basso
  document.querySelectorAll('.jump-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', idx + 1 === currentStep);
  });

  // Gestione pulsanti avanti/indietro
  document.getElementById('btnPrev').disabled = (currentStep === 1);
  const nextBtn = document.getElementById('btnNext');
  if (currentStep === totalSteps) {
    nextBtn.innerHTML = `RICOMINCIA <span>↺</span>`;
  } else {
    nextBtn.innerHTML = `SUCCESSIVO <span>►</span>`;
  }

  // Trigger post-render per grafici o calcoli
  if (currentStep === 5) {
    setTimeout(drawBothSideGraphs, 50);
  } else if (currentStep === 4) {
    setTimeout(updateCalcStep, 50);
  }
}

function nextStep() {
  if (currentStep < totalSteps) {
    currentStep++;
  } else {
    currentStep = 1;
  }
  loadCurrentStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevStep() {
  if (currentStep > 1) {
    currentStep--;
    loadCurrentStep();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function goToStep(s) {
  currentStep = s;
  loadCurrentStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Navigazione tastiera (frecce destra/sinistra)
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') {
    nextStep();
  } else if (e.key === 'ArrowLeft') {
    prevStep();
  }
});

// LOGICHE DEI SINGOLI PASSI
// ═══════════════════════════════════════════

// Step 4: Calcolo Misure
function updateCalcStep() {
  const v1 = parseFloat(document.getElementById('v1').value) || 0;
  const v2 = parseFloat(document.getElementById('v2').value) || 0;
  const v3 = parseFloat(document.getElementById('v3').value) || 0;

  const mean = (v1 + v2 + v3) / 3;
  const max = Math.max(v1, v2, v3);
  const min = Math.min(v1, v2, v3);
  const semidisp = (max - min) / 2;
  const err = Math.max(semidisp, 0.1);

  const resEl = document.getElementById('sideCalcResult');
  const detEl = document.getElementById('sideCalcDetail');
  if (resEl) resEl.textContent = `Δl = (${mean.toFixed(1)} ± ${err.toFixed(1)}) cm`;
  if (detEl) {
    detEl.innerHTML = `• <strong>Media:</strong> ${mean.toFixed(2)} cm ➔ <strong>${mean.toFixed(1)} cm</strong> | • <strong>Incertezza:</strong> (${max} - ${min})/2 = <strong>${err.toFixed(1)} cm</strong>.`;
  }
}

// Step 5: Disegna entrambi i grafici affiancati
function drawBothSideGraphs() {
  // 1. Grafico Errato (Zig-Zag)
  const cBad = document.getElementById('canvasBad');
  if (cBad) {
    const ctx = cBad.getContext('2d');
    const w = cBad.width;
    const h = cBad.height;
    ctx.clearRect(0, 0, w, h);

    // Assi
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(35, 15); ctx.lineTo(35, h - 25); ctx.lineTo(w - 15, h - 25);
    ctx.stroke();

    const pts = [
      { x: 35, y: h - 25 },
      { x: 100, y: h - 55 },
      { x: 180, y: h - 85 },
      { x: 260, y: h - 145 },
      { x: 340, y: h - 165 }
    ];

    // Punti
    ctx.fillStyle = "#ff3366";
    pts.slice(1).forEach(p => {
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    });

    // Linea Zig-Zag spezzata
    ctx.strokeStyle = "#ff3366";
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // 2. Grafico Corretto (Retta Best-fit)
  const cGood = document.getElementById('canvasGood');
  if (cGood) {
    const ctx = cGood.getContext('2d');
    const w = cGood.width;
    const h = cGood.height;
    ctx.clearRect(0, 0, w, h);

    // Assi
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(35, 15); ctx.lineTo(35, h - 25); ctx.lineTo(w - 15, h - 25);
    ctx.stroke();

    const pts = [
      { x: 35, y: h - 25 },
      { x: 100, y: h - 55 },
      { x: 180, y: h - 85 },
      { x: 260, y: h - 145 },
      { x: 340, y: h - 165 }
    ];

    // Punti
    ctx.fillStyle = "#ffee00";
    pts.slice(1).forEach(p => {
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    });

    // Retta best-fit continua verde
    ctx.strokeStyle = "#39ff14";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(35, h - 25);
    ctx.lineTo(w - 30, 20);
    ctx.stroke();
  }
}

// Step 7: Update Print Card
function updatePrintDoc() {
  const a = document.getElementById('repAuthors').value;
  const c = document.getElementById('repClass').value;
  const m = document.getElementById('docMeta');
  if (m) m.textContent = `${c} · Gruppo: ${a}`;
}

// Avvio
window.addEventListener('DOMContentLoaded', () => {
  loadCurrentStep();
});
</script>
