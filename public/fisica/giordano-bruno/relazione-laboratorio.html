html, body {

/* ═══════════════════════════════════════════

.bottom-nav {

<script>
// ═══════════════════════════════════════════
// STATO & DATI DELLA LEZIONE — PROVA 2: IL PENDOLO
// ═══════════════════════════════════════════
let currentStep = 1;
const totalSteps = 8;
let currentMassTab = 'm1'; // 'm1' | 'm2'

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {
      console.log("Fullscreen request failed", err);
    });
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
}

// Dati realistici per pendolo con filo L = 50.0 cm (T teorico ~ 1.42 s, 5 oscillazioni ~ 7.1 s)
const PENDOLO_DATA = {
  m1: {
    label: "Massa m₁ (Minore: Alluminio)",
    massStr: "m₁ = (25.4 ± 0.1) g",
    times5: [7.08, 7.15, 7.10, 6.85, 7.12, 7.05, 7.45, 7.14, 7.09, 7.16, 7.07, 7.11]
  },
  m2: {
    label: "Massa m₂ (Maggiore: Ottone)",
    massStr: "m₂ = (88.7 ± 0.1) g",
    times5: [7.12, 7.06, 7.18, 7.48, 7.09, 6.88, 7.14, 7.11, 7.07, 7.15, 7.10, 7.13]
  }
};

const STEPS = [
  // ── PASSO 1: CONFRONTO GLOBALE AFFIANCATO ──
  {
    badge: "FASE 1 — IL METODO SCIENTIFICO",
    title: "L'ANATOMIA DI UNA RELAZIONE",
    rule: "Confronto diretto sulla Prova 2: a sinistra la relazione con errori gravi, a destra l'impostazione scientifica formale.",
    render: () => `
      <div class="compare-frame">
        <!-- Colonna Errata -->
        <div class="col-bad">
          <div class="col-bad-header">
            <span>❌</span> 1. COSA NON FARE (ERRORI GRAVI)
          </div>
          <div class="doc-paper">
            <h4 style="color: #991b1b;">ESPERIMENTO COL PENDOLO</h4>
            <p><strong>Obiettivo:</strong> <span class="tag-bad">"Oggi ci siamo divertiti a far dondolare due palline per vedere quale andava più svelta."</span></p>
            <p><strong>Strumenti:</strong> <span class="tag-bad">"Abbiamo usato il cronometro del cellulare e un metro trovato in aula."</span></p>
            <p><strong>Misure:</strong> "Tempo preso a caso: <span class="tag-bad">1.4285714 s precisi</span> per 1 giro solo."</p>
            <p><strong>Conclusioni:</strong> <span class="tag-bad">"L'esperimento è perfetto, non ci sono stati errori."</span></p>
          </div>
          <div class="why-box why-box-bad">
            <strong>❌ Errori gravi:</strong> Diario informale soggettivo, strumenti senza portata né sensibilità, misura di 1 sola oscillazione (errore ~15%!) e negazione degli errori sperimentali.
          </div>
        </div>

        <!-- Colonna Corretta -->
        <div class="col-good">
          <div class="col-good-header">
            <span>✔️</span> 2. COSA DEVI FARE (METODO RIGOROSO)
          </div>
          <div class="doc-paper">
            <h4 style="color: #166534;">PROVA 2: IL PERIODO DEL PENDOLO</h4>
            <p><strong>Obiettivo:</strong> <span class="tag-good">"Determinare se T dipende dalla massa (m₁ ed m₂), a lunghezza L costante."</span></p>
            <p><strong>Strumenti:</strong> <span class="tag-good">"Cronometro (p: 99m, s: 0.01s), Bilancia (p: 500g, s: 0.1g), Asta (p: 100cm, s: 0.1cm)."</span></p>
            <p><strong>Metodologia:</strong> <span class="tag-good">"Blocchi di 5 oscillazioni / 5 per abbattere il tempo di reazione; 12 prove scartando max e min."</span></p>
            <p><strong>Risultati:</strong> <span class="tag-good">t₁ = (1.42 ± 0.02) s &nbsp;|&nbsp; t₂ = (1.42 ± 0.02) s</span></p>
            <p><strong>Conclusioni:</strong> <span class="tag-good">"Periodi coincidenti: confermato l'isocronismo del pendolo."</span></p>

// ═══════════════════════════════════════════
// FUNZIONI DI NAVIGAZIONE E GESTIONE STEP
// ═══════════════════════════════════════════
function loadCurrentStep() {
  const step = STEPS[currentStep - 1];

  document.getElementById('stepBadge').textContent = step.badge;
  document.getElementById('stepTitle').textContent = step.title;
  document.getElementById('stepRule').textContent = step.rule;
  document.getElementById('stepCounterText').textContent = `PASSO ${currentStep} DI ${totalSteps}`;

  const card = document.getElementById('focusCard');
  card.innerHTML = step.render();

  document.querySelectorAll('.jump-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', idx + 1 === currentStep);
  });

  document.getElementById('btnPrev').disabled = (currentStep === 1);
  const nextBtn = document.getElementById('btnNext');
  if (currentStep === totalSteps) {
    nextBtn.innerHTML = `RICOMINCIA <span>↺</span>`;
  } else {
    nextBtn.innerHTML = `SUCCESSIVO <span>►</span>`;
  }

  // Se siamo allo Step 5 (Simulatore live), avvia il calcolo
  if (currentStep === 5) {
    setTimeout(renderPendoloTableAndCalc, 50);
  }
}

function nextStep() {
  if (currentStep < totalSteps) {
    currentStep++;
  } else {
    currentStep = 1;
  }
  loadCurrentStep();
}

function prevStep() {
  if (currentStep > 1) {
    currentStep--;
    loadCurrentStep();
  }
}

function goToStep(s) {
  currentStep = s;
  loadCurrentStep();
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextStep();
  else if (e.key === 'ArrowLeft') prevStep();
});

// ═══════════════════════════════════════════
// LOGICA DEL SIMULATORE INTERATTIVO (STEP 5)
// ═══════════════════════════════════════════
function switchPendoloMass(m) {
  currentMassTab = m;
  loadCurrentStep();
}

function renderPendoloTableAndCalc() {
  const data = PENDOLO_DATA[currentMassTab];
  const tbody = document.getElementById('pendoloTbody');
  if (!tbody) return;

  const times5 = data.times5;
  const periods = times5.map(t => Number((t / 5).toFixed(3)));

  // Trova max e min tra i periodi
  const maxP = Math.max(...periods);
  const minP = Math.min(...periods);
  const maxIdx = periods.indexOf(maxP);
  const minIdx = periods.indexOf(minP);

  // Genera righe della tabella
  let html = '';
  times5.forEach((t, i) => {
    const p = periods[i];
    const isMax = (i === maxIdx);
    const isMin = (i === minIdx);
    const isScartato = isMax || isMin;

    let badge = `<span class="badge-valido">✓ Valida</span>`;
    if (isMax) badge = `<span class="badge-scartato">❌ MAX</span>`;
    if (isMin) badge = `<span class="badge-scartato">❌ MIN</span>`;

    html += `
      <tr class="${isScartato ? 'table-scartata-row' : ''}">
        <td style="font-weight:800; color:#475569;">${i + 1}</td>
        <td>
          <input type="number" step="0.01" value="${t.toFixed(2)}" onchange="onPendoloInputChanged(${i}, this.value)">
        </td>
        <td style="font-family:var(--font-mono); font-weight:800; font-size:0.95rem; color:${isScartato ? 'var(--red)' : 'var(--primary)'};">
          ${p.toFixed(3)}
        </td>
        <td>${badge}</td>
      </tr>
    `;
  });
  tbody.innerHTML = html;

  // Calcola statistiche sui 10 valori validi
  const validPeriods = periods.filter((_, i) => i !== maxIdx && i !== minIdx);
  const sum = validPeriods.reduce((acc, v) => acc + v, 0);
  const mean = sum / validPeriods.length;
  const semidisp = (Math.max(...validPeriods) - Math.min(...validPeriods)) / 2;
  const err = Math.max(Number(semidisp.toFixed(2)), 0.02);

  // Aggiorna card risultati
  const headEl = document.getElementById('calcBoxHeader');
  if (headEl) headEl.textContent = `RISULTATO ELABORATO — ${data.label.toUpperCase()}`;

  const maxEl = document.getElementById('calcMaxVal');
  if (maxEl) maxEl.textContent = `${maxP.toFixed(3)} s (#${maxIdx + 1})`;

  const minEl = document.getElementById('calcMinVal');
  if (minEl) minEl.textContent = `${minP.toFixed(3)} s (#${minIdx + 1})`;

  const meanEl = document.getElementById('calcMeanVal');
  if (meanEl) meanEl.textContent = `${mean.toFixed(3)} s ➔ ${mean.toFixed(2)} s`;

  const errEl = document.getElementById('calcErrVal');
  if (errEl) errEl.textContent = `± ${err.toFixed(2)} s`;

  const finalEl = document.getElementById('calcFinalStr');
  const labelVar = currentMassTab === 'm1' ? 't₁' : 't₂';
  if (finalEl) finalEl.textContent = `${labelVar} = (${mean.toFixed(2)} ± ${err.toFixed(2)}) s`;
}

function onPendoloInputChanged(index, val) {
  const num = parseFloat(val);
  if (!isNaN(num) && num > 0) {
    PENDOLO_DATA[currentMassTab].times5[index] = num;
    renderPendoloTableAndCalc();
  }
}

window.addEventListener('DOMContentLoaded', () => {
  loadCurrentStep();
});
</script>
