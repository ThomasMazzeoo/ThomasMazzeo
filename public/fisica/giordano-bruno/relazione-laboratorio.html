<style>
/* ═══════════════════════════════════════════
   DESIGN SYSTEM LIM: SFONDO BIANCO, ALTO CONTRASTO,
   OTTIMIZZATO PER PROIEZIONE E DISTANZA
   ═══════════════════════════════════════════ */
:root {
  --bg: #f8fafc;
  --bg-card: #ffffff;
  --text-main: #0f172a;       /* Slate 900: nero quasi puro, massima leggibilità */
  --text-muted: #334155;      /* Slate 700: mai testo sbiadito o grigio chiaro */
  --text-light: #64748b;
  
  --primary: #1d4ed8;         /* Blu reale intenso */
  --primary-bg: #eff6ff;
  --primary-border: #93c5fd;
  
  --green: #047857;           /* Smeraldo intenso */
  --green-bg: #ecfdf5;
  --green-border: #6ee7b7;
  --green-text: #064e3b;
  
  --red: #b91c1c;             /* Rosso scuro vivo */
  --red-bg: #fef2f2;
  --red-border: #fca5a5;
  --red-text: #7f1d1d;
  
  --yellow: #b45309;          /* Ambra scuro intenso */
  --yellow-bg: #fffbeb;
  --yellow-border: #fde68a;
  --yellow-text: #78350f;

  --border: #cbd5e1;          /* Bordo netto Slate 300 */
  --border-strong: #94a3b8;
  
  --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --lim-scale: 1;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg);
  color: var(--text-main);
  font-family: var(--font-main);
  font-size: 17px;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Griglia millimetrata delicata stile quaderno di fisica */
body::before {
  content: "";
  display: block;
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(#e2e8f0 1px, transparent 1px),
    linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
  opacity: 0.55;
  z-index: 0;
}

/* ═══════════════════════════════════════════
   TOP NAVIGATION BAR (LIM COMPATIBLE)
   ═══════════════════════════════════════════ */
.top-bar {

  justify-content: space-between;
  align-items: center;
  padding: 0.85rem 1.8rem;
  background: #ffffff;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

.back-link {

  color: var(--primary);

}

}

.school-tag {

  color: var(--text-main);

  align-items: center;
  gap: 0.6rem;
}
.school-tag .badge-school {
  background: #e2e8f0;

  padding: 0.2rem 0.6rem;

  font-size: 0.85rem;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.top-controls {
  display: flex;

  gap: 0.8rem;
}

.zoom-btn {
  background: #ffffff;

.step-indicator {

/* ═══════════════════════════════════════════

.main-stage {

  width: 95%;
  margin: 1.5rem auto 2.5rem;

}

.step-header {

}

.step-subtitle-badge {

}

.step-title {
  font-size: 2.1rem;
  font-weight: 800;

  letter-spacing: -0.5px;

.step-rule {

  font-size: 1.15rem;

/* Focus Card: Sfondo Bianco Brillante, Bordo Netto */

}

  from { opacity: 0; transform: translateY(6px); }

/* ═══════════════════════════════════════════
   TABELLE DATI E CALCOLATORI
   ═══════════════════════════════════════════ */
.calc-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  margin: 0.6rem 0;
  font-size: 1.02rem;
  border: 2px solid var(--border-strong);
  border-radius: 8px;

}
.calc-table th, .calc-table td {
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 0.65rem 0.75rem;
  text-align: center;
}
.calc-table th:last-child, .calc-table td:last-child {
  border-right: none;
}
.calc-table tr:last-child td {
  border-bottom: none;
}
.calc-table th {
  background: #f1f5f9;
  color: #1e293b;

  font-size: 0.95rem;
}
.calc-table input {

  border-radius: 6px;

}
.calc-table input:focus {
  border-color: var(--primary);

  background: #eff6ff;
  box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.2);
}

.badge-scartato {
  display: inline-block;
  background: #fee2e2;
  color: var(--red);
  border: 1.5px solid var(--red);
  border-radius: 6px;
  font-size: 0.82rem;
  padding: 3px 8px;
  font-weight: 800;
}
.badge-valido {
  display: inline-block;
  background: #dcfce7;
  color: var(--green);
  border: 1.5px solid var(--green);
  border-radius: 6px;
  font-size: 0.82rem;
  padding: 3px 8px;
  font-weight: 700;
}

.table-scartata-row {
  background: #fff1f2 !important;
  text-decoration: line-through;
  color: #9f1239;
}
.table-scartata-row td {
  opacity: 0.85;
}

/* ═══════════════════════════════════════════
   BOTTOM ACTION BAR (TOUCH & LIM FRIENDLY)
   ═══════════════════════════════════════════ */
.bottom-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 1.6rem;
  padding-top: 1.2rem;
  border-top: 2px solid #e2e8f0;
}

.step-jump-selector {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

.jump-btn {
  background: #ffffff;
  border: 2px solid var(--border-strong);
  color: var(--text-muted);
  font-weight: 800;
  font-size: 0.95rem;
  width: 40px;

}
.jump-btn:hover {

.jump-btn.active {

.nav-btn {

.btn-prev {

.btn-prev:disabled {

.btn-next {

.focus-feedback {

}

/* Scheda Compito Stampabile */
.hw-box {
  background: #ffffff;
  border: 2px solid #cbd5e1;
  border-radius: 12px;
  padding: 1.8rem;
  box-shadow: 0 4px 15px rgba(0,0,0,0.04);
}
.hw-badge {
  font-weight: 800;
  font-size: 0.85rem;
  color: var(--primary);
  margin-bottom: 0.4rem;

}
.hw-task-item {
  background: #f8fafc;
  border: 1.5px solid #e2e8f0;
  border-left: 5px solid var(--primary);
  padding: 0.85rem 1.1rem;
  margin-bottom: 0.75rem;
  border-radius: 8px;
  font-size: 1.02rem;
  line-height: 1.6;
  color: #1e293b;
}

/* Print Clean */
@media print {
  body { background: #fff !important; color: #000 !important; }
  body::before { display: none !important; }
  .top-bar, .bottom-nav, .focus-feedback, .top-controls { display: none !important; }
  .focus-card { border: none !important; box-shadow: none !important; padding: 0 !important; }
  .hw-box { border: 1px solid #000 !important; box-shadow: none !important; }

</style>

  <!-- ── Top Navigation Bar ── -->
  <header class="top-bar">

  <!-- ── Main Stage ── -->
  <main class="main-stage" id="mainStage">

<script>
// ═══════════════════════════════════════════
// STATO & DATI DELLA LEZIONE — PROVA 2: IL PENDOLO
// ═══════════════════════════════════════════
let currentStep = 1;
const totalSteps = 8;
let currentMassTab = 'm1'; // 'm1' | 'm2'
let limZoomScale = 1.0;

function adjustLimZoom(delta) {
  limZoomScale = Math.min(Math.max(limZoomScale + delta, 0.8), 1.35);
  const stage = document.getElementById('mainStage');
  if (stage) {
    stage.style.transform = `scale(${limZoomScale})`;
  }
}

// Dati realistici per pendolo con filo L = 50.0 cm (T teorico ~ 1.42 s, 5 oscillazioni ~ 7.1 s)
const PENDOLO_DATA = {
  m1: {
    label: "Massa m₁ (Minore: Alluminio)",
    massStr: "m₁ = (25.4 ± 0.1) g",
    times5: [7.08, 7.15, 7.10, 6.85, 7.12, 7.05, 7.45, 7.14, 7.09, 7.16, 7.07, 7.11]
  },
  m2: {
    label: "Massa m₂ (Maggiore: Ottone)",
    massStr: "m₂ = (88.7 ± 0.1) g",
    times5: [7.12, 7.06, 7.18, 7.48, 7.09, 6.88, 7.14, 7.11, 7.07, 7.15, 7.10, 7.13]
  }
};

const STEPS = [
  // ── PASSO 1: CONFRONTO GLOBALE AFFIANCATO ──
  {
    badge: "FASE 1 — IL METODO SCIENTIFICO",
    title: "L'ANATOMIA DI UNA RELAZIONE",
    rule: "Guarda il confronto diretto sulla Prova 2 (Il Pendolo): a sinistra la tipica relazione bocciata, a destra l'impostazione scientifica formale.",
    render: () => `
      <div class="compare-frame">
        <!-- Colonna Errata -->
        <div class="col-bad">
          <div class="col-bad-header">
            <span>❌</span> 1. COSA NON FARE (ERRORI GRAVI)
          </div>
          <div class="doc-paper">
            <h4 style="color: #991b1b;">ESPERIMENTO COL PENDOLO</h4>
            <p style="margin-bottom:0.6rem;"><strong>Obiettivo:</strong> <span class="tag-bad">"Oggi ci siamo divertiti a far dondolare due palline attaccate a uno spago per vedere quale andava più veloce."</span></p>
            <p style="margin-bottom:0.6rem;"><strong>Strumenti:</strong> <span class="tag-bad">"Abbiamo usato il cronometro del cellulare e un metro trovato in aula."</span></p>
            <p style="margin-bottom:0.6rem;"><strong>Misure:</strong> "Tempo preso a caso: <span class="tag-bad">1.4285714 secondi precisi</span> per un giro solo."</p>
            <p><strong>Conclusioni:</strong> <span class="tag-bad">"L'esperimento è venuto perfetto, non ci sono stati errori."</span></p>
          </div>
          <div class="why-box why-box-bad">
            <strong>❌ Errori da evitare assolutamente:</strong><br>
            • Linguaggio informale da diario ("ci siamo divertiti").<br>
            • Strumenti senza marca, portata né sensibilità.<br>
            • Misura di 1 sola oscillazione (l'errore umano è enorme: ~15%!).<br>
            • Numeri con troppi decimali finti e la frase falsa "non ci sono errori".
          </div>
        </div>

        <!-- Colonna Corretta -->
        <div class="col-good">
          <div class="col-good-header">
            <span>✔️</span> 2. COSA DEVI FARE (METODO RIGOROSO)
          </div>
          <div class="doc-paper">
            <h4 style="color: #166534;">PROVA 2: IL PERIODO DI OSCILLAZIONE DEL PENDOLO</h4>

// ═══════════════════════════════════════════
// FUNZIONI DI NAVIGAZIONE E GESTIONE STEP
// ═══════════════════════════════════════════
function loadCurrentStep() {
  const step = STEPS[currentStep - 1];

  document.getElementById('stepBadge').textContent = step.badge;
  document.getElementById('stepTitle').textContent = step.title;
  document.getElementById('stepRule').textContent = step.rule;
  document.getElementById('stepCounterText').textContent = `PASSO ${currentStep} DI ${totalSteps}`;

  const card = document.getElementById('focusCard');
  card.innerHTML = step.render();

  document.querySelectorAll('.jump-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', idx + 1 === currentStep);
  });

  document.getElementById('btnPrev').disabled = (currentStep === 1);
  const nextBtn = document.getElementById('btnNext');
  if (currentStep === totalSteps) {
    nextBtn.innerHTML = `RICOMINCIA <span>↺</span>`;
  } else {
    nextBtn.innerHTML = `SUCCESSIVO <span>►</span>`;
  }

  // Se siamo allo Step 5 (Simulatore live), avvia il calcolo
  if (currentStep === 5) {
    setTimeout(renderPendoloTableAndCalc, 50);
  }
}

function nextStep() {
  if (currentStep < totalSteps) {
    currentStep++;
  } else {
    currentStep = 1;
  }
  loadCurrentStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevStep() {
  if (currentStep > 1) {
    currentStep--;
    loadCurrentStep();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function goToStep(s) {
  currentStep = s;
  loadCurrentStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextStep();
  else if (e.key === 'ArrowLeft') prevStep();
});

// ═══════════════════════════════════════════
// LOGICA DEL SIMULATORE INTERATTIVO (STEP 5)
// ═══════════════════════════════════════════
function switchPendoloMass(m) {
  currentMassTab = m;
  loadCurrentStep();
}

function renderPendoloTableAndCalc() {
  const data = PENDOLO_DATA[currentMassTab];
  const tbody = document.getElementById('pendoloTbody');
  if (!tbody) return;

  const times5 = data.times5;
  const periods = times5.map(t => Number((t / 5).toFixed(3)));

  // Trova max e min tra i periodi
  const maxP = Math.max(...periods);
  const minP = Math.min(...periods);
  const maxIdx = periods.indexOf(maxP);
  const minIdx = periods.indexOf(minP);

  // Genera righe della tabella
  let html = '';
  times5.forEach((t, i) => {
    const p = periods[i];
    const isMax = (i === maxIdx);
    const isMin = (i === minIdx);
    const isScartato = isMax || isMin;

    let badge = `<span class="badge-valido">✓ Valida</span>`;
    if (isMax) badge = `<span class="badge-scartato">❌ MAX (Scartato)</span>`;
    if (isMin) badge = `<span class="badge-scartato">❌ MIN (Scartato)</span>`;

    html += `
      <tr class="${isScartato ? 'table-scartata-row' : ''}">
        <td style="font-weight:800; color:#475569;">${i + 1}</td>
        <td>
          <input type="number" step="0.01" value="${t.toFixed(2)}" onchange="onPendoloInputChanged(${i}, this.value)">
        </td>
        <td style="font-family:var(--font-mono); font-weight:800; font-size:1.05rem; color:${isScartato ? 'var(--red)' : 'var(--primary)'};">
          ${p.toFixed(3)}
        </td>
        <td>${badge}</td>
      </tr>
    `;
  });
  tbody.innerHTML = html;

  // Calcola statistiche sui 10 valori validi
  const validPeriods = periods.filter((_, i) => i !== maxIdx && i !== minIdx);
  const sum = validPeriods.reduce((acc, v) => acc + v, 0);
  const mean = sum / validPeriods.length;
  const semidisp = (Math.max(...validPeriods) - Math.min(...validPeriods)) / 2;
  const err = Math.max(Number(semidisp.toFixed(2)), 0.02);

  // Aggiorna card risultati
  const headEl = document.getElementById('calcBoxHeader');
  if (headEl) headEl.textContent = `RISULTATO ELABORATO — ${data.label.toUpperCase()}`;

  const maxEl = document.getElementById('calcMaxVal');
  if (maxEl) maxEl.textContent = `${maxP.toFixed(3)} s (Misura #${maxIdx + 1})`;

  const minEl = document.getElementById('calcMinVal');
  if (minEl) minEl.textContent = `${minP.toFixed(3)} s (Misura #${minIdx + 1})`;

  const meanEl = document.getElementById('calcMeanVal');
  if (meanEl) meanEl.textContent = `${mean.toFixed(3)} s ➔ ${mean.toFixed(2)} s`;

  const errEl = document.getElementById('calcErrVal');
  if (errEl) errEl.textContent = `± ${err.toFixed(2)} s`;

  const finalEl = document.getElementById('calcFinalStr');
  const labelVar = currentMassTab === 'm1' ? 't₁' : 't₂';
  if (finalEl) finalEl.textContent = `${labelVar} = (${mean.toFixed(2)} ± ${err.toFixed(2)}) s`;
}

function onPendoloInputChanged(index, val) {
  const num = parseFloat(val);
  if (!isNaN(num) && num > 0) {
    PENDOLO_DATA[currentMassTab].times5[index] = num;
    renderPendoloTableAndCalc();
  }
}

window.addEventListener('DOMContentLoaded', () => {
  loadCurrentStep();
});
</script>
