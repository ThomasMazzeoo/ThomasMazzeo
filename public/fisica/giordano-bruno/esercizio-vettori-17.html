<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esercizio Guidato LIM — Algebra delle Componenti (Es. 33) — ISS Giordano Bruno</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body);"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      background: linear-gradient(135deg, #a855f7, #c084fc);
      color: #0f172a;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.25rem;
    }
    .brand-text h1 { font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
    .brand-text p { font-size: 0.8rem; color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      user-select: none;
    }
    .btn:hover { background: #273549; border-color: var(--accent-blue); }
    .btn-primary { background: #0284c7; border-color: #38bdf8; }
    .btn-primary:hover { background: #0369a1; }
    .btn-amber { background: #b45309; border-color: #fbbf24; }
    .btn-amber:hover { background: #92400e; }

    main {
      flex: 1;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.25rem;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .simulation-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 580px;
    }

    .svg-container {
      width: 100%;
      flex: 1;
      min-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      max-height: 480px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      user-select: none;
    }

    .controls-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .step-pills { display: flex; gap: 0.35rem; }
    .step-pill {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .step-pill.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
      transform: scale(1.1);
    }
    .step-pill.completed {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .details-card {
      overflow-y: auto;
      max-height: 80vh;
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) transparent;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
    }

    .step-title {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    .step-desc {
      font-size: 0.98rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .formula-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent-amber);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      font-size: 1.15rem;
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .data-item {
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .data-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .data-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .tip-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-left: 4px solid var(--accent-green);
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 0.9rem;
      color: #86efac;
      margin-top: auto;
    }

    /* LIM Canvas Overlay */
    #limCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    #limCanvas.active { pointer-events: auto; cursor: crosshair; }

    /* LIM Floating Toolbar */
    .lim-toolbar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 0.4rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: #334155; }
    .tool-btn.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
    }
    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-dot.active { border-color: white; transform: scale(1.15); }

    /* Whiteboard Modal */
    .whiteboard-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .whiteboard-overlay.active { display: flex; }
    .wb-header {
      padding: 0.6rem 1.25rem;
      background: #1e293b;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      white-space: nowrap;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .wb-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }
    .wb-body.bg-grid {
      background-color: #ffffff;
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      background-size: 25px 25px;
    }
    .wb-body.bg-dark {
      background-color: #0f172a;
      background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px);
      background-size: 25px 25px;
    }
    #wbCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">
        <h1>Problema a Passi 33 — Pag. 110</h1>
        <p>Algebra delle Componenti Cartesiane &amp; Somma Vettoriale</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-amber" id="btnWhiteboard">
        <span>📄</span> Foglio Bianco LIM
      </button>
      <button class="btn" id="btnFullscreen">
        <span>⛶</span> Schermo Intero
      </button>
      <a href="/fisica/giordano-bruno/" class="btn">
        <span>↩</span> Indice Esercizi
      </a>
    </div>
  </header>

  <main>
    <!-- Card Grafica / Simulazione -->
    <div class="card simulation-card">
      <div class="svg-container" id="svgContainer">
        <canvas id="limCanvas"></canvas>
        <svg id="simSvg" viewBox="-32 -30 65 58">
          <defs>
            <marker id="arrowP" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8" />
            </marker>
            <marker id="arrowQ" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#4ade80" />
            </marker>
            <marker id="arrowR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#c084fc" />
            </marker>
            <marker id="arrowS" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#f87171" />
            </marker>
            <marker id="arrowT" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#fbbf24" />
            </marker>
            <pattern id="gridLarge" width="5" height="5" patternUnits="userSpaceOnUse">
              <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#334155" stroke-width="0.15" />
            </pattern>
          </defs>

          <!-- Griglia quadrettata con passo 5 unità -->
          <rect x="-30" y="-28" width="62" height="54" fill="url(#gridLarge)" />

          <!-- Assi cartesiani centrati in (0,0) -->
          <line x1="-30" y1="0" x2="31" y2="0" stroke="#64748b" stroke-width="0.35" />
          <line x1="0" y1="-27" x2="0" y2="25" stroke="#64748b" stroke-width="0.35" />
          <text x="31" y="-0.8" fill="#94a3b8" font-size="1.8" font-weight="700">x</text>
          <text x="0.8" y="-25.5" fill="#94a3b8" font-size="1.8" font-weight="700">y</text>
          <text x="-2.2" y="2.2" fill="#94a3b8" font-size="1.6">O</text>

          <!-- Tacche principali -->
          <text x="10" y="2.2" fill="#64748b" font-size="1.3" text-anchor="middle">+10</text>
          <text x="20" y="2.2" fill="#64748b" font-size="1.3" text-anchor="middle">+20</text>
          <text x="-10" y="2.2" fill="#64748b" font-size="1.3" text-anchor="middle">-10</text>
          <text x="-20" y="2.2" fill="#64748b" font-size="1.3" text-anchor="middle">-20</text>
          
          <text x="-1.2" y="-9.5" fill="#64748b" font-size="1.3" text-anchor="end">+10</text>
          <text x="-1.2" y="10.5" fill="#64748b" font-size="1.3" text-anchor="end">-10</text>
          <text x="-1.2" y="20.5" fill="#64748b" font-size="1.3" text-anchor="end">-20</text>

          <!-- Invertiamo l'asse y per coordinate cartesiane fisiche standard -->
          <g transform="scale(1, -1)">
            <!-- Triangolo rettangolo per s (Step 4) -->
            <polygon id="triS" points="0,0 -20,0 -20,15" fill="rgba(248, 113, 113, 0.15)" stroke="rgba(248, 113, 113, 0.4)" stroke-width="0.2" opacity="0" />

            <!-- Vettore -p tratteggiato (Step 3) -->
            <line id="vecMinusP" x1="0" y1="0" x2="-11.6" y2="4.8" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="1,1" opacity="0" />

            <!-- Vettore p (azzurro, da (0,0) a (12, -5)) -->
            <line id="vecP" x1="0" y1="0" x2="11.6" y2="-4.8" stroke="#38bdf8" stroke-width="0.7" marker-end="url(#arrowP)" />

            <!-- Vettore q (verde, da (0,0) a (-8, 10)) -->
            <line id="vecQ" x1="0" y1="0" x2="-7.7" y2="9.6" stroke="#4ade80" stroke-width="0.7" marker-end="url(#arrowQ)" />

            <!-- Vettore r = -2q (viola, da (0,0) a (16, -20)) - Step 2+ -->
            <line id="vecR" x1="0" y1="0" x2="15.6" y2="-19.5" stroke="#c084fc" stroke-width="0.8" marker-end="url(#arrowR)" opacity="0" />

            <!-- Vettore s = q - p (rosso, da (0,0) a (-20, 15)) - Step 3+ -->
            <line id="vecS" x1="0" y1="0" x2="-19.5" y2="14.6" stroke="#f87171" stroke-width="0.85" marker-end="url(#arrowS)" opacity="0" />

            <!-- Vettore t = r + p (ambra, da (0,0) a (28, -25)) - Step 5 -->
            <line id="vecT" x1="0" y1="0" x2="27.4" y2="-24.5" stroke="#fbbf24" stroke-width="0.85" marker-end="url(#arrowT)" opacity="0" />
          </g>

          <!-- Etichette testuali -->
          <text id="lblP" x="13.5" y="7" fill="#38bdf8" font-size="1.8" font-weight="700">p (12; -5)</text>
          <text id="lblQ" x="-10" y="-11.5" fill="#4ade80" font-size="1.8" font-weight="700">q (-8; 10)</text>
          <text id="lblMinusP" x="-14" y="-6" fill="#94a3b8" font-size="1.5" font-weight="700" opacity="0">-p (-12; 5)</text>
          
          <text id="lblR" x="17.5" y="21.5" fill="#c084fc" font-size="1.8" font-weight="800" opacity="0">r = -2q (16; -20)</text>
          <text id="lblS" x="-26" y="-16.5" fill="#f87171" font-size="2" font-weight="800" opacity="0">s = q - p (-20; 15)</text>
          <text id="lblModS" x="-15" y="-18.5" fill="#f87171" font-size="1.6" font-weight="700" opacity="0">|s| = 25 !</text>
          <text id="lblT" x="20" y="27" fill="#fbbf24" font-size="1.8" font-weight="800" opacity="0">t = r + p (28; -25)</text>
        </svg>
      </div>

      <!-- Barra di controllo -->
      <div class="controls-bar">
        <div class="step-pills">
          <div class="step-pill active" onclick="goToStep(0)">1</div>
          <div class="step-pill" onclick="goToStep(1)">2</div>
          <div class="step-pill" onclick="goToStep(2)">3</div>
          <div class="step-pill" onclick="goToStep(3)">4</div>
          <div class="step-pill" onclick="goToStep(4)">5</div>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn" id="btnPrev" onclick="prevStep()">⏮ Prec</button>
          <button class="btn btn-primary" id="btnNext" onclick="nextStep()">Succ ⏭</button>
          <button class="btn" onclick="resetSteps()">🔄 Riavvia</button>
        </div>
      </div>
    </div>

    <!-- Card Dettagli Didattici -->
    <div class="card details-card">
      <div id="stepInfo">
        <!-- Generato dinamicamente da JS -->
      </div>
    </div>
  </main>

  <!-- LIM Floating Toolbar -->
  <div class="lim-toolbar">
    <button class="tool-btn active" id="btnPen" title="Penna">✏️</button>
    <button class="tool-btn" id="btnEraser" title="Gomma">🧹</button>
    <div class="color-dot active" style="background: #38bdf8;" onclick="setColor('#38bdf8', this)"></div>
    <div class="color-dot" style="background: #4ade80;" onclick="setColor('#4ade80', this)"></div>
    <div class="color-dot" style="background: #fbbf24;" onclick="setColor('#fbbf24', this)"></div>
    <div class="color-dot" style="background: #f87171;" onclick="setColor('#f87171', this)"></div>
    <button class="tool-btn" id="btnClearCanvas" title="Cancella Scritte">🗑️</button>
  </div>

  <!-- Whiteboard Overlay Modal -->
  <div class="whiteboard-overlay" id="whiteboardOverlay">
    <div class="wb-header">
      <div style="font-weight: 700; color: #f8fafc; display:flex; align-items:center; gap:0.5rem;">
        <span>📄</span> Foglio Bianco LIM — Spazio Libero
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <button class="btn" id="wbPenBtn">✏️ Penna</button>
        <button class="btn" id="wbEraserBtn">🧹 Gomma</button>
        <button class="btn" id="wbHandBtn" title="Trascina foglio">🖐️</button>
        <button class="btn" id="wbZoomIn">🔍+</button>
        <button class="btn" id="wbZoomOut">🔍-</button>
        <button class="btn" id="wbZoomReset">100%</button>
        <button class="btn" id="wbGridToggle">Griglia / Sfondo</button>
        <button class="btn" id="wbClear">🗑️ Svuota</button>
        <button class="btn btn-amber" id="wbClose">✕ Chiudi</button>
      </div>
    </div>
    <div class="wb-body bg-grid" id="whiteboardBody">
      <canvas id="wbCanvas"></canvas>
    </div>
  </div>

  <script>
    const stepsData = [
      {
        badge: "Passo 1 di 5 — I Vettori Noti",
        title: "Dati di Partenza in Coordinate Cartesiane",
        desc: "Abbiamo due vettori definiti mediante le loro componenti cartesiane:<br>• $\\vec{p} = (12;\\, -5{,}0)$ nel <strong>4° quadrante</strong> (sposta a destra di 12 e scende di 5).<br>• $\\vec{q} = (-8{,}0;\\, 10)$ nel <strong>2° quadrante</strong> (sposta a sinistra di 8 e sale di 10).<br><br>Calcoliamo i tre vettori richiesti dal problema a passi: $\\vec{r} = -2\\vec{q}$, $\\vec{s} = \\vec{q} - \\vec{p}$ e $\\vec{t} = \\vec{r} + \\vec{p}$.",
        formula: "\\vec{p} = (12;\\, -5{,}0) \\quad \\text{e} \\quad \\vec{q} = (-8{,}0;\\, 10)",
        data: [
          { label: "Componente p_x", val: "+12" },
          { label: "Componente p_y", val: "-5,0" },
          { label: "Componente q_x", val: "-8,0" },
          { label: "Componente q_y", val: "+10" }
        ],
        tip: "💡 L'algebra delle componenti ci permette di lavorare in modo puramente algebrico, asse per asse, senza dover tracciare grafici millimetrici!"
      },
      {
        badge: "Passo 2 di 5 — Moltiplicazione per Scalare",
        title: "Passo 1: Vettore r = -2q",
        desc: "Moltiplichiamo ciascuna componente del vettore $\\vec{q}$ per lo scalare $k = -2$:<br>$$r_x = -2 \\cdot q_x = -2 \\cdot (-8{,}0) = +16$$<br>$$r_y = -2 \\cdot q_y = -2 \\cdot 10 = -20$$<br>Il vettore risultante è $\\vec{r} = (16;\\, -20)$ nel 4° quadrante. Il segno meno ha <strong>invertito il verso</strong> (dal 2° al 4° quadrante) e il fattore $2$ ha <strong>raddoppiato il modulo</strong> ($r = 2q \\approx 25{,}6$).",
        formula: "\\vec{r} = -2\\vec{q} = (-2 \\cdot (-8);\\, -2 \\cdot 10) = (16;\\, -20)",
        data: [
          { label: "Scalare k", val: "-2" },
          { label: "r_x", val: "+16" },
          { label: "r_y", val: "-20" },
          { label: "Modulo |r|", val: "√(16² + 20²) ≈ 25,6" }
        ],
        tip: "💡 Proprietà: moltiplicando per un numero negativo, il vettore mantiene la stessa direzione (stessa retta d'azione) ma inverte il verso di 180°."
      },
      {
        badge: "Passo 3 di 5 — Differenza Vettoriale",
        title: "Passo 2: Vettore Differenza s = q - p",
        desc: "Sottrarre un vettore equivale a sommare il suo opposto: $\\vec{s} = \\vec{q} + (-\\vec{p})$ con $-\\vec{p} = (-12;\\, +5{,}0)$.<br>Eseguiamo la sottrazione componente per componente:<br>$$s_x = q_x - p_x = -8{,}0 - 12 = -20$$<br>$$s_y = q_y - p_y = 10 - (-5{,}0) = 10 + 5{,}0 = +15$$<br>Otteniamo il vettore $\\vec{s} = (-20;\\, 15)$ nel 2° quadrante.",
        formula: "\\vec{s} = \\vec{q} - \\vec{p} = (-8 - 12;\\, 10 - (-5)) = (-20;\\, 15)",
        data: [
          { label: "s_x", val: "-20" },
          { label: "s_y", val: "+15" },
          { label: "Vettore opposto -p", val: "(-12; +5,0)" },
          { label: "Quadrante", val: "2° Quadrante (NO)" }
        ],
        tip: "💡 Attenzione ai segni! Fare $10 - (-5)$ diventa $10 + 5 = 15$!"
      },
      {
        badge: "Passo 4 di 5 — Modulo Perfetto",
        title: "Modulo di s: La Terna Pitagorica 15-20-25",
        desc: "Calcoliamo il modulo del vettore differenza $\\vec{s}$ con il Teorema di Pitagora:<br>$$s = \\sqrt{s_x^2 + s_y^2} = \\sqrt{(-20)^2 + 15^2}$$<br>$$s = \\sqrt{400 + 225} = \\sqrt{625} = 25$$<br>Un numero intero perfetto! Noti la proporzione? $15 : 20 : 25 = 3 : 4 : 5$! È ancora una volta la <strong>terna pitagorica fondamentale</strong> moltiplicata per 5!",
        formula: "|\\vec{s}| = \\sqrt{(-20)^2 + 15^2} = \\sqrt{400 + 225} = \\sqrt{625} = 25",
        data: [
          { label: "Cateto |s_x|", val: "20" },
          { label: "Cateto |s_y|", val: "15" },
          { label: "Ipotenusa |s|", val: "25 esatto" },
          { label: "Rapporto terna", val: "5 × (3, 4, 5)" }
        ],
        tip: "🎯 Se riconosci la terna pitagorica $3-4-5$, puoi calcolare il modulo di $\\vec{s}$ a mente in 3 secondi: $5 \\times 5 = 25$!"
      },
      {
        badge: "Passo 5 di 5 — Somma Lineare",
        title: "Passo 3: Vettore Somma t = r + p",
        desc: "Calcoliamo infine il vettore $\\vec{t} = \\vec{r} + \\vec{p}$ sommando le componenti di $\\vec{r}(16, -20)$ e $\\vec{p}(12, -5)$:<br>$$t_x = r_x + p_x = 16 + 12 = +28$$<br>$$t_y = r_y + p_y = -20 + (-5{,}0) = -25$$<br>Otteniamo $\\vec{t} = (28;\\, -25)$ con modulo:<br>$$t = \\sqrt{28^2 + (-25)^2} = \\sqrt{784 + 625} = \\sqrt{1409} \\approx 37{,}5$$<br><strong>Riepilogo finale del problema:</strong><br>• $\\vec{r} = (16;\\, -20)$<br>• $\\vec{s} = (-20;\\, 15)$ con modulo $|\\vec{s}| = 25$<br>• $\\vec{t} = (28;\\, -25)$",
        formula: "\\vec{t} = \\vec{r} + \\vec{p} = (16 + 12;\\, -20 - 5) = (28;\\, -25)",
        data: [
          { label: "t_x", val: "+28" },
          { label: "t_y", val: "-25" },
          { label: "Modulo |t|", val: "√(28² + 25²) ≈ 37,5" },
          { label: "Stato finale", val: "Tutti i passi completati!" }
        ],
        tip: "💡 Con le componenti cartesiane ogni operazione tra vettori si riduce a un'addizione o moltiplicazione tra numeri reali!"
      }
    ];

    let currentStep = 0;

    function updateSimulation(step) {
      const vecR = document.getElementById('vecR');
      const lblR = document.getElementById('lblR');
      const vecMinusP = document.getElementById('vecMinusP');
      const lblMinusP = document.getElementById('lblMinusP');
      const vecS = document.getElementById('vecS');
      const lblS = document.getElementById('lblS');
      const triS = document.getElementById('triS');
      const lblModS = document.getElementById('lblModS');
      const vecT = document.getElementById('vecT');
      const lblT = document.getElementById('lblT');

      // Reset
      vecR.setAttribute('opacity', '0');
      lblR.setAttribute('opacity', '0');
      vecMinusP.setAttribute('opacity', '0');
      lblMinusP.setAttribute('opacity', '0');
      vecS.setAttribute('opacity', '0');
      lblS.setAttribute('opacity', '0');
      triS.setAttribute('opacity', '0');
      lblModS.setAttribute('opacity', '0');
      vecT.setAttribute('opacity', '0');
      lblT.setAttribute('opacity', '0');

      if (step >= 1) {
        vecR.setAttribute('opacity', '1');
        lblR.setAttribute('opacity', '1');
      }
      if (step >= 2) {
        vecMinusP.setAttribute('opacity', '1');
        lblMinusP.setAttribute('opacity', '1');
        vecS.setAttribute('opacity', '1');
        lblS.setAttribute('opacity', '1');
      }
      if (step >= 3) {
        triS.setAttribute('opacity', '1');
        lblModS.setAttribute('opacity', '1');
      }
      if (step >= 4) {
        vecT.setAttribute('opacity', '1');
        lblT.setAttribute('opacity', '1');
      }
    }

    function renderStep() {
      const data = stepsData[currentStep];
      const container = document.getElementById('stepInfo');

      let dataHtml = '';
      data.data.forEach(d => {
        dataHtml += `
          <div class="data-item">
            <div class="data-label">${d.label}</div>
            <div class="data-val">${d.val}</div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="step-badge">${data.badge}</div>
        <h2 class="step-title">${data.title}</h2>
        <div class="step-desc">${data.desc}</div>
        <div class="formula-box">$$${data.formula}$$</div>
        <div class="data-grid">${dataHtml}</div>
        <div class="tip-box">${data.tip}</div>
      `;

      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ]
        });
      }

      // Aggiorna pills
      const pills = document.querySelectorAll('.step-pill');
      pills.forEach((p, idx) => {
        p.classList.remove('active', 'completed');
        if (idx === currentStep) p.classList.add('active');
        else if (idx < currentStep) p.classList.add('completed');
      });

      // Aggiorna pulsanti
      document.getElementById('btnPrev').disabled = (currentStep === 0);
      document.getElementById('btnNext').disabled = (currentStep === stepsData.length - 1);

      updateSimulation(currentStep);
    }

    function goToStep(s) {
      currentStep = s;
      renderStep();
    }

    function nextStep() {
      if (currentStep < stepsData.length - 1) {
        currentStep++;
        renderStep();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    }

    function resetSteps() {
      currentStep = 0;
      renderStep();
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextStep();
      else if (e.key === 'ArrowLeft') prevStep();
    });

    // LIM Drawing logic
    const canvas = document.getElementById('limCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let currentColor = '#38bdf8';
    let currentMode = 'pen';

    function resizeCanvas() {
      const container = document.getElementById('svgContainer');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    const btnPen = document.getElementById('btnPen');
    const btnEraser = document.getElementById('btnEraser');
    const btnClearCanvas = document.getElementById('btnClearCanvas');

    btnPen.addEventListener('click', () => {
      currentMode = 'pen';
      canvas.classList.add('active');
      btnPen.classList.add('active');
      btnEraser.classList.remove('active');
    });

    btnEraser.addEventListener('click', () => {
      currentMode = 'eraser';
      canvas.classList.add('active');
      btnEraser.classList.add('active');
      btnPen.classList.remove('active');
    });

    btnClearCanvas.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    function setColor(col, el) {
      currentColor = col;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
      if (currentMode === 'eraser') {
        currentMode = 'pen';
        btnPen.classList.add('active');
        btnEraser.classList.remove('active');
      }
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
      if (!canvas.classList.contains('active')) return;
      isDrawing = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const p = getPos(e);
      if (currentMode === 'pen') {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      } else {
        ctx.clearRect(p.x - 15, p.y - 15, 30, 30);
      }
    }

    function endDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: true });
    canvas.addEventListener('touchmove', draw, { passive: true });
    canvas.addEventListener('touchend', endDraw);

    // Fullscreen
    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Whiteboard logic
    const wbOverlay = document.getElementById('whiteboardOverlay');
    const wbCanvas = document.getElementById('wbCanvas');
    const wbCtx = wbCanvas.getContext('2d');
    const wbBody = document.getElementById('whiteboardBody');
    let wbDrawing = false;
    let wbMode = 'pen';
    let wbZoom = 1;
    let panX = 0, panY = 0;
    let isPanning = false, startX = 0, startY = 0;

    function resizeWbCanvas() {
      wbCanvas.width = wbBody.clientWidth;
      wbCanvas.height = wbBody.clientHeight;
    }

    document.getElementById('btnWhiteboard').addEventListener('click', () => {
      wbOverlay.classList.add('active');
      resizeWbCanvas();
    });
    document.getElementById('wbClose').addEventListener('click', () => {
      wbOverlay.classList.remove('active');
    });

    document.getElementById('wbPenBtn').addEventListener('click', () => {
      wbMode = 'pen';
      wbBody.style.cursor = 'crosshair';
    });
    document.getElementById('wbEraserBtn').addEventListener('click', () => {
      wbMode = 'eraser';
      wbBody.style.cursor = 'cell';
    });
    const wbHandBtn = document.getElementById('wbHandBtn');
    wbHandBtn.addEventListener('click', () => {
      wbMode = 'pan';
      wbBody.style.cursor = 'grab';
    });

    document.getElementById('wbZoomIn').addEventListener('click', () => {
      wbZoom = Math.min(wbZoom + 0.2, 3);
      applyWbTransform();
    });
    document.getElementById('wbZoomOut').addEventListener('click', () => {
      wbZoom = Math.max(wbZoom - 0.2, 0.5);
      applyWbTransform();
    });
    document.getElementById('wbZoomReset').addEventListener('click', () => {
      wbZoom = 1;
      panX = 0;
      panY = 0;
      applyWbTransform();
    });

    function applyWbTransform() {
      wbCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${wbZoom})`;
      wbBody.style.backgroundPosition = `${panX}px ${panY}px`;
    }

    document.getElementById('wbGridToggle').addEventListener('click', () => {
      if (wbBody.classList.contains('bg-grid')) {
        wbBody.classList.remove('bg-grid');
        wbBody.classList.add('bg-dark');
      } else {
        wbBody.classList.remove('bg-dark');
        wbBody.classList.add('bg-grid');
      }
    });

    document.getElementById('wbClear').addEventListener('click', () => {
      wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height);
    });

    wbCanvas.addEventListener('mousedown', (e) => {
      if (wbMode === 'pan') {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        wbBody.style.cursor = 'grabbing';
      } else {
        wbDrawing = true;
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        wbCtx.beginPath();
        wbCtx.moveTo(x, y);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyWbTransform();
      } else if (wbDrawing) {
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        if (wbMode === 'pen') {
          wbCtx.strokeStyle = '#0284c7';
          wbCtx.lineWidth = 3;
          wbCtx.lineCap = 'round';
          wbCtx.lineTo(x, y);
          wbCtx.stroke();
        } else if (wbMode === 'eraser') {
          wbCtx.clearRect(x - 20, y - 20, 40, 40);
        }
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      wbDrawing = false;
      if (wbMode === 'pan') wbBody.style.cursor = 'grab';
    });

    // Avvio iniziale
    renderStep();
  </script>
</body>
</html>
