<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esercizio Guidato LIM — Tiro alla Fune (Es. 44) — ISS Giordano Bruno</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body);"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      background: linear-gradient(135deg, #ef4444, #f87171);
      color: #0f172a;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.25rem;
    }
    .brand-text h1 { font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
    .brand-text p { font-size: 0.8rem; color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      user-select: none;
    }
    .btn:hover { background: #273549; border-color: var(--accent-blue); }
    .btn-primary { background: #0284c7; border-color: #38bdf8; }
    .btn-primary:hover { background: #0369a1; }
    .btn-amber { background: #b45309; border-color: #fbbf24; }
    .btn-amber:hover { background: #92400e; }

    main {
      flex: 1;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.25rem;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .simulation-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 580px;
    }

    .svg-container {
      width: 100%;
      flex: 1;
      min-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      max-height: 480px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      user-select: none;
    }

    .controls-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .step-pills { display: flex; gap: 0.35rem; }
    .step-pill {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .step-pill.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
      transform: scale(1.1);
    }
    .step-pill.completed {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .details-card {
      overflow-y: auto;
      max-height: 80vh;
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) transparent;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
    }

    .step-title {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    .step-desc {
      font-size: 0.98rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .formula-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent-amber);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.25rem;
      font-size: 1.15rem;
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .data-item {
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .data-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .data-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .tip-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-left: 4px solid var(--accent-green);
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 0.9rem;
      color: #86efac;
      margin-top: auto;
    }

    /* LIM Canvas Overlay */
    #limCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 90;
      pointer-events: none;
    }
    #limCanvas.active { pointer-events: auto; cursor: crosshair; }

    /* LIM Floating Toolbar */
    .lim-toolbar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 0.4rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: #334155; }
    .tool-btn.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: #bae6fd;
    }
    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-dot.active { border-color: white; transform: scale(1.15); }

    /* Whiteboard Modal */
    .whiteboard-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .whiteboard-overlay.active { display: flex; }
    .wb-header {
      padding: 0.6rem 1.25rem;
      background: #1e293b;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      white-space: nowrap;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .wb-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }
    .wb-body.bg-grid {
      background-color: #ffffff;
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      background-size: 25px 25px;
    }
    .wb-body.bg-dark {
      background-color: #0f172a;
      background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px);
      background-size: 25px 25px;
    }
    #wbCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🪢</div>
      <div class="brand-text">
        <h1>Esercizio 44 — Pag. 111</h1>
        <p>Gara di Tiro alla Fune: Somma di Forze Parallele e Versi Opposti</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-amber" id="btnWhiteboard">
        <span>📄</span> Foglio Bianco LIM
      </button>
      <button class="btn" id="btnFullscreen">
        <span>⛶</span> Schermo Intero
      </button>
      <a href="/fisica/giordano-bruno/" class="btn">
        <span>↩</span> Indice Esercizi
      </a>
    </div>
  </header>

  <main>
    <!-- Card Grafica / Simulazione -->
    <div class="card simulation-card">
      <div class="svg-container" id="svgContainer">
        <canvas id="limCanvas"></canvas>
        <svg id="simSvg" viewBox="-25 -15 50 30">
          <defs>
            <marker id="arrowLeft" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto">
              <path d="M6,0 L6,6 L0,3 z" fill="#38bdf8" />
            </marker>
            <marker id="arrowRight" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#4ade80" />
            </marker>
            <marker id="arrowRes" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto">
              <path d="M6,0 L6,6 L0,3 z" fill="#f87171" />
            </marker>
            <pattern id="gridTiro" width="5" height="5" patternUnits="userSpaceOnUse">
              <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#1e293b" stroke-width="0.15" />
            </pattern>
          </defs>

          <!-- Griglia di sfondo -->
          <rect x="-24" y="-14" width="48" height="28" fill="url(#gridTiro)" />

          <!-- Linea del terreno di gara -->
          <line x1="-24" y1="9" x2="24" y2="9" stroke="#334155" stroke-width="0.4" />
          <line x1="0" y1="7" x2="0" y2="11" stroke="#f87171" stroke-width="0.3" stroke-dasharray="0.4,0.4" />
          <text x="0" y="12.5" fill="#f87171" font-size="1.1" font-weight="700" text-anchor="middle">Linea di Mezzo (O)</text>

          <!-- Asse orientato x verso destra -->
          <line x1="-22" y1="-11" x2="22" y2="-11" stroke="#64748b" stroke-width="0.25" />
          <polygon points="22,-11 20.8,-11.5 20.8,-10.5" fill="#64748b" />
          <text x="22.5" y="-10.5" fill="#94a3b8" font-size="1.3" font-weight="700">+x (Destra)</text>
          <text x="-22.5" y="-10.5" fill="#94a3b8" font-size="1.3" font-weight="700" text-anchor="end">-x (Sinistra)</text>

          <!-- La fune da tiro centrale -->
          <rect id="rope" x="-20" y="3.5" width="40" height="0.8" rx="0.4" fill="#d97706" stroke="#b45309" stroke-width="0.1" />

          <!-- Nastrino rosso centrale testimone di gara (spostabile) -->
          <g id="ribbonGroup" transform="translate(0, 0)">
            <rect x="-0.3" y="2.5" width="0.6" height="2.8" fill="#ef4444" rx="0.15" />
            <polygon points="0,2.5 -0.8,1.2 0.8,1.2" fill="#ef4444" />
          </g>

          <!-- SQUADRA SINISTRA: Paola, Carlo, Marco -->
          <g id="teamLeft" opacity="1">
            <circle cx="-16" cy="1.5" r="1.1" fill="#38bdf8" />
            <text x="-16" y="-0.2" fill="#38bdf8" font-size="1.1" font-weight="700" text-anchor="middle">Paola (560 N)</text>

            <circle cx="-11" cy="1.5" r="1.1" fill="#38bdf8" />
            <text x="-11" y="-0.2" fill="#38bdf8" font-size="1.1" font-weight="700" text-anchor="middle">Carlo (480 N)</text>

            <circle cx="-6" cy="1.5" r="1.1" fill="#38bdf8" />
            <text x="-6" y="-0.2" fill="#38bdf8" font-size="1.1" font-weight="700" text-anchor="middle">Marco (600 N)</text>
          </g>

          <!-- SQUADRA DESTRA: Franco, Alessandra, Matteo -->
          <g id="teamRight" opacity="1">
            <circle cx="6" cy="1.5" r="1.1" fill="#4ade80" />
            <text x="6" y="-0.2" fill="#4ade80" font-size="1.1" font-weight="700" text-anchor="middle">Franco (550 N)</text>

            <circle cx="11" cy="1.5" r="1.1" fill="#4ade80" />
            <text x="11" y="-0.2" fill="#4ade80" font-size="1.1" font-weight="700" text-anchor="middle">Alessandra (430 N)</text>

            <circle cx="16" cy="1.5" r="1.1" fill="#4ade80" />
            <text x="16" y="-0.2" fill="#4ade80" font-size="1.1" font-weight="700" text-anchor="middle">Matteo (580 N)</text>
          </g>

          <!-- VETTORE TOTALE SINISTRA (Step 2+) -->
          <g id="grpVecLeft" opacity="0">
            <line x1="0" y1="-3.5" x2="-16.4" y2="-3.5" stroke="#38bdf8" stroke-width="0.8" marker-end="url(#arrowLeft)" />
            <text x="-8.5" y="-4.6" fill="#38bdf8" font-size="1.4" font-weight="800" text-anchor="middle">F_sx = 1640 N (←)</text>
          </g>

          <!-- VETTORE TOTALE DESTRA (Step 3+) -->
          <g id="grpVecRight" opacity="0">
            <line x1="0" y1="-6.5" x2="15.6" y2="-6.5" stroke="#4ade80" stroke-width="0.8" marker-end="url(#arrowRight)" />
            <text x="8" y="-7.6" fill="#4ade80" font-size="1.4" font-weight="800" text-anchor="middle">F_dx = 1560 N (→)</text>
          </g>

          <!-- VETTORE RISULTANTE FINALE (Step 4 & 5) -->
          <g id="grpVecRes" opacity="0">
            <line x1="0" y1="6" x2="-4" y2="6" stroke="#f87171" stroke-width="1.2" marker-end="url(#arrowRes)" />
            <text x="-2" y="7.8" fill="#f87171" font-size="1.5" font-weight="900" text-anchor="middle">F_ris = 80 N verso SINISTRA</text>
          </g>
        </svg>
      </div>

      <!-- Barra di controllo -->
      <div class="controls-bar">
        <div class="step-pills">
          <div class="step-pill active" onclick="goToStep(0)">1</div>
          <div class="step-pill" onclick="goToStep(1)">2</div>
          <div class="step-pill" onclick="goToStep(2)">3</div>
          <div class="step-pill" onclick="goToStep(3)">4</div>
          <div class="step-pill" onclick="goToStep(4)">5</div>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn" id="btnPrev" onclick="prevStep()">⏮ Prec</button>
          <button class="btn btn-primary" id="btnNext" onclick="nextStep()">Succ ⏭</button>
          <button class="btn" onclick="resetSteps()">🔄 Riavvia</button>
        </div>
      </div>
    </div>

    <!-- Card Dettagli Didattici -->
    <div class="card details-card">
      <div id="stepInfo">
        <!-- Generato dinamicamente da JS -->
      </div>
    </div>
  </main>

  <!-- LIM Floating Toolbar -->
  <div class="lim-toolbar">
    <button class="tool-btn" id="btnPen" title="Attiva/Disattiva Penna LIM">✏️</button>
    <button class="tool-btn" id="btnEraser" title="Gomma">🧹</button>
    <div class="color-dot active" style="background: #38bdf8;" onclick="setColor('#38bdf8', this)"></div>
    <div class="color-dot" style="background: #4ade80;" onclick="setColor('#4ade80', this)"></div>
    <div class="color-dot" style="background: #fbbf24;" onclick="setColor('#fbbf24', this)"></div>
    <div class="color-dot" style="background: #f87171;" onclick="setColor('#f87171', this)"></div>
    <button class="tool-btn" id="btnClearCanvas" title="Cancella Scritte">🗑️</button>
  </div>

  <!-- Whiteboard Overlay Modal -->
  <div class="whiteboard-overlay" id="whiteboardOverlay">
    <div class="wb-header">
      <div style="font-weight: 700; color: #f8fafc; display:flex; align-items:center; gap:0.5rem;">
        <span>📄</span> Foglio Bianco LIM — Spazio Libero
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <button class="btn" id="wbPenBtn">✏️ Penna</button>
        <button class="btn" id="wbEraserBtn">🧹 Gomma</button>
        <button class="btn" id="wbHandBtn" title="Trascina foglio">🖐️</button>
        <button class="btn" id="wbZoomIn">🔍+</button>
        <button class="btn" id="wbZoomOut">🔍-</button>
        <button class="btn" id="wbZoomReset">100%</button>
        <button class="btn" id="wbGridToggle">Griglia / Sfondo</button>
        <button class="btn" id="wbClear">🗑️ Svuota</button>
        <button class="btn btn-amber" id="wbClose">✕ Chiudi</button>
      </div>
    </div>
    <div class="wb-body bg-grid" id="whiteboardBody">
      <canvas id="wbCanvas"></canvas>
    </div>
  </div>

  <script>
    const stepsData = [
      {
        badge: "Passo 1 di 5 — Analisi della Gara",
        title: "Due Squadre & Forze Parallele sulla Fune",
        desc: "In una gara di tiro alla fune tutte le forze agiscono lungo la <strong>stessa retta d'azione</strong> (la linea della corda), ma in versi opposti:<br>• <strong>Squadra di Sinistra:</strong> Paola ($560\\text{ N}$), Carlo ($480\\text{ N}$) e Marco ($600\\text{ N}$).<br>• <strong>Squadra di Destra:</strong> Franco ($550\\text{ N}$), Alessandra ($430\\text{ N}$) e Matteo ($580\\text{ N}$).<br><br>Fissiamo un asse cartesiano $x$ orizzontale orientato verso destra (+).",
        formula: "\\vec{F}_{\\text{tot}} = \\sum \\vec{F}_{\\text{atleti}} = \\vec{F}_{\\text{sx}} + \\vec{F}_{\\text{dx}}",
        data: [
          { label: "Atleti Sinistra", val: "3 (Paola, Carlo, Marco)" },
          { label: "Atleti Destra", val: "3 (Franco, Alessandra, Matteo)" },
          { label: "Direzione", val: "Unidimensionale (Orizzontale)" },
          { label: "Obiettivo", val: "Forza Risultante & Vincitore" }
        ],
        tip: "💡 Quando i vettori giacciono sulla stessa retta, la somma vettoriale si trasforma in una semplicissima addizione algebrica con segno!"
      },
      {
        badge: "Passo 2 di 5 — Risultante di Sinistra",
        title: "Somma delle Forze Concordi a Sinistra",
        desc: "I tre atleti a sinistra tirano tutti nello stesso verso (verso sinistra, cioè concordi tra loro). La forza totale esercitata dalla squadra di sinistra è la somma delle tre singole intensità:<br>$$F_{\\text{sx}} = 560\\text{ N} + 480\\text{ N} + 600\\text{ N} = 1640\\text{ N}$$<br>Avendo scelto il verso positivo verso destra, la componente algebrica è $F_{x,\\text{sx}} = -1640\\text{ N}$.",
        formula: "F_{\\text{sx}} = 560 + 480 + 600 = 1640\\text{ N} \\quad (\\text{verso sinistra})",
        data: [
          { label: "Paola", val: "560 N" },
          { label: "Carlo", val: "480 N" },
          { label: "Marco", val: "600 N" },
          { label: "Totale Squadra SX", val: "1640 N verso sinistra" }
        ],
        tip: "💡 Vettori con stessa direzione e stesso verso si sommano direttamente sommando i loro moduli!"
      },
      {
        badge: "Passo 3 di 5 — Risultante di Destra",
        title: "Somma delle Forze Concordi a Destra",
        desc: "Allo stesso modo, i tre atleti a destra tirano tutti concordemente verso destra:<br>$$F_{\\text{dx}} = 550\\text{ N} + 430\\text{ N} + 580\\text{ N} = 1560\\text{ N}$$<br>La componente algebrica lungo l'asse $x$ è $F_{x,\\text{dx}} = +1560\\text{ N}$.<br><br>Confrontando i due totali: $1640\\text{ N}$ a sinistra contro $1560\\text{ N}$ a destra. Chi vince?",
        formula: "F_{\\text{dx}} = 550 + 430 + 580 = 1560\\text{ N} \\quad (\\text{verso destra})",
        data: [
          { label: "Franco", val: "550 N" },
          { label: "Alessandra", val: "430 N" },
          { label: "Matteo", val: "580 N" },
          { label: "Totale Squadra DX", val: "1560 N verso destra" }
        ],
        tip: "💡 Nota che ciascun atleta contribuisce ad aumentare la forza complessiva della propria squadra, esattamente come molle in parallelo."
      },
      {
        badge: "Passo 4 di 5 — Calcolo della Forza Risultante",
        title: "Composizione tra Forze Discordi",
        desc: "Poiché le due squadre tirano in <strong>versi opposti</strong>, la forza risultante finale si ottiene dalla loro differenza:<br>$$F_{\\text{ris}} = F_{\\text{sx}} - F_{\\text{dx}} = 1640\\text{ N} - 1560\\text{ N} = 80\\text{ N}$$<br>Algebricamente:<br>$$F_x = F_{x,\\text{dx}} + F_{x,\\text{sx}} = +1560\\text{ N} - 1640\\text{ N} = -80\\text{ N}$$<br>La forza risultante ha un'intensità di <strong>$80\\text{ N}$</strong> ed è orientata verso <strong>SINISTRA</strong>.",
        formula: "F_{\\text{ris}} = 1640\\text{ N} - 1560\\text{ N} = 80\\text{ N} \\quad (\\text{verso sinistra})",
        data: [
          { label: "Spinta a Sinistra", val: "1640 N" },
          { label: "Spinta a Destra", val: "1560 N" },
          { label: "Differenza Netta", val: "80 N" },
          { label: "Verso della Risultante", val: "Verso Sinistra (←)" }
        ],
        tip: "💡 Se le due squadre avessero sviluppato la stessa identica forza ($1600\\text{ N}$ e $1600\\text{ N}$), la risultante sarebbe stata zero e la corda sarebbe rimasta immobile in equilibrio!"
      },
      {
        badge: "Passo 5 di 5 — Verdetto & Spostamento della Corda",
        title: "Vittoria della Squadra di Sinistra!",
        desc: "La presenza di una forza risultante sbilanciata non nulla ($F_{\\text{ris}} = 80\\text{ N}$ verso sinistra) determina un'accelerazione della corda e degli atleti verso sinistra:<br>• Il nastro rosso testimone centrale si sposta oltre la linea di mezzeria verso sinistra.<br>• La <strong>Squadra di Sinistra vince la gara</strong>!<br><br><strong>Riepilogo finale del problema:</strong><br>• Direzione: orizzontale (lungo la fune)<br>• Intensità: <strong>$80\\text{ N}$</strong><br>• Verso: <strong>verso sinistra</strong>",
        formula: "\\vec{F}_{\\text{ris}} = 80\\text{ N} \\quad [\\text{Orizzontale, verso sinistra}]",
        data: [
          { label: "Intensità Risultante", val: "80 N" },
          { label: "Direzione", val: "Orizzontale" },
          { label: "Verso", val: "Verso Sinistra" },
          { label: "Esito", val: "Vince la Squadra SX!" }
        ],
        tip: "🎯 Problema risolto! Concetto fondamentale: un corpo subisce una variazione del suo moto solo se la risultante totale delle forze applicate è diversa da zero."
      }
    ];

    let currentStep = 0;

    function updateSimulation(step) {
      const grpVecLeft = document.getElementById('grpVecLeft');
      const grpVecRight = document.getElementById('grpVecRight');
      const grpVecRes = document.getElementById('grpVecRes');
      const ribbonGroup = document.getElementById('ribbonGroup');
      const rope = document.getElementById('rope');

      // Reset
      grpVecLeft.setAttribute('opacity', '0');
      grpVecRight.setAttribute('opacity', '0');
      grpVecRes.setAttribute('opacity', '0');
      ribbonGroup.setAttribute('transform', 'translate(0, 0)');
      rope.setAttribute('x', '-20');

      if (step >= 1) {
        grpVecLeft.setAttribute('opacity', '1');
      }
      if (step >= 2) {
        grpVecRight.setAttribute('opacity', '1');
      }
      if (step >= 3) {
        grpVecRes.setAttribute('opacity', '1');
      }
      if (step >= 4) {
        // Spostamento della fune e del nastro a sinistra di 3.5 unità
        ribbonGroup.setAttribute('transform', 'translate(-3.5, 0)');
        rope.setAttribute('x', '-23.5');
      }
    }

    function renderStep() {
      const data = stepsData[currentStep];
      const container = document.getElementById('stepInfo');

      let dataHtml = '';
      data.data.forEach(d => {
        dataHtml += `
          <div class="data-item">
            <div class="data-label">${d.label}</div>
            <div class="data-val">${d.val}</div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="step-badge">${data.badge}</div>
        <h2 class="step-title">${data.title}</h2>
        <div class="step-desc">${data.desc}</div>
        <div class="formula-box">$$${data.formula}$$</div>
        <div class="data-grid">${dataHtml}</div>
        <div class="tip-box">${data.tip}</div>
      `;

      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ]
        });
      }

      // Aggiorna pills
      const pills = document.querySelectorAll('.step-pill');
      pills.forEach((p, idx) => {
        p.classList.remove('active', 'completed');
        if (idx === currentStep) p.classList.add('active');
        else if (idx < currentStep) p.classList.add('completed');
      });

      // Aggiorna pulsanti
      document.getElementById('btnPrev').disabled = (currentStep === 0);
      document.getElementById('btnNext').disabled = (currentStep === stepsData.length - 1);

      updateSimulation(currentStep);
    }

    function goToStep(s) {
      currentStep = s;
      renderStep();
    }

    function nextStep() {
      if (currentStep < stepsData.length - 1) {
        currentStep++;
        renderStep();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    }

    function resetSteps() {
      currentStep = 0;
      renderStep();
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextStep();
      else if (e.key === 'ArrowLeft') prevStep();
    });

    // LIM Drawing logic
    const canvas = document.getElementById('limCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let currentColor = '#38bdf8';
    let currentMode = 'pen';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    const btnPen = document.getElementById('btnPen');
    const btnEraser = document.getElementById('btnEraser');
    const btnClearCanvas = document.getElementById('btnClearCanvas');

    btnPen.addEventListener('click', () => {
      if (canvas.classList.contains('active') && currentMode === 'pen') {
        canvas.classList.remove('active');
        btnPen.classList.remove('active');
      } else {
        currentMode = 'pen';
        canvas.classList.add('active');
        btnPen.classList.add('active');
        btnEraser.classList.remove('active');
      }
    });

    btnEraser.addEventListener('click', () => {
      if (canvas.classList.contains('active') && currentMode === 'eraser') {
        canvas.classList.remove('active');
        btnEraser.classList.remove('active');
      } else {
        currentMode = 'eraser';
        canvas.classList.add('active');
        btnEraser.classList.add('active');
        btnPen.classList.remove('active');
      }
    });

    btnClearCanvas.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    function setColor(col, el) {
      currentColor = col;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
      currentMode = 'pen';
      canvas.classList.add('active');
      btnPen.classList.add('active');
      btnEraser.classList.remove('active');
    }

    function getPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX, y: clientY };
    }

    function startDraw(e) {
      if (!canvas.classList.contains('active')) return;
      isDrawing = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const p = getPos(e);
      if (currentMode === 'pen') {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      } else {
        ctx.clearRect(p.x - 15, p.y - 15, 30, 30);
      }
    }

    function endDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: true });
    canvas.addEventListener('touchmove', draw, { passive: true });
    canvas.addEventListener('touchend', endDraw);

    // Fullscreen
    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Whiteboard logic
    const wbOverlay = document.getElementById('whiteboardOverlay');
    const wbCanvas = document.getElementById('wbCanvas');
    const wbCtx = wbCanvas.getContext('2d');
    const wbBody = document.getElementById('whiteboardBody');
    let wbDrawing = false;
    let wbMode = 'pen';
    let wbZoom = 1;
    let panX = 0, panY = 0;
    let isPanning = false, startX = 0, startY = 0;

    function resizeWbCanvas() {
      wbCanvas.width = wbBody.clientWidth;
      wbCanvas.height = wbBody.clientHeight;
    }

    document.getElementById('btnWhiteboard').addEventListener('click', () => {
      wbOverlay.classList.add('active');
      resizeWbCanvas();
    });
    document.getElementById('wbClose').addEventListener('click', () => {
      wbOverlay.classList.remove('active');
    });

    document.getElementById('wbPenBtn').addEventListener('click', () => {
      wbMode = 'pen';
      wbBody.style.cursor = 'crosshair';
    });
    document.getElementById('wbEraserBtn').addEventListener('click', () => {
      wbMode = 'eraser';
      wbBody.style.cursor = 'cell';
    });
    const wbHandBtn = document.getElementById('wbHandBtn');
    wbHandBtn.addEventListener('click', () => {
      wbMode = 'pan';
      wbBody.style.cursor = 'grab';
    });

    document.getElementById('wbZoomIn').addEventListener('click', () => {
      wbZoom = Math.min(wbZoom + 0.2, 3);
      applyWbTransform();
    });
    document.getElementById('wbZoomOut').addEventListener('click', () => {
      wbZoom = Math.max(wbZoom - 0.2, 0.5);
      applyWbTransform();
    });
    document.getElementById('wbZoomReset').addEventListener('click', () => {
      wbZoom = 1;
      panX = 0;
      panY = 0;
      applyWbTransform();
    });

    function applyWbTransform() {
      wbCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${wbZoom})`;
      wbBody.style.backgroundPosition = `${panX}px ${panY}px`;
    }

    document.getElementById('wbGridToggle').addEventListener('click', () => {
      if (wbBody.classList.contains('bg-grid')) {
        wbBody.classList.remove('bg-grid');
        wbBody.classList.add('bg-dark');
      } else {
        wbBody.classList.remove('bg-dark');
        wbBody.classList.add('bg-grid');
      }
    });

    document.getElementById('wbClear').addEventListener('click', () => {
      wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height);
    });

    wbCanvas.addEventListener('mousedown', (e) => {
      if (wbMode === 'pan') {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        wbBody.style.cursor = 'grabbing';
      } else {
        wbDrawing = true;
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        wbCtx.beginPath();
        wbCtx.moveTo(x, y);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyWbTransform();
      } else if (wbDrawing) {
        const rect = wbCanvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / wbZoom;
        const y = (e.clientY - rect.top) / wbZoom;
        if (wbMode === 'pen') {
          wbCtx.strokeStyle = '#0284c7';
          wbCtx.lineWidth = 3;
          wbCtx.lineCap = 'round';
          wbCtx.lineTo(x, y);
          wbCtx.stroke();
        } else if (wbMode === 'eraser') {
          wbCtx.clearRect(x - 20, y - 20, 40, 40);
        }
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      wbDrawing = false;
      if (wbMode === 'pan') wbBody.style.cursor = 'grab';
    });

    // Avvio iniziale
    renderStep();
  </script>
</body>
</html>
