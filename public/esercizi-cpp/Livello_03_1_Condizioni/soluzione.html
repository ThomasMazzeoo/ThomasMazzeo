<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soluzione - Livello 3.1: Monitor Reattore</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600&family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b14;
    --panel: #0d1424;
    --cyan: #00d4ff;
    --green: #00ff88;
    --red: #ff4466;
    --orange: #ff8c00;
    --purple: #bb44ff;
    --yellow: #ffd700;
    --white: #e8f0ff;
    --font-title: 'Orbitron', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-body: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg);
    color: var(--white);
    font-family: var(--font-body);
    height: 100vh; height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-image: 
      linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
    background-size: 30px 30px;
  }

  header {
    background-color: #04070d;
    border-bottom: 1px solid rgba(0, 212, 255, 0.2);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    z-index: 10;
  }
  header h1 {
    font-family: var(--font-title);
    color: var(--cyan);
    margin: 0;
    font-size: 1.4rem;
    text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
  }
  .step-counter {
    font-family: var(--font-mono);
    color: var(--orange);
    font-size: 1.2rem;
    background: rgba(255, 140, 0, 0.1);
    padding: 0.3rem 0.8rem;
    border-radius: 4px;
    border: 1px solid rgba(255, 140, 0, 0.3);
  }

  .phase-bar {
    background-color: var(--panel);
    border-bottom: 1px solid rgba(0, 212, 255, 0.1);
    padding: 0.5rem 2rem;
    display: flex;
    gap: 2rem;
    font-family: var(--font-mono);
    font-size: 0.9rem;
    z-index: 9;
  }
  .phase-name { color: var(--purple); font-weight: bold; }
  .phase-state { color: var(--yellow); }
  .phase-action { color: var(--green); }

  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .vis-panel {
    flex: 1;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    overflow-y: auto;
    border-right: 1px solid rgba(0, 212, 255, 0.1);
  }

  .code-container {
    background-color: #03050a;
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 8px;
    padding: 1rem;
    font-family: var(--font-mono);
    font-size: 1.05rem;
    line-height: 1.7;
  }

  .code-line {
    display: flex;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    transition: all 0.3s;
    border-left: 3px solid transparent;
  }
  .code-line .line-num { color: #445577; width: 30px; user-select: none; }
  .code-line .line-content { color: #a0b0c0; transition: color 0.3s; }
  .code-line.active {
    background-color: rgba(0, 212, 255, 0.1);
    border-left: 3px solid var(--cyan);
    box-shadow: inset 0 0 15px rgba(0, 212, 255, 0.05);
  }
  .code-line.active .line-content {
    color: var(--white);
    text-shadow: 0 0 5px rgba(255,255,255,0.5);
  }

  .system-stats {
    display: flex;
    gap: 1rem;
  }

  .logic-container {
    flex: 1;
    background-color: #000;
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 8px;
    padding: 1.5rem;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.8) inset;
    min-height: 100px;
  }
  .logic-container::before {
    content: "ALU (CONFRONTO CONDIZIONALE)";
    position: absolute;
    top: -10px;
    left: 20px;
    background-color: var(--bg);
    padding: 0 10px;
    font-size: 0.8rem;
    color: var(--yellow);
    font-family: var(--font-mono);
  }

  .logic-box {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    font-family: var(--font-mono);
    font-size: 1.3rem;
    transition: all 0.3s;
  }
  .logic-var { padding: 0.4rem 0.8rem; border: 2px solid var(--cyan); border-radius: 6px; color: var(--cyan); background: rgba(0, 212, 255, 0.1); }
  .logic-op { color: var(--yellow); font-weight: bold; }
  .logic-const { padding: 0.4rem 0.8rem; border: 2px solid #556; border-radius: 6px; color: #a0b0c0; }
  .logic-result { 
    margin-left: 1.5rem; padding: 0.4rem 1.2rem; font-weight: bold; border-radius: 6px; text-transform: uppercase;
    transition: all 0.5s;
    opacity: 0.2;
    border: 2px solid #334;
  }
  .logic-result.true { opacity: 1; background: rgba(0, 255, 136, 0.2); border-color: var(--green); color: var(--green); box-shadow: 0 0 20px var(--green); }
  .logic-result.false { opacity: 1; background: rgba(255, 68, 102, 0.2); border-color: var(--red); color: var(--red); box-shadow: 0 0 20px var(--red); }

  .ram-container {
    background-color: #000;
    border: 1px solid rgba(187, 68, 255, 0.3);
    border-radius: 8px;
    padding: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 0 15px rgba(0,0,0,0.8) inset;
    width: 180px;
  }
  .ram-container::before {
    content: "RAM"; position: absolute; top: -10px; left: 20px; background-color: var(--bg); padding: 0 10px; font-size: 0.8rem; color: var(--purple); font-family: var(--font-mono);
  }
  .ram-cell {
    border: 2px solid var(--cyan); border-radius: 6px; width: 120px; background-color: #0a0d16;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
    transition: all 0.3s ease;
  }
  .ram-cell.just-written {
    animation: writeCell 0.5s ease-out;
    border-color: var(--green);
    box-shadow: 0 0 20px var(--green);
  }
  .ram-name { font-family: var(--font-mono); color: var(--cyan); padding: 5px 0; font-size: 0.9rem; border-bottom: 1px solid #334; width: 100%; text-align: center; }
  .ram-value { font-family: var(--font-mono); color: var(--green); padding: 8px 0; font-size: 1.4rem; font-weight: bold; }

  @keyframes writeCell {
    0% { transform: scale(1.1); background-color: rgba(0, 255, 136, 0.2); }
    100% { transform: scale(1); background-color: #0a0d16; }
  }

  .terminal-container {
    background-color: #000;
    border: 1px solid rgba(0, 255, 136, 0.3);
    border-radius: 8px;
    min-height: 120px;
    padding: 1rem;
    font-family: var(--font-mono);
    color: var(--green);
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.8) inset;
    white-space: pre-wrap;
  }
  .terminal-container::before {
    content: "TERMINALE";
    position: absolute;
    top: -10px;
    left: 20px;
    background-color: var(--bg);
    padding: 0 10px;
    font-size: 0.8rem;
    color: var(--green);
  }
  .term-input { color: var(--yellow); font-weight: bold; }

  .exp-panel {
    width: 380px;
    background-color: var(--panel);
    padding: 2rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .exp-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 1rem;
    animation: fadeSlide 0.4s ease-out forwards;
  }
  
  .exp-card.card-what { border-top: 3px solid var(--cyan); }
  .exp-card.card-why { border-top: 3px solid var(--yellow); }
  .exp-card.card-logic { border-top: 3px solid var(--purple); }
  .exp-card.card-alert { border-top: 3px solid var(--red); }

  .exp-card-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-title);
    font-size: 0.9rem;
    margin-bottom: 0.8rem;
    letter-spacing: 1px;
  }
  .card-what .exp-card-header { color: var(--cyan); }
  .card-why .exp-card-header { color: var(--yellow); }
  .card-logic .exp-card-header { color: var(--purple); }
  .card-alert .exp-card-header { color: var(--red); }

  .exp-card-body {
    font-size: 0.95rem;
    line-height: 1.5;
    color: #ccd6f6;
  }

  .keyword { color: var(--orange); font-family: var(--font-mono); }
  .val-highlight { color: var(--green); font-weight: bold; font-family: var(--font-mono); }

  .controls {
    background-color: #04070d;
    border-top: 1px solid rgba(0, 212, 255, 0.2);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  .btn {
    background: transparent;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: var(--font-title);
    padding: 0.5rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    font-size: 0.9rem;
  }
  .btn:hover:not(:disabled) {
    background: rgba(0, 212, 255, 0.1);
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
  }
  .btn:disabled {
    border-color: #334;
    color: #556;
    cursor: not-allowed;
  }
  .btn.btn-play { border-color: var(--green); color: var(--green); }
  .btn.btn-play:hover:not(:disabled) { background: rgba(0, 255, 136, 0.1); box-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }

  .progress-container { display: flex; gap: 8px; align-items: center; }
  .pip { width: 12px; height: 12px; border-radius: 50%; background: #334; cursor: pointer; transition: all 0.3s; }
  .pip.done { background: rgba(0, 255, 136, 0.4); }
  .pip.active { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); transform: scale(1.2); }

  .speed-control { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 0.8rem; color: #889; }

  @media (max-width: 900px) {
    main { flex-direction: column; overflow-y: auto; }
    .exp-panel { width: 100%; border-top: 1px solid rgba(0, 212, 255, 0.2); }
    .vis-panel { overflow: visible; }
    .controls { flex-wrap: wrap; justify-content: center; gap: 10px; padding: 1rem; }
    .progress-container { order: -1; width: 100%; justify-content: center; margin-bottom: 10px; }
    .speed-control { width: 100%; justify-content: center; margin: 5px 0; }
    .btn { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
  }
</style>
</head>
<body>

  <header>
    <h1>&lt; SIMULATORE C++ /&gt; Livello 3.1: Monitor Reattore</h1>
    <div class="step-counter" id="step-counter">STEP 0 / X</div>
  </header>

  <div class="phase-bar">
    <div class="phase-name" id="phase-name">INTRO</div>
    <div class="phase-state" id="phase-state">Pronto</div>
    <div class="phase-action" id="phase-action">...</div>
  </div>

  <main>
    <div class="vis-panel">
      <div class="code-container" id="code-container"></div>
      
      <div class="system-stats">
        <div class="ram-container">
          <div class="ram-cell" id="ram-temp-box"><div class="ram-name">temperatura</div><div class="ram-value" id="ram-temp-val">?</div></div>
        </div>
        
        <div class="logic-container">
          <div class="logic-box" id="logic-box" style="opacity: 0.3;">
            <div class="logic-var" id="log-var">?</div>
            <div class="logic-op" id="log-op">&gt;</div>
            <div class="logic-const" id="log-const">100</div>
            <div class="logic-result" id="log-res">???</div>
          </div>
        </div>
      </div>
      
      <div class="terminal-container" id="terminal-container">
        <span id="terminal-output"></span>
        <span class="cursor" style="animation: blink 1s step-end infinite; color: var(--green);">_</span>
      </div>
    </div>

    <div class="exp-panel" id="exp-panel"></div>
  </main>

  <div class="controls">
    <button class="btn" id="btn-prev" onclick="changeStep(-1)">◀ INDIETRO</button>
    <button class="btn" id="btn-reset" onclick="goToStep(0)">↺ RESET</button>
    <div class="progress-container" id="progress-container"></div>
    <div class="speed-control">
      Lento <input type="range" id="speed-slider" min="1" max="5" value="3"> Veloce
    </div>
    <button class="btn btn-play" id="btn-auto" onclick="toggleAuto()">▶ AUTO</button>
    <button class="btn" id="btn-next" onclick="changeStep(1)">AVANTI ▶</button>
  </div>

<script>
const codeLines = [
  "#include &lt;iostream&gt;",
  "",
  "int main() {",
  "    int temperatura;",
  "    std::cout << \"Temperatura reattore (°C): \";",
  "    std::cin >> temperatura;",
  "",
  "    if (temperatura > 100) {",
  "        std::cout << \"ALLARME: Sovraccarico termico!\\n\";",
  "    } else if (temperatura < 20) {",
  "        std::cout << \"ATTENZIONE: Temperatura insufficiente!\\n\";",
  "    } else {",
  "        std::cout << \"STATO NORMALE: Reattore stabile.\\n\";",
  "    }",
  "",
  "    return 0;",
  "}"
];

const steps = [
  {
    phase: "STEP 0 — INTRO",
    state: "Inizio",
    action: "Teoria If-Else If-Else",
    codeLine: -1,
    ram: "?",
    logicActive: false,
    terminal: "",
    explain: [
      { type: "what", icon: "🔍", label: "COSA SUCCEDE", html: "Simuliamo una decisione a 3 rami (Sovraccarico, Bassa, Stabile) in base alla temperatura inserita." }
    ]
  },
  {
    phase: "STEP 1 — ALLOCAZIONE & INPUT",
    state: "Lettura CIN",
    action: "Inserimento 125 °C",
    codeLine: 5,
    ram: "125",
    justWritten: true,
    logicActive: false,
    terminal: "Temperatura reattore (°C): <span class='term-input'>125</span>\n",
    terminalUpdate: true,
    explain: [
      { type: "what", icon: "🔍", label: "INPUT", html: "L'utente inserisce <span class='term-input'>125</span> °C. La variabile in RAM ora vale 125." }
    ]
  },
  {
    phase: "STEP 2 — PRIMO TEST IF",
    state: "Confronto ALU",
    action: "Test 125 > 100",
    codeLine: 7,
    ram: "125",
    logicActive: true,
    logVar: "125",
    logOp: ">",
    logConst: "100",
    logRes: "true",
    terminal: "Temperatura reattore (°C): 125\n",
    explain: [
      { type: "what", icon: "🔍", label: "ALU", html: "La CPU verifica: <em>125 > 100 ?</em>" },
      { type: "logic", icon: "⚙️", label: "ESITO TRUE", html: "La condizione è <span class='val-highlight' style='color:var(--green)'>VERA</span>! Il programma entra subito nel primo blocco ed ignorerà gli altri rami." }
    ]
  },
  {
    phase: "STEP 3 — ESECUZIONE ALLARME",
    state: "Output",
    action: "Stampa messaggio critico",
    codeLine: 8,
    ram: "125",
    logicActive: true,
    logVar: "125",
    logOp: ">",
    logConst: "100",
    logRes: "true",
    terminal: "Temperatura reattore (°C): 125\n<span style='color:var(--red);font-weight:bold;'>ALLARME: Sovraccarico termico!</span>\n",
    terminalUpdate: true,
    explain: [
      { type: "alert", icon: "🚨", label: "ALLARME ATTIVO", html: "Stampa il messaggio di allarme sul terminale e salta direttamente alla fine della struttura condizionale." }
    ]
  },
  {
    phase: "STEP 4 — FINE PROGRAMMA",
    state: "Completato",
    action: "Return 0",
    codeLine: 15,
    ram: "125",
    logicActive: false,
    terminal: "Temperatura reattore (°C): 125\nALLARME: Sovraccarico termico!\n",
    explain: [
      { type: "what", icon: "🏁", label: "SALTO ELSE-IF/ELSE", html: "I blocchi <code>else if</code> ed <code>else</code> sono stati correttamente ignorati poiché il primo ramo era già vero." }
    ]
  }
];

let currentStep = 0;
let autoPlayInterval = null;

function renderCodeBlock(activeLineIndex) {
  const container = document.getElementById('code-container');
  container.innerHTML = '';
  codeLines.forEach((line, index) => {
    const div = document.createElement('div');
    div.className = `code-line ${index === activeLineIndex ? 'active' : ''}`;
    div.innerHTML = `<span class="line-num">${index + 1}</span><span class="line-content">${line}</span>`;
    container.appendChild(div);
  });
}

function renderStep(idx) {
  const step = steps[idx];
  document.getElementById('step-counter').innerText = `STEP ${idx} / ${steps.length - 1}`;
  document.getElementById('phase-name').innerText = step.phase;
  document.getElementById('phase-state').innerText = step.state;
  document.getElementById('phase-action').innerText = step.action;
  
  renderCodeBlock(step.codeLine);
  
  const ramVal = document.getElementById('ram-temp-val');
  const ramBox = document.getElementById('ram-temp-box');
  ramVal.innerText = step.ram;
  ramBox.classList.remove('just-written');
  void ramBox.offsetWidth;
  if(step.justWritten) ramBox.classList.add('just-written');
  
  const lb = document.getElementById('logic-box');
  if(step.logicActive) {
    lb.style.opacity = 1;
    document.getElementById('log-var').innerText = step.logVar;
    document.getElementById('log-op').innerText = step.logOp;
    document.getElementById('log-const').innerText = step.logConst;
    const lr = document.getElementById('log-res');
    lr.innerText = step.logRes.toUpperCase();
    lr.className = 'logic-result ' + step.logRes;
  } else {
    lb.style.opacity = 0.3;
    document.getElementById('log-var').innerText = '?';
    document.getElementById('log-res').innerText = '???';
    document.getElementById('log-res').className = 'logic-result';
  }
  
  const term = document.getElementById('terminal-output');
  term.innerHTML = step.terminal;
  if (step.terminalUpdate) {
    term.style.animation = 'none';
    term.offsetHeight;
    term.style.animation = 'writeFlash 0.5s ease-out';
  }
  
  const panel = document.getElementById('exp-panel');
  panel.innerHTML = '';
  step.explain.forEach((card, index) => {
    const div = document.createElement('div');
    div.className = `exp-card card-${card.type}`;
    div.style.animationDelay = `${index * 0.15}s`;
    div.innerHTML = `<div class="exp-card-header"><span>${card.icon}</span> ${card.label}</div><div class="exp-card-body">${card.html}</div>`;
    panel.appendChild(div);
  });
  
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === steps.length - 1;
  
  const pContainer = document.getElementById('progress-container');
  pContainer.innerHTML = '';
  steps.forEach((_, i) => {
    const pip = document.createElement('div');
    pip.className = `pip ${i < idx ? 'done' : ''} ${i === idx ? 'active' : ''}`;
    pip.onclick = () => goToStep(i);
    pContainer.appendChild(pip);
  });
}

function changeStep(delta) { goToStep(currentStep + delta); }
function goToStep(idx) {
  if (idx < 0 || idx >= steps.length) return;
  currentStep = idx;
  renderStep(currentStep);
  if (currentStep === steps.length - 1 && autoPlayInterval) toggleAuto();
}

function toggleAuto() {
  const btn = document.getElementById('btn-auto');
  if (autoPlayInterval) {
    clearInterval(autoPlayInterval);
    autoPlayInterval = null;
    btn.innerText = '▶ AUTO';
    btn.style.color = 'var(--cyan)';
    btn.style.borderColor = 'var(--cyan)';
  } else {
    btn.innerText = '⏸ PAUSA';
    btn.style.color = 'var(--yellow)';
    btn.style.borderColor = 'var(--yellow)';
    if (currentStep === steps.length - 1) goToStep(0);
    const speedLevel = document.getElementById('speed-slider').value;
    const delay = 3750 - (speedLevel * 700);
    autoPlayInterval = setInterval(() => changeStep(1), delay);
  }
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') changeStep(1);
  else if (e.key === 'ArrowLeft') changeStep(-1);
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
  else if (e.key.toLowerCase() === 'r') goToStep(0);
});

document.getElementById('speed-slider').addEventListener('input', () => {
  if (autoPlayInterval) { toggleAuto(); toggleAuto(); }
});

window.onload = () => renderStep(0);
</script>
<style>
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes writeFlash { 0% { background-color: var(--green); color: black; } 100% { background-color: transparent; color: inherit; } }
</style>
</body>
</html>
