<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soluzione - Livello 5: Accumulatori</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600&family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg: #070b14; --panel: #0d1424; --cyan: #00d4ff; --green: #00ff88; --red: #ff4466; --orange: #ff8c00; --purple: #bb44ff; --yellow: #ffd700; --white: #e8f0ff; --font-title: 'Orbitron', sans-serif; --font-mono: 'Share Tech Mono', monospace; --font-body: 'IBM Plex Mono', monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background-color: var(--bg); color: var(--white); font-family: var(--font-body); height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px); background-size: 30px 30px; }
  header { background-color: #04070d; border-bottom: 1px solid rgba(0, 212, 255, 0.2); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; }
  header h1 { font-family: var(--font-title); color: var(--cyan); margin: 0; font-size: 1.5rem; text-shadow: 0 0 10px rgba(0, 212, 255, 0.4); }
  .step-counter { font-family: var(--font-mono); color: var(--orange); font-size: 1.2rem; background: rgba(255, 140, 0, 0.1); padding: 0.3rem 0.8rem; border-radius: 4px; border: 1px solid rgba(255, 140, 0, 0.3); }
  .phase-bar { background-color: var(--panel); border-bottom: 1px solid rgba(0, 212, 255, 0.1); padding: 0.5rem 2rem; display: flex; gap: 2rem; font-family: var(--font-mono); font-size: 0.9rem; z-index: 9; }
  .phase-name { color: var(--purple); font-weight: bold; } .phase-state { color: var(--yellow); } .phase-action { color: var(--green); }
  main { flex: 1; display: flex; overflow: hidden; }
  .vis-panel { flex: 1; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; border-right: 1px solid rgba(0, 212, 255, 0.1); }
  .code-container { background-color: #03050a; border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 8px; padding: 1rem; font-family: var(--font-mono); font-size: 1.1rem; line-height: 1.7; position: relative; }
  .code-line { display: flex; padding: 0.1rem 0.5rem; border-radius: 4px; transition: all 0.3s; border-left: 3px solid transparent; }
  .code-line .line-num { color: #445577; width: 30px; user-select: none; }
  .code-line .line-content { color: #a0b0c0; transition: color 0.3s; }
  .code-line.active { background-color: rgba(0, 212, 255, 0.1); border-left: 3px solid var(--cyan); box-shadow: inset 0 0 15px rgba(0, 212, 255, 0.05); }
  .code-line.active .line-content { color: var(--white); text-shadow: 0 0 5px rgba(255,255,255,0.5); }
  
  .ram-container { background-color: #000; border: 1px solid rgba(187, 68, 255, 0.3); border-radius: 8px; padding: 1.5rem; display: flex; gap: 1rem; position: relative; box-shadow: 0 0 15px rgba(0,0,0,0.8) inset; }
  .ram-container::before { content: "RAM"; position: absolute; top: -10px; left: 20px; background-color: var(--bg); padding: 0 10px; font-size: 0.8rem; color: var(--purple); font-family: var(--font-mono); }
  .ram-cell { border: 2px solid var(--cyan); border-radius: 6px; width: 120px; background-color: #0a0d16; display: flex; flex-direction: column; align-items: center; transition: all 0.3s ease; }
  .ram-cell.just-written { animation: writeCell 0.5s ease-out; border-color: var(--green); box-shadow: 0 0 20px var(--green); }
  .ram-name { font-family: var(--font-mono); color: var(--cyan); padding: 5px 0; font-size: 0.9rem; border-bottom: 1px solid #334; width: 100%; text-align: center; }
  .ram-value { font-family: var(--font-mono); color: var(--green); padding: 10px 0; font-size: 1.5rem; font-weight: bold; }
  @keyframes writeCell { 0% { transform: scale(1.1); background-color: rgba(0, 255, 136, 0.2); } 100% { transform: scale(1); background-color: #0a0d16; } }

  .terminal-container { background-color: #000; border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 8px; min-height: 120px; padding: 1rem; font-family: var(--font-mono); color: var(--green); position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.8) inset; white-space: pre-wrap; font-size: 1.1rem; }
  .terminal-container::before { content: "TERMINALE"; position: absolute; top: -10px; left: 20px; background-color: var(--bg); padding: 0 10px; font-size: 0.8rem; color: var(--green); }
  
  .exp-panel { width: 380px; background-color: var(--panel); padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  .exp-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 1rem; animation: fadeSlide 0.4s ease-out forwards; }
  .exp-card.card-what { border-top: 3px solid var(--cyan); } .exp-card.card-why { border-top: 3px solid var(--yellow); } .exp-card.card-logic { border-top: 3px solid var(--purple); } .exp-card.card-alert { border-top: 3px solid var(--red); }
  .exp-card-header { display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-title); font-size: 0.9rem; margin-bottom: 0.8rem; }
  .card-what .exp-card-header { color: var(--cyan); } .card-why .exp-card-header { color: var(--yellow); } .card-logic .exp-card-header { color: var(--purple); } .card-alert .exp-card-header { color: var(--red); }
  .exp-card-body { font-size: 0.95rem; line-height: 1.5; color: #ccd6f6; }
  .keyword { color: var(--orange); font-family: var(--font-mono); }
  
  .controls { background-color: #04070d; border-top: 1px solid rgba(0, 212, 255, 0.2); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
  .btn { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); font-family: var(--font-title); padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; font-size: 0.9rem; }
  .btn:hover:not(:disabled) { background: rgba(0, 212, 255, 0.1); box-shadow: 0 0 10px rgba(0, 212, 255, 0.3); } .btn:disabled { border-color: #334; color: #556; cursor: not-allowed; }
  .progress-container { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: 400px; justify-content: center; }
  .pip { width: 12px; height: 12px; border-radius: 50%; background: #334; cursor: pointer; margin-bottom: 5px; } .pip.done { background: rgba(0, 255, 136, 0.4); } .pip.active { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); transform: scale(1.2); }
  
  .loop-arrow { position: absolute; left: 10px; top: 75px; height: 155px; width: 30px; border-left: 2px dashed var(--orange); border-bottom: 2px dashed var(--orange); border-top: 2px dashed var(--orange); border-radius: 8px 0 0 8px; opacity: 0; transition: opacity 0.3s; z-index: 5; }
</style>
</head>
<body>

  <header>
    <h1>&lt; SIMULATORE /&gt; Livello 5: Statistiche</h1>
    <div class="step-counter" id="step-counter">STEP 0 / X</div>
  </header>

  <div class="phase-bar">
    <div class="phase-name" id="phase-name">INTRO</div>
    <div class="phase-state" id="phase-state">Pronto</div>
    <div class="phase-action" id="phase-action">...</div>
  </div>

  <main>
    <div class="vis-panel">
      <div class="code-container" id="code-container">
        <div class="loop-arrow" id="loop-arrow"></div>
        <div id="code-lines"></div>
      </div>
      
      <div class="ram-container" id="ram-container">
        <div class="ram-cell" id="ram-oroTrovato-box"><div class="ram-name">oroTrovato</div><div class="ram-value" id="ram-oroTrovato-val">?</div></div>
        <div class="ram-cell" id="ram-totaleOro-box"><div class="ram-name">totaleOro</div><div class="ram-value" id="ram-totaleOro-val">0</div></div>
        <div class="ram-cell" id="ram-numeroBauli-box"><div class="ram-name">numeroBauli</div><div class="ram-value" id="ram-numeroBauli-val">0</div></div>
      </div>
      
      <div class="terminal-container" id="terminal-container">
        <span id="terminal-output"></span><span class="cursor" style="color: var(--green);">_</span>
      </div>
    </div>
    <div class="exp-panel" id="exp-panel"></div>
  </main>

  <div class="controls">
    <button class="btn" id="btn-prev" onclick="changeStep(-1)">◀ INDIETRO</button>
    <button class="btn" id="btn-reset" onclick="goToStep(0)">↺ RESET</button>
    <div class="progress-container" id="progress-container"></div>
    <button class="btn" id="btn-next" onclick="changeStep(1)">AVANTI ▶</button>
  </div>

<script>
const codeLines = [
  "int totaleOro = 0; int numeroBauli = 0;",
  "int oroTrovato;",
  "do {",
  "    std::cin >> oroTrovato;",
  "    if (oroTrovato > 0) {",
  "        totaleOro += oroTrovato; // ACCUMULATORE",
  "        numeroBauli++;           // CONTATORE",
  "    }",
  "} while (oroTrovato != 0);",
  "std::cout << \"Statistiche...\";"
];

const steps = [
  {
    phase: "INIT", state: "Azzeramento", action: "Creo le variabili",
    codeLine: 0, ram: { oro: "?", tot: "0", bauli: "0" }, justWritten: '', terminal: "", showArrow: false,
    explain: [ { type: "what", icon: "🔍", label: "INIT", html: "È fondamentale inizializzare i totalizzatori a 0, altrimenti conterranno dati spazzatura rimasti nella RAM!" } ]
  },
  {
    phase: "ITERAZIONE 1", state: "Ingresso incondizionato", action: "Entro nel do-while",
    codeLine: 2, ram: { oro: "?", tot: "0", bauli: "0" }, justWritten: '', terminal: "", showArrow: false,
    explain: [ { type: "logic", icon: "⚙️", label: "DO", html: "Il <span class='keyword'>do</span> forza il programma ad entrare subito nel blocco, senza controllare nessuna condizione. Il test è alla fine!" } ]
  },
  {
    phase: "ITERAZIONE 1", state: "Input Utente", action: "Leggo oro",
    codeLine: 3, ram: { oro: "50", tot: "0", bauli: "0" }, justWritten: 'oro', terminal: "> Monete nel baule: 50\n", showArrow: false,
    explain: [ { type: "what", icon: "🔍", label: "INPUT", html: "L'utente ha aperto un baule con 50 monete d'oro." } ]
  },
  {
    phase: "ITERAZIONE 1", state: "Accumulo (+=)", action: "Sommo al totale",
    codeLine: 5, ram: { oro: "50", tot: "50", bauli: "0" }, justWritten: 'tot', terminal: "> Monete nel baule: 50\n", showArrow: false,
    explain: [ 
      { type: "what", icon: "➕", label: "+=", html: "<span class='keyword'>totaleOro += oroTrovato;</span> prende lo zero precedente e vi aggiunge 50. Ora in RAM totaleOro vale 50." },
      { type: "why", icon: "💡", label: "Equivalenza", html: "È identico a scrivere <code>totale = totale + 50</code>, ma molto più compatto." }
    ]
  },
  {
    phase: "ITERAZIONE 1", state: "Conteggio (++)", action: "Incremento di 1",
    codeLine: 6, ram: { oro: "50", tot: "50", bauli: "1" }, justWritten: 'bauli', terminal: "> Monete nel baule: 50\n", showArrow: false,
    explain: [ { type: "what", icon: "📈", label: "++", html: "<span class='keyword'>numeroBauli++;</span> incrementa il contatore di 1 esatto. Ora vale 1." } ]
  },
  {
    phase: "ITERAZIONE 1", state: "Condizione Finale", action: "Test del do-while",
    codeLine: 8, ram: { oro: "50", tot: "50", bauli: "1" }, justWritten: '', terminal: "> Monete nel baule: 50\n", showArrow: true,
    explain: [ { type: "logic", icon: "⚙️", label: "WHILE", html: "<em>\"oroTrovato (50) è diverso da 0?\"</em> SÌ. Il ciclo ritorna su al DO!" } ]
  },
  
  // ITERAZIONE 2
  {
    phase: "ITERAZIONE 2", state: "Input Utente", action: "Leggo oro",
    codeLine: 3, ram: { oro: "20", tot: "50", bauli: "1" }, justWritten: 'oro', terminal: "> Monete nel baule: 50\n> Monete nel baule: 20\n", showArrow: false,
    explain: [ { type: "what", icon: "🔍", label: "INPUT", html: "Nuovo baule: 20 monete." } ]
  },
  {
    phase: "ITERAZIONE 2", state: "Accumulo (+=)", action: "Sommo al totale",
    codeLine: 5, ram: { oro: "20", tot: "70", bauli: "1" }, justWritten: 'tot', terminal: "> Monete nel baule: 50\n> Monete nel baule: 20\n", showArrow: false,
    explain: [ { type: "what", icon: "➕", label: "+=", html: "Ora in RAM <span class='keyword'>totaleOro</span> vale 50. Aggiungiamo 20. Diventa 70!" } ]
  },
  {
    phase: "ITERAZIONE 2", state: "Conteggio (++)", action: "Incremento di 1",
    codeLine: 6, ram: { oro: "20", tot: "70", bauli: "2" }, justWritten: 'bauli', terminal: "> Monete nel baule: 50\n> Monete nel baule: 20\n", showArrow: false,
    explain: [ { type: "what", icon: "📈", label: "++", html: "<span class='keyword'>numeroBauli++;</span> lo porta da 1 a 2." } ]
  },
  {
    phase: "ITERAZIONE 2", state: "Condizione Finale", action: "Test del do-while",
    codeLine: 8, ram: { oro: "20", tot: "70", bauli: "2" }, justWritten: '', terminal: "> Monete nel baule: 50\n> Monete nel baule: 20\n", showArrow: true,
    explain: [ { type: "logic", icon: "⚙️", label: "WHILE", html: "<em>\"20 != 0\"</em> SÌ. Torniamo su." } ]
  },
  
  // ITERAZIONE 3 - EXIT
  {
    phase: "ITERAZIONE 3", state: "Input Utente", action: "Leggo oro",
    codeLine: 3, ram: { oro: "0", tot: "70", bauli: "2" }, justWritten: 'oro', terminal: "> Monete nel baule: 50\n> Monete nel baule: 20\n> Monete nel baule: 0\n", showArrow: false,
    explain: [ { type: "what", icon: "🔍", label: "INPUT", html: "L'utente inserisce 0 (finito)." } ]
  },
  {
    phase: "ITERAZIONE 3", state: "Condizione Finale", action: "Uscita dal ciclo",
    codeLine: 8, ram: { oro: "0", tot: "70", bauli: "2" }, justWritten: '', terminal: "> Monete nel baule: 50\n> Monete nel baule: 20\n> Monete nel baule: 0\n", showArrow: false,
    explain: [
      { type: "what", icon: "🚫", label: "IF SALTATO", html: "Siccome 0 non è > 0, non modifichiamo accumulatore e contatore." },
      { type: "logic", icon: "⚙️", label: "EXIT", html: "<em>\"0 != 0\"</em> FALSO! Il ciclo si rompe." }
    ]
  },
  {
    phase: "FINE", state: "Riepilogo", action: "Stampa Statistiche",
    codeLine: 9, ram: { oro: "0", tot: "70", bauli: "2" }, justWritten: '', terminal: "> Monete nel baule: 50\n> Monete nel baule: 20\n> Monete nel baule: 0\n\nBauli Aperti: 2\nOro Totale: 70", showArrow: false,
    explain: [ { type: "what", icon: "🏁", label: "SUCCESSO", html: "E così i computer calcolano statistiche processando migliaia di dati in sequenza!" } ]
  }
];

function renderCodeBlock(activeLineIndex, showArrow) {
  const c = document.getElementById('code-lines');
  c.innerHTML = '';
  codeLines.forEach((line, index) => {
    const div = document.createElement('div');
    div.className = `code-line ${index === activeLineIndex ? 'active' : ''}`;
    div.innerHTML = `<span class="line-num">${index + 1}</span><span class="line-content">${line}</span>`;
    c.appendChild(div);
  });
  document.getElementById('loop-arrow').style.opacity = showArrow ? '1' : '0';
}

function renderStep(idx) {
  const step = steps[idx];
  document.getElementById('step-counter').innerText = `STEP ${idx} / ${steps.length - 1}`;
  document.getElementById('phase-name').innerText = step.phase;
  document.getElementById('phase-state').innerText = step.state;
  document.getElementById('phase-action').innerText = step.action;
  
  renderCodeBlock(step.codeLine, step.showArrow);
  
  document.getElementById('ram-oroTrovato-val').innerText = step.ram.oro;
  document.getElementById('ram-totaleOro-val').innerText = step.ram.tot;
  document.getElementById('ram-numeroBauli-val').innerText = step.ram.bauli;
  
  ['oroTrovato', 'totaleOro', 'numeroBauli'].forEach(k => {
    const box = document.getElementById(`ram-${k}-box`);
    box.classList.remove('just-written');
    void box.offsetWidth;
    if(step.justWritten === 'oro' && k === 'oroTrovato') box.classList.add('just-written');
    if(step.justWritten === 'tot' && k === 'totaleOro') box.classList.add('just-written');
    if(step.justWritten === 'bauli' && k === 'numeroBauli') box.classList.add('just-written');
  });
  
  document.getElementById('terminal-output').innerText = step.terminal;
  
  const panel = document.getElementById('exp-panel');
  panel.innerHTML = '';
  step.explain.forEach((card, index) => {
    const div = document.createElement('div');
    div.className = `exp-card card-${card.type}`;
    div.style.animationDelay = `${index * 0.15}s`;
    div.innerHTML = `<div class="exp-card-header"><span>${card.icon}</span> ${card.label}</div><div class="exp-card-body">${card.html}</div>`;
    panel.appendChild(div);
  });
  
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === steps.length - 1;
  const pContainer = document.getElementById('progress-container');
  pContainer.innerHTML = '';
  steps.forEach((_, i) => {
    const pip = document.createElement('div');
    pip.className = `pip ${i < idx ? 'done' : ''} ${i === idx ? 'active' : ''}`;
    pip.onclick = () => goToStep(i);
    pContainer.appendChild(pip);
  });
}

let currentStep = 0;
function changeStep(delta) { goToStep(currentStep + delta); }
function goToStep(idx) {
  if (idx < 0 || idx >= steps.length) return;
  currentStep = idx; renderStep(currentStep);
}
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') changeStep(1); else if (e.key === 'ArrowLeft') changeStep(-1);
});
window.onload = () => renderStep(0);
</script>
</body>
</html>
