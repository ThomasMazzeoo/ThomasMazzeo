<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soluzione - Livello 1.1: Telemetria Drone</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600&family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b14;
    --panel: #0d1424;
    --cyan: #00d4ff;
    --green: #00ff88;
    --red: #ff4466;
    --orange: #ff8c00;
    --purple: #bb44ff;
    --yellow: #ffd700;
    --white: #e8f0ff;
    --font-title: 'Orbitron', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-body: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg);
    color: var(--white);
    font-family: var(--font-body);
    height: 100vh; height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-image: 
      linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
    background-size: 30px 30px;
  }

  header {
    background-color: #04070d;
    border-bottom: 1px solid rgba(0, 212, 255, 0.2);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    z-index: 10;
  }
  header h1 {
    font-family: var(--font-title);
    color: var(--cyan);
    margin: 0;
    font-size: 1.4rem;
    text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
  }
  .step-counter {
    font-family: var(--font-mono);
    color: var(--orange);
    font-size: 1.2rem;
    background: rgba(255, 140, 0, 0.1);
    padding: 0.3rem 0.8rem;
    border-radius: 4px;
    border: 1px solid rgba(255, 140, 0, 0.3);
  }

  .phase-bar {
    background-color: var(--panel);
    border-bottom: 1px solid rgba(0, 212, 255, 0.1);
    padding: 0.5rem 2rem;
    display: flex;
    gap: 2rem;
    font-family: var(--font-mono);
    font-size: 0.9rem;
    z-index: 9;
  }
  .phase-name { color: var(--purple); font-weight: bold; }
  .phase-state { color: var(--yellow); }
  .phase-action { color: var(--green); }

  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .vis-panel {
    flex: 1;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    overflow-y: auto;
    border-right: 1px solid rgba(0, 212, 255, 0.1);
  }

  .code-container {
    background-color: #03050a;
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 8px;
    padding: 1rem;
    font-family: var(--font-mono);
    font-size: 1.05rem;
    line-height: 1.7;
  }

  .code-line {
    display: flex;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    transition: all 0.3s;
    border-left: 3px solid transparent;
  }
  .code-line .line-num { color: #445577; width: 30px; user-select: none; }
  .code-line .line-content { color: #a0b0c0; transition: color 0.3s; }
  .code-line.active {
    background-color: rgba(0, 212, 255, 0.1);
    border-left: 3px solid var(--cyan);
    box-shadow: inset 0 0 15px rgba(0, 212, 255, 0.05);
  }
  .code-line.active .line-content {
    color: var(--white);
    text-shadow: 0 0 5px rgba(255,255,255,0.5);
  }

  .ram-container {
    background-color: #000;
    border: 1px solid rgba(187, 68, 255, 0.3);
    border-radius: 8px;
    padding: 1.5rem;
    display: flex;
    gap: 1.2rem;
    flex-wrap: wrap;
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.8) inset;
    min-height: 120px;
  }
  .ram-container::before {
    content: "MEMORIA RAM (ALLOCAZIONE VARIABILI)";
    position: absolute;
    top: -10px;
    left: 20px;
    background-color: var(--bg);
    padding: 0 10px;
    font-size: 0.8rem;
    color: var(--purple);
    font-family: var(--font-mono);
  }

  .ram-cell {
    border: 2px solid #334;
    border-radius: 6px;
    width: 135px;
    background-color: #0a0d16;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0.3;
    transition: all 0.5s ease;
  }
  .ram-cell.allocated {
    opacity: 1;
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
  }
  .ram-cell.just-written {
    animation: writeCell 0.5s ease-out;
    border-color: var(--green);
    box-shadow: 0 0 15px var(--green);
  }

  .ram-type {
    font-size: 0.75rem;
    color: var(--yellow);
    background: rgba(255, 215, 0, 0.1);
    width: 100%;
    text-align: center;
    padding: 2px 0;
    border-top-left-radius: 4px;
    border-top-right-radius: 4px;
    font-family: var(--font-mono);
  }
  .ram-name {
    font-family: var(--font-mono);
    color: var(--cyan);
    padding: 4px 0;
    font-size: 0.85rem;
    border-bottom: 1px solid #334;
    width: 100%;
    text-align: center;
  }
  .ram-value {
    font-family: var(--font-mono);
    color: var(--green);
    padding: 8px 0;
    font-size: 1.1rem;
    font-weight: bold;
    word-break: break-all;
    text-align: center;
  }

  @keyframes writeCell {
    0% { transform: scale(1.1); background-color: rgba(0, 255, 136, 0.2); }
    100% { transform: scale(1); background-color: #0a0d16; }
  }

  .terminal-container {
    background-color: #000;
    border: 1px solid rgba(0, 255, 136, 0.3);
    border-radius: 8px;
    min-height: 120px;
    padding: 1rem;
    font-family: var(--font-mono);
    color: var(--green);
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.8) inset;
    white-space: pre-wrap;
  }
  .terminal-container::before {
    content: "TERMINALE / TELEMETRIA";
    position: absolute;
    top: -10px;
    left: 20px;
    background-color: var(--bg);
    padding: 0 10px;
    font-size: 0.8rem;
    color: var(--green);
  }

  .exp-panel {
    width: 380px;
    background-color: var(--panel);
    padding: 2rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .exp-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 1rem;
    animation: fadeSlide 0.4s ease-out forwards;
  }
  
  .exp-card.card-what { border-top: 3px solid var(--cyan); }
  .exp-card.card-why { border-top: 3px solid var(--yellow); }
  .exp-card.card-logic { border-top: 3px solid var(--purple); }
  .exp-card.card-alert { border-top: 3px solid var(--orange); }

  .exp-card-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-title);
    font-size: 0.9rem;
    margin-bottom: 0.8rem;
    letter-spacing: 1px;
  }
  .card-what .exp-card-header { color: var(--cyan); }
  .card-why .exp-card-header { color: var(--yellow); }
  .card-logic .exp-card-header { color: var(--purple); }
  .card-alert .exp-card-header { color: var(--orange); }

  .exp-card-body {
    font-size: 0.95rem;
    line-height: 1.5;
    color: #ccd6f6;
  }

  .keyword { color: var(--orange); font-family: var(--font-mono); }
  .val-highlight { color: var(--green); font-weight: bold; font-family: var(--font-mono); }

  .controls {
    background-color: #04070d;
    border-top: 1px solid rgba(0, 212, 255, 0.2);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  .btn {
    background: transparent;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: var(--font-title);
    padding: 0.5rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    font-size: 0.9rem;
  }
  .btn:hover:not(:disabled) {
    background: rgba(0, 212, 255, 0.1);
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
  }
  .btn:disabled {
    border-color: #334;
    color: #556;
    cursor: not-allowed;
  }
  .btn.btn-play { border-color: var(--green); color: var(--green); }
  .btn.btn-play:hover:not(:disabled) { background: rgba(0, 255, 136, 0.1); box-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }

  .progress-container { display: flex; gap: 8px; align-items: center; }
  .pip { width: 12px; height: 12px; border-radius: 50%; background: #334; cursor: pointer; transition: all 0.3s; }
  .pip.done { background: rgba(0, 255, 136, 0.4); }
  .pip.active { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); transform: scale(1.2); }

  .speed-control { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 0.8rem; color: #889; }

  @media (max-width: 900px) {
    main { flex-direction: column; overflow-y: auto; }
    .exp-panel { width: 100%; border-top: 1px solid rgba(0, 212, 255, 0.2); }
    .vis-panel { overflow: visible; }
    .controls { flex-wrap: wrap; justify-content: center; gap: 10px; padding: 1rem; }
    .progress-container { order: -1; width: 100%; justify-content: center; margin-bottom: 10px; }
    .speed-control { width: 100%; justify-content: center; margin: 5px 0; }
    .btn { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
  }
</style>
</head>
<body>

  <header>
    <h1>&lt; SIMULATORE C++ /&gt; Livello 1.1: Telemetria Drone</h1>
    <div class="step-counter" id="step-counter">STEP 0 / X</div>
  </header>

  <div class="phase-bar">
    <div class="phase-name" id="phase-name">INTRO</div>
    <div class="phase-state" id="phase-state">Pronto</div>
    <div class="phase-action" id="phase-action">...</div>
  </div>

  <main>
    <div class="vis-panel">
      <div class="code-container" id="code-container"></div>
      
      <div class="ram-container" id="ram-container">
        <div class="ram-cell" id="ram-nomeDrone"><div class="ram-type">???</div><div class="ram-name">---</div><div class="ram-value">?</div></div>
        <div class="ram-cell" id="ram-batteria"><div class="ram-type">???</div><div class="ram-name">---</div><div class="ram-value">?</div></div>
        <div class="ram-cell" id="ram-velocita"><div class="ram-type">???</div><div class="ram-name">---</div><div class="ram-value">?</div></div>
        <div class="ram-cell" id="ram-moduloAttivo"><div class="ram-type">???</div><div class="ram-name">---</div><div class="ram-value">?</div></div>
      </div>
      
      <div class="terminal-container" id="terminal-container">
        <span id="terminal-output"></span>
        <span class="cursor" style="animation: blink 1s step-end infinite; color: var(--green);">_</span>
      </div>
    </div>

    <div class="exp-panel" id="exp-panel"></div>
  </main>

  <div class="controls">
    <button class="btn" id="btn-prev" onclick="changeStep(-1)">◀ INDIETRO</button>
    <button class="btn" id="btn-reset" onclick="goToStep(0)">↺ RESET</button>
    <div class="progress-container" id="progress-container"></div>
    <div class="speed-control">
      Lento <input type="range" id="speed-slider" min="1" max="5" value="3"> Veloce
    </div>
    <button class="btn btn-play" id="btn-auto" onclick="toggleAuto()">▶ AUTO</button>
    <button class="btn" id="btn-next" onclick="changeStep(1)">AVANTI ▶</button>
  </div>

<script>
const codeLines = [
  "#include &lt;iostream&gt;",
  "#include &lt;string&gt;",
  "",
  "int main() {",
  "    std::string nomeDrone = \"Scout-X\";",
  "    int batteria = 85;",
  "    double velocita = 124.5;",
  "    bool moduloAttivo = true;",
  "",
  "    std::cout << \"--- TELEMETRIA DRONE ---\" << std::endl;",
  "    std::cout << \"Drone: \" << nomeDrone << \" | Batteria: \" << batteria << \"%\" << std::endl;",
  "    std::cout << \"Velocita: \" << velocita << \" km/h | Modulo: \" << moduloAttivo << std::endl;",
  "",
  "    return 0;",
  "}"
];

const steps = [
  {
    phase: "STEP 0 — INTRO",
    state: "Inizio",
    action: "Analisi Tipi di Dato",
    codeLine: -1,
    ram: {},
    terminal: "",
    explain: [
      { type: "what", icon: "🔍", label: "COSA SUCCEDE", html: "Esploriamo i 4 tipi di variabili essenziali in C++ senza usare il tipo char: stringhe, interi, decimali e booleani." },
      { type: "logic", icon: "⚙️", label: "RAM", html: "Ogni tipo occupa una quantità di memoria specifica e definisce che operazioni possiamo compiere sul dato." }
    ]
  },
  {
    phase: "STEP 1 — STRINGA (NOME)",
    state: "Allocazione",
    action: "Salvo il nome del drone",
    codeLine: 4,
    ram: {
      nomeDrone: { type: "std::string", val: "\"Scout-X\"", justWritten: true }
    },
    terminal: "",
    explain: [
      { type: "what", icon: "🔍", label: "COSA SUCCEDE", html: "Dichiariamo una variabile di tipo <span class='keyword'>std::string</span>. Conterrà la parola <code>\"Scout-X\"</code> racchiusa tra doppie virgolette." },
      { type: "why", icon: "💡", label: "LIBRERIA STRING", html: "Per usare <code>std::string</code> includiamo l'header <span class='keyword'>#include &lt;string&gt;</span> alla riga 2." }
    ]
  },
  {
    phase: "STEP 2 — NUMERO INTERO (BATTERIA)",
    state: "Allocazione",
    action: "Salvo la percentuale",
    codeLine: 5,
    ram: {
      nomeDrone: { type: "std::string", val: "\"Scout-X\"" },
      batteria: { type: "int", val: "85", justWritten: true }
    },
    terminal: "",
    explain: [
      { type: "what", icon: "🔍", label: "COSA SUCCEDE", html: "Creiamo la variabile <span class='keyword'>int batteria = 85</span>. Il tipo <code>int</code> è ideale per contatori o percentuali intere." }
    ]
  },
  {
    phase: "STEP 3 — DECIMALE (VELOCITÀ)",
    state: "Allocazione",
    action: "Salvo valore in virgola mobile",
    codeLine: 6,
    ram: {
      nomeDrone: { type: "std::string", val: "\"Scout-X\"" },
      batteria: { type: "int", val: "85" },
      velocita: { type: "double", val: "124.5", justWritten: true }
    },
    terminal: "",
    explain: [
      { type: "what", icon: "🔍", label: "COSA SUCCEDE", html: "Creiamo la variabile <span class='keyword'>double velocita = 124.5</span>. In C++ si usa il punto decimale <code>.</code> anziché la virgola!" }
    ]
  },
  {
    phase: "STEP 4 — BOOLEANO (STATO MODULO)",
    state: "Allocazione",
    action: "Salvo valore logico",
    codeLine: 7,
    ram: {
      nomeDrone: { type: "std::string", val: "\"Scout-X\"" },
      batteria: { type: "int", val: "85" },
      velocita: { type: "double", val: "124.5" },
      moduloAttivo: { type: "bool", val: "true (1)", justWritten: true }
    },
    terminal: "",
    explain: [
      { type: "what", icon: "🔍", label: "COSA SUCCEDE", html: "La variabile <span class='keyword'>bool moduloAttivo = true</span> memorizza uno stato binario: vero (1) o falso (0)." }
    ]
  },
  {
    phase: "STEP 5 — STAMPA INTESTAZIONE",
    state: "Output",
    action: "Stampa titolo telemetria",
    codeLine: 9,
    ram: {
      nomeDrone: { type: "std::string", val: "\"Scout-X\"" },
      batteria: { type: "int", val: "85" },
      velocita: { type: "double", val: "124.5" },
      moduloAttivo: { type: "bool", val: "true (1)" }
    },
    terminal: "--- TELEMETRIA DRONE ---\n",
    terminalUpdate: true,
    explain: [
      { type: "what", icon: "🔍", label: "COSA SUCCEDE", html: "Stampiamo una riga di separazione con <span class='keyword'>std::cout</span>." }
    ]
  },
  {
    phase: "STEP 6 — STAMPA REPORT COMPLETO",
    state: "Output Finale",
    action: "Concatenazione variabili",
    codeLine: 11,
    ram: {
      nomeDrone: { type: "std::string", val: "\"Scout-X\"" },
      batteria: { type: "int", val: "85" },
      velocita: { type: "double", val: "124.5" },
      moduloAttivo: { type: "bool", val: "true (1)" }
    },
    terminal: "--- TELEMETRIA DRONE ---\nDrone: Scout-X | Batteria: 85%\nVelocita: 124.5 km/h | Modulo: 1\n",
    terminalUpdate: true,
    explain: [
      { type: "what", icon: "🔍", label: "COSA SUCCEDE", html: "Leggiamo tutte le variabili dalla RAM e le inviamo al terminale formattando il testo!" },
      { type: "logic", icon: "⚙️", label: "NOTA BOOLEANI", html: "In C++, stampando un booleano <code>true</code> a terminale con <code>cout</code> viene stampato il numero <code>1</code> (mentre <code>false</code> stampa <code>0</code>)." }
    ]
  }
];

let currentStep = 0;
let autoPlayInterval = null;

function renderCodeBlock(activeLineIndex) {
  const container = document.getElementById('code-container');
  container.innerHTML = '';
  codeLines.forEach((line, index) => {
    const div = document.createElement('div');
    div.className = `code-line ${index === activeLineIndex ? 'active' : ''}`;
    div.innerHTML = `<span class="line-num">${index + 1}</span><span class="line-content">${line}</span>`;
    container.appendChild(div);
  });
}

function updateRam(ramData) {
  const vars = ['nomeDrone', 'batteria', 'velocita', 'moduloAttivo'];
  vars.forEach(v => {
    const el = document.getElementById(`ram-${v}`);
    const data = ramData[v];
    el.classList.remove('allocated', 'just-written');
    void el.offsetWidth;
    if (data) {
      el.classList.add('allocated');
      if (data.justWritten) el.classList.add('just-written');
      el.querySelector('.ram-type').innerText = data.type;
      el.querySelector('.ram-name').innerText = v;
      el.querySelector('.ram-value').innerText = data.val;
    } else {
      el.querySelector('.ram-type').innerText = '???';
      el.querySelector('.ram-name').innerText = '---';
      el.querySelector('.ram-value').innerText = '?';
    }
  });
}

function renderExplanation(explainData) {
  const panel = document.getElementById('exp-panel');
  panel.innerHTML = '';
  explainData.forEach((card, index) => {
    const div = document.createElement('div');
    div.className = `exp-card card-${card.type}`;
    div.style.animationDelay = `${index * 0.15}s`;
    div.innerHTML = `<div class="exp-card-header"><span>${card.icon}</span> ${card.label}</div><div class="exp-card-body">${card.html}</div>`;
    panel.appendChild(div);
  });
}

function renderPips() {
  const container = document.getElementById('progress-container');
  container.innerHTML = '';
  steps.forEach((_, idx) => {
    const pip = document.createElement('div');
    pip.className = `pip ${idx < currentStep ? 'done' : ''} ${idx === currentStep ? 'active' : ''}`;
    pip.onclick = () => goToStep(idx);
    container.appendChild(pip);
  });
}

function renderStep(idx) {
  const step = steps[idx];
  document.getElementById('step-counter').innerText = `STEP ${idx} / ${steps.length - 1}`;
  document.getElementById('phase-name').innerText = step.phase;
  document.getElementById('phase-state').innerText = step.state;
  document.getElementById('phase-action').innerText = step.action;
  
  renderCodeBlock(step.codeLine);
  updateRam(step.ram);
  
  const term = document.getElementById('terminal-output');
  term.innerHTML = step.terminal;
  if (step.terminalUpdate) {
    term.style.animation = 'none';
    term.offsetHeight;
    term.style.animation = 'writeFlash 0.5s ease-out';
  }
  
  renderExplanation(step.explain);
  
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === steps.length - 1;
  renderPips();
}

function changeStep(delta) { goToStep(currentStep + delta); }
function goToStep(idx) {
  if (idx < 0 || idx >= steps.length) return;
  currentStep = idx;
  renderStep(currentStep);
  if (currentStep === steps.length - 1 && autoPlayInterval) toggleAuto();
}

function toggleAuto() {
  const btn = document.getElementById('btn-auto');
  if (autoPlayInterval) {
    clearInterval(autoPlayInterval);
    autoPlayInterval = null;
    btn.innerText = '▶ AUTO';
    btn.style.color = 'var(--cyan)';
    btn.style.borderColor = 'var(--cyan)';
  } else {
    btn.innerText = '⏸ PAUSA';
    btn.style.color = 'var(--yellow)';
    btn.style.borderColor = 'var(--yellow)';
    if (currentStep === steps.length - 1) goToStep(0);
    const speedLevel = document.getElementById('speed-slider').value;
    const delay = 3750 - (speedLevel * 700);
    autoPlayInterval = setInterval(() => changeStep(1), delay);
  }
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') changeStep(1);
  else if (e.key === 'ArrowLeft') changeStep(-1);
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
  else if (e.key.toLowerCase() === 'r') goToStep(0);
});

document.getElementById('speed-slider').addEventListener('input', () => {
  if (autoPlayInterval) { toggleAuto(); toggleAuto(); }
});

window.onload = () => renderStep(0);
</script>
<style>
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes writeFlash { 0% { background-color: var(--green); color: black; } 100% { background-color: transparent; color: inherit; } }
